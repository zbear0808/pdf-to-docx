[project]
name = "pdf-to-docx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zubair Ahmed", email = "zahmed0808@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.25.0",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
pdf-to-docx = "pdf_to_docx:main"
pdf-to-latex = "pdf_to_latex:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
