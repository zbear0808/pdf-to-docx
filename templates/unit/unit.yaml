# {course} Unit {unit}: {title}
course: {course}
unit: {unit}
unit_title: {title}
period: "{period}"
budget:
  minutes: 40          # lesson-scope: every lesson fits a 40-minute period
  handout_pages: 3
  practice_pages: 2
lessons:               # files in lessons/, in teaching order
  - example.yaml
assessments: [assessments/*.yaml]   # progress checks, quizzes, tests, reviews, reference sheets (one YAML per form)
figures: figures.py    # shared @figure functions (optional); student and key PNGs come from the same function
# Per-document figures go in figures/<stem>.py (stem = YAML file stem); `lesson-builder scaffold` writes one.
