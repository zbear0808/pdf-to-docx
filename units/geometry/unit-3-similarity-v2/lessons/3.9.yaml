id: 3.9
title: Angle-Angle similarity
notes_title: Angle-Angle similarity
framing: >-
  What is the least information you need to know that two triangles are similar?
materials: protractor, ruler
numbering: auto
headings: warmup
numbering_after_notes: continue

sections:
  - kind: warmup
    items:
      - minutes: 3
        prompt:
          - '$\triangle P''Q''R''$ is the image of $\triangle PQR$ after a dilation with scale factor $\frac{1}{2}$. Matching arcs show congruent angles.'
          - '$\angle Q''\cong\angle T$, $Q''R''=TU=1$, and $\angle R''\cong\angle U$.'
          - 'Which shows $\triangle P''Q''R''\cong\triangle STU$: SSS, SAS, or ASA?'
        figure: 3.9_warmup
        fig_w: 2.0
        frame:
          - ['Congruent by', 'ASA', '.']

  - kind: together
    items:
      - n: 1
        id: one_angle
        minutes: 2
        prompt: 'Each triangle has a $45^\circ$ angle.'
        figure: 3.9_p1
        fill: [['Are the triangles similar? (yes or no)', 'no']]
        box_w: 0.9
        work: 0.6
        answer: 'The other two angles do not match ($100^\circ$ and $35^\circ$, $60^\circ$ and $75^\circ$), so the shapes are different. One pair of congruent angles is not enough.'

  - kind: partner
    items:
      - n: 2
        id: draw
        minutes: 2
        prompt:
          - 'Each triangle has a $45^\circ$ angle and a $30^\circ$ angle. The side between them is 2 cm in Triangle 1 and 6 cm in Triangle 2.'
          - 'The figure shows each side with its $45^\circ$ and $30^\circ$ angles.'
          - 'Extend each $30^\circ$ side until it meets the $45^\circ$ side.'
        figure: 3.9_p2
        work: 0.6
        answer: 'Both triangles have angles $45^\circ$, $30^\circ$, and $105^\circ$. Same shape; Triangle 2 is 3 times as big.'
      - n: 3
        id: why
        minutes: 5
        prompt:
          - 'Dilate Triangle 1 from {ref:draw} with scale factor 3. If the image is congruent to Triangle 2, then a dilation and rigid motions take Triangle 1 onto Triangle 2. So the triangles are similar.'
          - 'Explain why the image is congruent to Triangle 2.'
          - '*Optional start:* After the dilation, ...'
        box: 2.0
        answer: 'The dilation multiplies every length by 3, so the 2 cm side becomes $3 \cdot 2 = 6$ cm long. A dilation keeps angle measures, so the image still has a $45^\circ$ angle and a $30^\circ$ angle, with the 6 cm side between them, the same as in Triangle 2. Two angles and the side between them match, so the image is congruent to Triangle 2 by ASA.'

  - kind: notes
    new_page: false

  - kind: apply
    items:
      - n: 4
        id: third_angle
        minutes: 5
        prompt: '$\triangle ABC$ has a $40^\circ$ angle and a $60^\circ$ angle. $\triangle DFE$ has a $40^\circ$ angle and an $80^\circ$ angle.'
        figure: 3.9_apply
        layout: stacked
        parts:
          - label: a.
            prompt: 'Explain how you know the triangles are similar.'
            work: 1.4
            answer: ['$m\angle C = 180^\circ - 40^\circ - 60^\circ = 80^\circ$.', 'So $\angle A \cong \angle D$ (both $40^\circ$) and $\angle C \cong \angle E$ (both $80^\circ$). Two pairs of congruent angles, so $\triangle ABC \sim \triangle DFE$ by AA.']
          - label: b.
            prompt: 'Find $y$.'
            work: 1.3
            answer: ['$\overline{BC}$ and $\overline{FE}$ are across from the $40^\circ$ angles, so $k = 6 \div 3 = 2$.', '$\overline{DF}$ and $\overline{AB}$ are across from the $80^\circ$ angles, so $y = 4.6 \cdot 2 = 9.2$.', 'Common error: $8.1 \div 4.6$ (matching the bottom sides).']

quicknotes:
  - '**LT: I can explain why the Angle-Angle (AA) Triangle Similarity Theorem works.**'
  - '- **AA similarity:** if two angles of one triangle are congruent to two angles of another triangle, then the triangles are similar.'
  - '- Why it works: dilate one triangle so the side between the two angles matches. Dilations keep angle measures, so the new triangle is congruent to the other one by ASA. A dilation plus rigid motions means similar.'
  - '- Two angles are enough: the third angle is $180^\circ$ minus the other two, so it matches too. One angle is NOT enough ({ref:one_angle}).'
  - '- Look for congruent angles: marked angles, vertical angles, and angles from parallel lines.'
  - '- After you know the triangles are similar, match the sides by the angles across from them. Find the scale factor, then the missing sides.'

practice:
  title: 'Angle-Angle similarity: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'Find the length of $\overline{DF}$. Show your work. Not drawn to scale.'
          figure: 3.9_pr1
          fig_w: 2.4
          layout: stacked
          work: 0.7
          answer: ['$\angle A\cong\angle D$ and $\angle B\cong\angle F$, so $\triangle ABC\sim\triangle DFE$ (AA).', '$DE=18$ matches $AC=6$, so $k=3$. $DF$ matches $AB=8$: $DF=24$.']
        - n: 2
          prompt: ['In $\triangle ABC$, $m\angle A=35^\circ$ and $m\angle B=20^\circ$.', 'So $m\angle C=180^\circ-35^\circ-20^\circ=125^\circ$.', 'Select **all** the triangles that are similar to $\triangle ABC$.']
          choices: ['$\triangle DEF$: $m\angle D=35^\circ$, $m\angle E=20^\circ$', '$\triangle GHI$: $m\angle G=35^\circ$, $m\angle I=30^\circ$', '$\triangle JKL$: $m\angle J=35^\circ$, $m\angle L=125^\circ$', '$\triangle MNO$: $m\angle N=20^\circ$, $m\angle O=125^\circ$', '$\triangle PQR$: $m\angle Q=20^\circ$, $m\angle R=30^\circ$']
          work: 0.5
          answer: ['[A], [C], [D]. [C]: $m\angle K=20^\circ$. [D]: $m\angle M=35^\circ$.', '[B] and [E] have a $30^\circ$ angle; $\triangle ABC$ does not.']
    - cells:
        - n: 3
          prompt: ['$\angle ACB\cong\angle DCE$ (vertical angles).', 'Is $\triangle ABC\sim\triangle DEC$? Explain how you know.']
          figure: 3.9_pr3
          fig_w: 2.3
          layout: stacked
          work: 0.7
          answer: ['Yes. $\angle A\cong\angle D$ (both $36^\circ$) and $\angle ACB\cong\angle DCE$.', 'So $\triangle ABC\sim\triangle DEC$ by AA.']
        - n: 4
          prompt: 'Decide if each statement must be true, is maybe true, or cannot be true. Explain.'
          parts:
            - label: a.
              prompt: 'An equilateral triangle and a right triangle are similar. (Every angle of an equilateral triangle is $60^\circ$. A right triangle has a $90^\circ$ angle.)'
              fill: [['Choice:', 'cannot be true']]
              box_w: 1.4
              work: 0.5
              answer: 'Similar triangles have congruent angles, and no $60^\circ$ angle matches $90^\circ$.'
            - label: b.
              prompt: 'A right triangle and an isosceles triangle are similar. (A right triangle has a $90^\circ$ angle. An isosceles triangle has two congruent angles.)'
              fill: [['Choice:', 'maybe true']]
              box_w: 1.4
              work: 0.5
              answer: 'Yes if both are $45^\circ$-$45^\circ$-$90^\circ$ (AA). Otherwise not.'
    - cells:
        - n: 5
          prompt: ['The sides of parallelograms $ABCD$ and $WXYZ$ are proportional: $\dfrac{WX}{AB}=\dfrac{3}{2}$ and $\dfrac{XY}{BC}=\dfrac{9}{6}=\dfrac{3}{2}$.', 'Are the parallelograms similar? Explain how you know.']
          figure: 3.9_pr7
          fig_w: 2.2
          layout: stacked
          work: 0.7
          answer: 'We can''t tell. No angles are given. If $\angle A\cong\angle W$, they are similar. If not, they are not.'
    - heading: SBA review
      cells:
        - n: 6
          prompt: 'Write an equation in slope-intercept form for the line with slope 2 that passes through $(-4,-3)$.'
          work: 1.0
          answer: ['$-3=2(-4)+b$, so $b=5$', '$y=2x+5$']
  selected: [[1, '24'], [2, 'A, C, D'], [3, 'yes (AA)'], [4, 'a. cannot; b. maybe'], [5, 'can''t tell'], [6, '$y=2x+5$']]

plan: |
  **Overview.** Students know similarity as a dilation followed by rigid motions (3.6-3.7) and ASA from Unit 2. Today they find that two pairs of congruent angles are enough (AA) and explain why with a dilation plus ASA. Lesson 3.11 uses AA to prove the side splitter theorem; 3.13 uses it for the altitude to the hypotenuse.

  **Core idea.** Students see that a dilation keeps both angles and can stretch the side between them to match the other triangle, so the image is congruent to the other triangle by ASA. That is why two pairs of congruent angles are enough. Only the new steps are blank: the yes/no in {ref:one_angle}, where the sides meet in {ref:draw}, and the explanation in {ref:why}. Known steps are printed so you can move past them: every angle in {ref:one_angle}; the sides and both angles in {ref:draw} (the $30^\circ$ angles too, so no one spends the time on a protractor); the scale factor and the last step in {ref:why}. Faded version: the later problems print less, so students carry the whole argument in {ref:why}. Spend whole-class time on {ref:why}: one pair reads its explanation at the start of QuickNotes. The in-class practice ({ref:third_angle}, the old exit ticket) checks AA on its own: students find the third angle to see that two pairs match, then match the sides by their angles to find $y$.

  **Objective.** Students will explain why AA works and use it to show triangles are similar and find missing sides. **Standards.** G-SRT.A.3, G-SRT.B.5. SMP 3, 5 (protractor).

  **Quick look (25 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up | Students, 1 min share |
  | 3-5 | Together: Problem 1 | Teacher + class |
  | 5-14 | With a partner: Problems 2-3 | Students (pairs) |
  | 14-17 | QuickNotes | Teacher + class |
  | 17-22 | In-class practice: Problem 4 | Students (on their own) |
  | 22-25 | Collect, assign practice | Teacher |

  **Warm-up (3 min).** ASA review, which {ref:why} needs. Share: the marked side is between the two marked angles, so ASA. Point out that $\triangle P'Q'R'$ came from a dilation and leave it there.

  **Together (2 min, doc camera).** Read the framing box. {ref:one_angle}: both triangles have a $45^\circ$ angle, but the other angles don't match, so they are not similar. Ask: "One pair of congruent angles is not enough. What about two?" and send pairs to {ref:draw}.

  **Partner work (9 min).**
  - {ref:draw} (2 min): print at 100% (actual size). Both angles are printed; students extend each $30^\circ$ side with a ruler until it meets the $45^\circ$ side. Then they compare with the next pair (2 min): "What is the third angle? How are the triangles alike?" ($105^\circ$ in both, by protractor or $180^\circ - 45^\circ - 30^\circ$; same shape; Triangle 2 is 3 times as big.)
  - {ref:why} (5 min) is the core. Assessing: "What does the dilation keep? What does it change?" "How long is the image of the 2 cm side? Which two angles is it between?" Advancing: "Which warm-up triangle plays the part of the image?" ($\triangle P'Q'R'$) "Would this work if Triangle 2's side were 5 cm?" (Yes, scale factor $\frac{5}{2}$.)
  - Watch for: "same angles, so similar." That is AA itself; ask why two angles are enough. Also "the 6 cm sides match, so congruent": one side is not enough; ask what else the dilation keeps.
  - MLL supports: the optional start, Turn and Talk in any language before writing. "Image" also means a picture; here it is the triangle after the dilation. Keep the terms dilation, image, and congruent.

  **QuickNotes (3 min).** On the back of page 1, and the "Why it works" bullet answers {ref:why}, so keep page 1 face up until now. Start with one pair's {ref:why} explanation, then read that bullet: the same argument for any two angles. Connect "One angle is NOT enough" to {ref:one_angle} and the vertical angles bullet to practice 3.

  **In-class practice (5 min).** {ref:third_angle} is under the QuickNotes on page 2; students work on their own and use the notes. Read part a over shoulders first. Assessing: "Which angles match? What do you know about $\angle C$?" Advancing, only if stuck: "What do the QuickNotes say about the third angle?" Watch for: "the $40^\circ$ angles match, so similar" (one pair), and $k = 8.1 \div 4.6$ (matching the bottom sides). MLL supports: point to the angle labels on the figure; a marked-up figure or a home-language word counts in part a.

guide_notes: |
  **v2 (Nov 23).** New 30-minute structure: {ref:third_angle} is the in-class practice, under the QuickNotes on page 2. It is the Nov 19 exit ticket without its frame and fill boxes (open work space), and it asks only for $y$ ($x$ was the same move). Its figure is the old exit figure without the $x$ label. Problems 1-3 and the practice are unchanged. Item minutes 12 to 17; plan 20 to 25 min.

  **Faded version (Nov 23).** Only {ref:why} changed: it no longer prints the dilation fact or the 6 cm side, so students write the whole argument (the side becomes 6 cm, both angles stay, so ASA). Box 1.5 to 2.0 in; 4 to 5 min.

  **Nov 23: known content printed.** Printed now: the $30^\circ$ angles in {ref:draw} (students extend each $30^\circ$ side to meet the $45^\circ$ side instead of drawing the angle), the 6 cm side in {ref:why}, $m\angle C = 125^\circ$ in practice 2, the vertical angles in practice 3, the angle facts in practice 4, and the side ratios in practice 5. Still blank: ASA in the warm-up, the yes/no in {ref:one_angle}, where the sides meet in {ref:draw}, the explanation in {ref:why}, and each practice item's similarity decision. Item minutes 13 to 11.

  **Nov 19 (round 2): no exit ticket.** The exit item was cut (it used AA to find an angle and two sides, which practice 1 and 2 already check; it didn't ask why AA works). The handout prints only the Warm-up heading.

  **Nov 19: cut for the core idea.** {ref:one_angle} is no longer a teacher demo: the triangles are printed with every angle labeled (students used to copy angles from your drawing). {ref:draw} prints both sides at actual size with the $45^\circ$ angles drawn; students draw only the $30^\circ$ angles. {ref:why} now uses the {ref:draw} triangles, prints the dilation fact and the last step (a congruent image means similar), and replaces the 3-box frame, which gave the whole argument, with one open explanation. The warm-up names the three choices. Practice unchanged: no item repeats a handout item or another practice item.

  **Earlier cuts (Nov 16).** From about an hour to 30 minutes: cut the "add exactly one angle" problem, the third-angle and measured scale factor problem, warm-up part b, the "always similar?" fill-in, and the parallel-lines bowtie proof. Practice: 10 to 6 problems (two circle items, a quadrilateral scale factor item, an SBA item). Extra instructions and flair cut.

  **Scoring notes (MLL).** Score the math, not grammar. Accept "same angles" or "two angles match" for AA, "same size and shape" or "fits on top" for congruent, and a home-language word, if the reason is clear. On {ref:why}, look for the two angles the dilation keeps and the 6 cm side between them; "two angles and the side between" counts as ASA. On {ref:third_angle}, accept $80^\circ$ written on the figure for part a, and 9.2 or 9,2 for $y$.
