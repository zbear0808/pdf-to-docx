id: 3.6 Progress Check B
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.6 Progress Check
form: B
parallel_to: 3.6 Progress Check A
title: 'Progress check 3.6: Version B'
directions: Show your work.
total_points: 9
max_pages: 1
targets:
  - id: LT1
    understand: 'two figures are similar when a sequence of rigid motions and dilations takes one onto the other; rigid motions keep the size, so a dilation finishes the sequence and multiplies every length by $k$'
    able_to: 'write a sequence of rigid motions and a dilation (center and scale factor) that takes one triangle onto another, and use it to find a length'
    standard: G-SRT.A.2
  - id: LT2
    understand: 'the letter order of a similarity statement records which vertex lands on which'
    able_to: 'write a similarity statement with the vertices in matching order'
    standard: G-SRT.A.2

sections:
  - kind: plain
    target: LT1
    items:
      - id: q1
        target: LT1
        type: cr
        demand: pwc
        points: 6
        prompt: 'Write a sequence of transformations that moves the large triangle onto the small triangle. For a dilation, name the center and the scale factor.'
        figure: 3.6 Progress Check B_triangles
        fig_w: 2.8
        fill:
          - ['Step 1:', 'Reflect across line $LK$.']
          - ['Step 2:', 'Translate $L$ to $P$.']
          - ['Step 3:', 'Dilate with center $P$ and scale factor $\frac{1}{2}$.']
        box_w: 2.9
        answer: 'Scale factor $\frac{RQ}{KM} = \frac{4.5}{9} = \frac{1}{2}$. The triangles face opposite ways, so a reflection is needed. After Steps 1-2, $L$ is on $P$, $K$ is on ray $PR$, and $M$ is on ray $PQ$. The dilation lands $K$ on $R$ and $M$ on $Q$.'
        work: 0.2
      - id: q2
        target: LT1
        type: cr
        demand: pwoc
        points: 2
        prompt: 'If $LM = 5$, how long is $PQ$?'
        fill: [['$PQ =$', '2.5']]
        box_w: 0.9
        answer: ['Scale factor: $\frac{4.5}{9} = \frac{1}{2}$', '$PQ = \frac{1}{2} \cdot LM = \frac{1}{2} \cdot 5 = 2.5$']
        work: 1.1

  - kind: plain
    target: LT2
    items:
      - id: q3
        target: LT2
        type: cr
        demand: pwoc
        points: 1
        prompt: 'Write a similarity statement for the 2 triangles. Match the letters in order.'
        fill: [['$\triangle$', '$MKL$'], ['$\sim \triangle$', '$QRP$']]
        fill_cols: 2
        box_w: 1.0
        answer: 'Any order that keeps $M \to Q$, $K \to R$, $L \to P$ (for example $\triangle KLM \sim \triangle RPQ$).'

guide_notes: |
  **Nov 19: less is more, no headings.** No items cut: each item makes a different move. Item {num:q1} now says "the large triangle onto the small triangle" instead of naming both triangles in matching order: that printed item {num:q3}'s answer, so item {num:q3} measured nothing (Lesson 3.6 Problem 2a hides the letters the same way). Cut "Write one move in each box." (the step boxes show it), item {num:q2}'s "Show your work." (it is in the directions), and "No work = no credit." No section headings; the targets are in the blueprint. The routine steps were already printed (right-angle marks, side lengths, step boxes, $LM = 5$).

  **Nov 20: audit fixes.** The small triangle is relabeled (right angle $P$, top right $R$, bottom $Q$), so item {num:q3}'s answer, $\triangle MKL \sim \triangle QRP$, is not the alphabetical $\triangle KLM \sim \triangle PQR$; that statement now earns 0. Item {num:q2} asks for $PQ$ and is worth 2 points: its scale-factor point was free (item {num:q1} already scores $k$), so the total is 9. B is the harder form: it goes large onto small with $k = \frac{1}{2}$ and decimals (4.5, 2.5), while A goes small onto large with $k = 2$.

  **Targets.** LT1 (3.6): a sequence of rigid motions and a dilation takes one figure onto a similar one, and the dilation multiplies every length by $k$ (items {num:q1}-{num:q2}). LT2 (3.6): write a similarity statement with the vertices in matching order (item {num:q3}).

  **Scoring (9 pts).**
  - Item {num:q1} (6 pts): 2 pts per move. A reflection across a line that works with the other moves (for example line $LK$ or line $PR$), a translation (says where it goes), and a dilation by $\frac{1}{2}$ with a center named. Accept any valid order, for example translate $L$ to $P$, reflect across line $PR$, dilate with center $P$ by $\frac{1}{2}$. Take 1 pt off a dilation with no center or with scale factor 2. A sequence with no reflection can't work (the triangles face opposite ways); give credit only for the moves that are right.
  - Item {num:q2} (2 pts): 1 pt for multiplying the matching side by the scale factor ($PQ = \frac{1}{2} \cdot LM$; use the student's item {num:q1} scale factor, so an item {num:q1} error isn't taken off again), 1 pt for 2.5.
  - Item {num:q3} (1 pt): any order with $M \to Q$, $K \to R$, $L \to P$. $\triangle KLM \sim \triangle PQR$ (both triangles in alphabetical order) pairs $K$ with $P$ and earns 0.

  **MLL notes.** Score the math, not grammar or spelling. Accept "flip", "slide", "turn", "make smaller by half", or a home-language word for a move, if the line, distance, center, or scale factor is clear. Accept the moves written as a list or arrows.
