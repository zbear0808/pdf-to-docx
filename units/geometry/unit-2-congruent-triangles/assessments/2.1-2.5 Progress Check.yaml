id: '2.1-2.5 Progress Check'
doc_type: assessment
schema_version: 1
numbering: auto
title: 'Progress check: lessons 2.1-2.5'
directions: 'Use the marks on each diagram.'
total_points: 9
max_pages: 2
source: '2.1- 2.5 Progress Check.docx (Version A, page 1 top and page 2)'
targets:
  - id: LT1
    understand: 'Students will understand that a rigid motion or a congruence statement tells which parts correspond, and corresponding parts of congruent figures are congruent.'
    able_to: 'Students will be able to name corresponding parts from a rigid motion, a congruence statement, or the marks on a diagram, and write a congruence statement with the vertices in matching order.'
    standard: 'G-CO.B.6, G-CO.B.7'
  - id: LT2
    understand: 'Students will understand that SSS, SAS, and ASA each give enough matching parts to know two triangles are congruent, and two sides with an angle that is not between them (SSA) is not enough.'
    able_to: 'Students will be able to decide from marked parts whether two triangles are congruent and write a congruence statement in matching order.'
    standard: G-CO.B.8

sections:
  - kind: plain
    target: LT1
    columns: 2
    items:
      - id: q1
        points: 2
        target: LT1
        type: sr
        demand: pwc
        source: 'Version A #1'
        prompt:
          - '$\triangle HEF$ is the image of $\triangle FGH$ after a $180^\circ$ rotation around point $K$.'
          - 'Select **all** the statements that must be true. Each wrong or missing choice loses $\frac{1}{2}$ point.'
        figure: '2.1-2.5 Progress Check_q1'
        layout: stacked
        choices: ['$\angle E \cong \angle G$', '$\angle GHK \cong \angle EFK$', '$\overline{EH} \cong \overline{FG}$', '$\overline{GH} \cong \overline{HK}$', '$\triangle HGF \cong \triangle FEH$', '$\triangle EFH \cong \triangle GFH$']
        choice_cols: 2
        select_all: true
        key: 'A, B, C, E'
        answer: ['[A], [B], [C], [E]. The rotation takes $F \to H$, $G \to E$, $H \to F$.', '[A] $\angle G \to \angle E$. [B] $\angle GHK \to \angle EFK$. [C] $\overline{FG} \to \overline{HE}$. [E] $H \to F$, $G \to E$, $F \to H$.']
        distractors:
          D: '$\overline{GH}$ and $\overline{HK}$ share point $H$; $\overline{HK}$ is half of diagonal $\overline{HF}$, not the image of $\overline{GH}$'
          F: 'matches $E$ with $G$ but keeps $F$ and $H$ in place; the rotation swaps $F$ and $H$ (true: $\triangle EFH \cong \triangle GHF$)'
      - id: q2
        points: 2
        target: LT1
        type: sr
        demand: pwc
        source: 'Version A #2'
        prompt:
          - 'Use $\triangle GHI \cong \triangle JKL$.'
          - 'Select **all** the statements that must be true. Each wrong or missing choice loses $\frac{1}{2}$ point.'
        choices: ['$\overline{GI} \cong \overline{JL}$', '$\angle I \cong \angle K$', 'A translation moves $\triangle GHI$ onto $\triangle JKL$.', '$\triangle HGI \cong \triangle KJL$', '$m\angle G + m\angle H + m\angle L = 180^\circ$']
        select_all: true
        key: 'A, D, E'
        answer: ['[A], [D], [E]. Match by position: $G \leftrightarrow J$, $H \leftrightarrow K$, $I \leftrightarrow L$.', '[D] lists the same pairs in a new order. [E] $m\angle L = m\angle I$, so the sum is $m\angle G + m\angle H + m\angle I = 180^\circ$.']
        distractors:
          B: 'matches $I$ with $K$ instead of by position ($I$ matches $L$)'
          C: 'thinks congruent means a translation; any sequence of rigid motions works'
      - id: q4
        points: 1
        target: LT1
        type: cr
        demand: pwoc
        source: 'Version A #4'
        prompt: 'Complete the congruence statement.'
        figure: '2.1-2.5 Progress Check_q4'
        layout: stacked
        frame:
          - ['$\triangle CND \cong \triangle$', '$LNM$', '']
        answer: 'Same marks: $C \leftrightarrow L$ (2 arcs), $N \leftrightarrow N$ (vertical angles), $D \leftrightarrow M$ (3 arcs).'

  - kind: plain
    target: LT2
    columns: 2
    page_break_before: true
    items:
      - id: q5
        points: 2
        target: LT2
        type: cr
        demand: pwc
        source: 'new (Nov 20): SSA case like lesson 2.5 Problem 4, new letters and drawing; replaces Version A, back #1 (SAA)'
        prompt: ['Are the triangles congruent? Write yes or no.', 'If yes, complete the congruence statement.']
        figure: '2.1-2.5 Progress Check_q5'
        layout: stacked
        fill: [['Congruent?', 'no']]
        box_w: 1.0
        frame:
          - ['$\triangle ABV \cong \triangle$', 'none', '']
        answer: ['SSA: $\angle A \cong \angle S$, $\overline{AB} \cong \overline{SP}$, $\overline{BV} \cong \overline{PW}$, but the marked angle is not between the two marked sides.', 'Two different triangles fit these parts ($\overline{AV}$ is longer than $\overline{SW}$).']
      - id: q6
        points: 2
        target: LT2
        type: cr
        demand: pwoc
        source: 'Version A, back #2'
        prompt: ['Are the triangles congruent? Write yes or no.', 'If yes, complete the congruence statement.']
        figure: '2.1-2.5 Progress Check_q6'
        layout: stacked
        fill: [['Congruent?', 'yes']]
        box_w: 1.0
        frame:
          - ['$\triangle MDX \cong \triangle$', '$MTY$', '']
        answer: ['SAS: $\overline{DM} \cong \overline{TM}$, $\angle DMX \cong \angle TMY$, $\overline{XM} \cong \overline{YM}$.', '$M \leftrightarrow M$, $D \leftrightarrow T$, $X \leftrightarrow Y$.']

guide_notes: |
  **Nov 19: less is more, no headings.** Cut old item 3 ($\triangle QRS \cong \triangle FHG$, two boxes, 1 pt): it names corresponding parts from the vertex order of a congruence statement, the same move as item {num:q2} [A], [B], and [D], and item {num:q2} also checks [C] and [E]. Removed the two section headings (the targets are in the blueprint) and "Use the marks on the diagram." from item {num:q4} (the directions say it). Nothing else needed a scaffold: the marks, the labels, and the center $K$ are already on the figures. Total 10 -> 9.

  **Nov 20: audit fix.** Item {num:q5} is now an SSA case that answers "no" (marks only, new letters and drawing). It replaces the source's SAA item ($\triangle JAR$, $\triangle DIL$): no Unit 2 lesson teaches SAA, and every decide item answered "yes", so a student who always wrote "yes" got all 4 LT2 points. SSA is taught in lesson 2.5 (Problem 4 and the QuickNotes). Same points.

  **Targets.** Items {num:q1}-{num:q4} (5 pts): LT1, corresponding parts from a rotation, a congruence statement, or marks (lessons 2.1-2.2). Items {num:q5}-{num:q6} (4 pts): LT2, decide congruence from marks (lessons 2.3-2.5). The front page is LT1 and the back page is LT2, as in the source.

  **Scoring.**
  - Items {num:q1} and {num:q2} (2 pts each): start at 2 and take off $\frac{1}{2}$ for each wrong or missing choice. Minimum 0. Selecting every choice scores 1 pt.
  - Item {num:q4} (1 pt): all three letters in matching order.
  - Item {num:q5} (2 pts): 1 pt for "no", 1 pt for leaving the congruence statement empty or writing "none" (the lesson 2.5 routine). "Yes" with $\triangle SPW$ scores 0: that is SSA read as SAS. A reason is not asked; give no extra credit and take nothing off if a student adds one ("SSA", "the angle is not between the sides").
  - Item {num:q6} (2 pts): 1 pt for "yes", 1 pt for the statement in matching order. The theorem is not asked; give no extra credit and take nothing off if a student adds one.

  **Watch for.** Statements in alphabetical order instead of matching order. Item {num:q1}F: students who see two triangles sharing $\overline{FH}$ and match $E$ with $G$ but keep $F$ and $H$ in place. It is also the answer to lesson 2.5 practice 4 ($\triangle HEF$ is the image of $\triangle HGF$ after a reflection across $\overleftrightarrow{FH}$, so $F$ and $H$ stay put); here the $180^\circ$ rotation swaps $F$ and $H$, so a student who reuses that answer picks [F]. Item {num:q2}C: "congruent" read as "a translation". Item {num:q5}: students who call SSA "SAS" write "yes". Ask: "Is the marked angle between the two marked sides?" ($\angle A$ is between $\overline{AB}$ and $\overline{AV}$, and $\overline{AV}$ is not marked.)

  **For the retake.** Item {num:q5} answers "no" (SSA) and item {num:q6} answers "yes" (SAS), so LT2 checks both outcomes. Keep one of each on a retake.

  **Scoring notes (MLL).** Score the math, not English. Accept "sí", "same", or a home-language word for yes or no, and lowercase letters. No word problems here, so no 3-Reads launch is needed if you go over it in class.
