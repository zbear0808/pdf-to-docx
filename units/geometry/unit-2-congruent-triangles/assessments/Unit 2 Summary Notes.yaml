id: 'Unit 2 Summary Notes'
doc_type: reference
title: 'Unit 2: Congruent triangles summary notes'
directions: 'One section per lesson. Use these notes with your lesson handouts when you study.'
max_pages: 5
source: 'Unit 2 Summary Notes.docx'
do_not_reuse: ['Unit 2 Test', '2.1-2.5 Progress Check']

sections:
  - kind: plain
    title: 'Lessons 2.1 and 2.2: Congruent parts'
    items:
      - prompt:
          - '**Summary:** Corresponding parts are the parts of an image that match parts of the original figure. They can be points, sides, or angles. A congruence statement lists the corresponding vertices in the same order.'
          - '**Corresponding parts of congruent figures:** If two figures are congruent, then their corresponding parts are congruent.'
        work: 0
      - prompt:
          - '**Example 1: Congruence statements.** The rigid transformation that takes one figure onto the other tells you the corresponding parts.'
          - '• **Rigid transformation:** Rotate $LOVE$ $90^\circ$ clockwise around $L$. Then translate it by the directed line segment from $L$ to $M$.'
          - '• **Corresponding vertices:** $L \leftrightarrow M$, $O \leftrightarrow A$, $V \leftrightarrow T$, $E \leftrightarrow H$.'
          - '• **Congruence statement:** $LOVE \cong MATH$.'
        figure: 'Unit 2 Summary Notes_ex1'
        work: 0
      - prompt:
          - '**Example 2: Naming corresponding parts.** $\triangle PQR \cong \triangle DEF$. List all the congruent corresponding parts.'
          - '• Match by position: $P \leftrightarrow D$, $Q \leftrightarrow E$, $R \leftrightarrow F$. So $\triangle FED \cong \triangle RQP$.'
          - '• Sides: $\overline{PQ} \cong \overline{DE}$, $\overline{PR} \cong \overline{DF}$, $\overline{QR} \cong \overline{EF}$.'
          - '• Angles: $\angle P \cong \angle D$, $\angle Q \cong \angle E$, $\angle R \cong \angle F$.'
          - '• Marks: the same number of ticks means congruent sides. The same number of arcs means congruent angles.'
        figure: 'Unit 2 Summary Notes_ex2'
        work: 0

  - kind: plain
    title: 'Lesson 2.3: Congruent triangles, part 1'
    items:
      - prompt:
          - '**Summary:** If all corresponding parts of two triangles are congruent, then a sequence of translations, rotations, and reflections takes one triangle exactly onto the other. The congruent parts are the reason the vertices line up exactly.'
          - '**If all pairs of corresponding sides and angles are congruent between two figures, then the figures are congruent.**'
        work: 0
      - prompt:
          - '**Example.** Write a sequence of rigid transformations to show that the vertices line up and $\triangle UVW \cong \triangle XYZ$.'
          - '**General guidelines:** (1) **Translate** to line up one pair of vertices. (2) **Rotate** to line up a second pair. (3) If needed, **reflect** to line up the third pair.'
          - '• Translate $\triangle UVW$ by the directed line segment from $U$ to $X$. Now $U$ is on $X$.'
          - '• Rotate around $X$ until the image of $\overline{UV}$ is on $\overrightarrow{XY}$. $V$ lands on $Y$ because $UV = XY$.'
          - '• The triangles face opposite ways, so reflect across $\overleftrightarrow{XY}$. $W$ lands on $Z$ because $\angle U \cong \angle X$ and $UW = XZ$.'
        figure: 'Unit 2 Summary Notes_seq'
        work: 0

  - kind: plain
    columns: 2
    items:
      - prompt:
          - '**SAS (Side-Angle-Side)**'
          - 'If two pairs of corresponding sides and the angle between them (the included angle) are congruent, then the triangles are congruent.'
        figure: 'Unit 2 Summary Notes_sas'
        fig_w: 1.9
        layout: stacked
        work: 0
      - prompt:
          - '**ASA (Angle-Side-Angle)**'
          - 'If two pairs of corresponding angles and the side between them (the included side) are congruent, then the triangles are congruent.'
        figure: 'Unit 2 Summary Notes_asa'
        fig_w: 1.9
        layout: stacked
        work: 0
      - prompt:
          - '**SSS (Side-Side-Side)**'
          - 'If three pairs of corresponding sides are congruent, then the triangles are congruent.'
        figure: 'Unit 2 Summary Notes_sss'
        fig_w: 1.9
        layout: stacked
        work: 0
      - prompt:
          - '**SAA (Side-Angle-Angle), also called AAS**'
          - 'If two pairs of corresponding angles and a pair of corresponding sides that are not between them are congruent, then the triangles are congruent.'
        figure: 'Unit 2 Summary Notes_saa'
        fig_w: 1.9
        layout: stacked
        work: 0

  - kind: plain
    title: 'Lesson 2.5: Using triangle congruence theorems'
    items:
      - prompt:
          - '**Summary:** In Lessons 2.3 and 2.4, we began to show why points line up in figures with congruent parts. In this lesson, we look at two triangles and decide if they are congruent. This builds toward proofs in the next lessons.'
          - '• Use only what is given or marked. Lines are parallel only when they are marked parallel.'
          - '• Look for parts the diagram gives for free: a side in both triangles is congruent to itself, and vertical angles are congruent.'
          - '• Two sides and an angle that is not between them (SSA) is not enough.'
          - '• Write the congruence statement in matching order: vertices with the same marks go in the same spot.'
        work: 0
      - prompt:
          - '**Example 1.** Decide if the triangles are congruent.'
          - '• Congruent: **yes**.'
          - '• $\overline{MP} \cong \overline{OP}$ and $\overline{MN} \cong \overline{ON}$ (marked). $\overline{PN} \cong \overline{PN}$ (a side in both triangles).'
          - '• $\triangle MNP \cong \triangle ONP$ by SSS.'
        figure: 'Unit 2 Summary Notes_25a'
        work: 0
      - prompt:
          - '**Example 2.** Decide if the triangles are congruent.'
          - '• Congruent: **no, cannot be determined**.'
          - '• The angles match: $\angle P \cong \angle K$ ($112^\circ$) and $\angle R \cong \angle J$ ($39^\circ$).'
          - '• The marked sides do not match. $\overline{PQ}$ is across from the $39^\circ$ angle. $\overline{KJ}$ is between the two angles. No theorem fits.'
        figure: 'Unit 2 Summary Notes_25b'
        fig_w: 2.7
        work: 0
      - prompt:
          - '**Example 3.** What pairs of congruent parts are given? What other pairs do we know from the diagram? How do we know?'
          - '• Given (marked): $\overline{TU} \parallel \overline{WV}$ and $\overline{TX} \cong \overline{VX}$.'
          - '• $\angle TXU \cong \angle VXW$ because vertical angles are congruent.'
          - '• $\angle T \cong \angle V$ because alternate interior angles are congruent when lines are parallel ($\overline{TV}$ is the transversal).'
          - '• So $\triangle TXU \cong \triangle VXW$ by ASA.'
        figure: 'Unit 2 Summary Notes_25c'
        work: 0

  - kind: plain
    title: 'Lesson 2.6: Side-Angle-Side triangle congruence'
    items:
      - prompt:
          - '**Summary:** Prove the SAS Triangle Congruence Theorem: two pairs of corresponding sides and the angle between them are congruent. Use it to prove that the base angles of an isosceles triangle are congruent.'
          - 'When you write a proof: (1) start with what is GIVEN, (2) end with what you want to PROVE, and (3) use geometric properties to connect the start to the end, with no gaps.'
          - '**Common geometric properties**'
          - '• Vertical angles are congruent.'
          - '• Angles that make a straight angle (a linear pair) are supplementary: they add to $180^\circ$.'
          - '• Alternate interior angles and alternate exterior angles are congruent when parallel lines are cut by a transversal.'
          - '• Corresponding angles are congruent when parallel lines are cut by a transversal.'
          - '• **Bisect:** cut into two congruent parts.'
          - '• **Triangle Angle Sum Theorem:** The angles of a triangle add to $180^\circ$.'
          - '• **Reflexive property:** a segment or angle is congruent to itself.'
          - '• **Auxiliary line:** an extra line you draw in a figure to show hidden structure.'
        work: 0
      - prompt:
          - '**Side-Angle-Side (SAS) Triangle Congruence Theorem:** If two sides and the angle between them in one triangle are congruent to two sides and the angle between them in another triangle, then the triangles are congruent.'
        figure: 'Unit 2 Summary Notes_sas_ex'
        proof:
          given: '$\overline{AB} \cong \overline{GB}$ and $\angle ABC \cong \angle GBC$'
          prove: '$\triangle ABC \cong \triangle GBC$'
          rows:
            - ['$\overline{AB} \cong \overline{GB}$', 'Given']
            - ['$\angle ABC \cong \angle GBC$', 'Given']
            - ['$\overline{BC} \cong \overline{BC}$', 'Reflexive property']
            - ['$\triangle ABC \cong \triangle GBC$', 'SAS']
          height: 0.3
      - prompt:
          - '**Isosceles Triangle Theorem:** The base angles of an isosceles triangle are congruent.'
          - '• In $\triangle ABP$, $\overline{AP} \cong \overline{BP}$, so $\angle A \cong \angle B$.'
          - '• Proof idea: draw an auxiliary line, the bisector of $\angle APB$. It makes two triangles that are congruent by SAS.'
        figure: 'Unit 2 Summary Notes_iso'
        work: 0

  - kind: plain
    title: 'Lesson 2.7: Angle-Side-Angle triangle congruence'
    page_break_before: true
    items:
      - prompt:
          - '**Summary:** Prove the ASA Triangle Congruence Theorem: two pairs of corresponding angles and the side between them are congruent. Use it to prove that the opposite sides of a parallelogram are congruent.'
          - '**Angle-Side-Angle (ASA) Triangle Congruence Theorem:** In two triangles, if two pairs of corresponding angles and the pair of corresponding sides between the angles are congruent, then the triangles must be congruent.'
        figure: 'Unit 2 Summary Notes_asa_ex'
        proof:
          given: '$\angle P \cong \angle T$ and $\overline{PE} \cong \overline{TE}$'
          prove: '$\triangle LEP \cong \triangle SET$'
          rows:
            - ['$\angle P \cong \angle T$', 'Given']
            - ['$\overline{PE} \cong \overline{TE}$', 'Given']
            - ['$\angle LEP \cong \angle SET$', 'Vertical angles are congruent']
            - ['$\triangle LEP \cong \triangle SET$', 'ASA']
          height: 0.3
      - prompt:
          - 'A **parallelogram** is a quadrilateral in which pairs of opposite sides are parallel.'
          - '**Parallelogram Theorem:** In a parallelogram, pairs of opposite sides are congruent.'
          - '• $MNKL$ is a parallelogram with $\overline{MN} \parallel \overline{KL}$ and $\overline{NK} \parallel \overline{ML}$, so $\overline{NM} \cong \overline{KL}$ and $\overline{NK} \cong \overline{ML}$.'
          - '• Why: a diagonal splits the parallelogram into two triangles that are congruent by ASA (alternate interior angles and the shared diagonal).'
        figure: 'Unit 2 Summary Notes_para_sides'
        work: 0

  - kind: plain
    title: 'Lesson 2.9: Side-Side-Side triangle congruence'
    items:
      - prompt:
          - '**Summary:** Prove the SSS Triangle Congruence Theorem: all three pairs of corresponding sides are congruent. Use it to prove that the opposite angles of a parallelogram are congruent.'
          - '**Side-Side-Side (SSS) Triangle Congruence Theorem:** In two triangles, if all three pairs of corresponding sides are congruent, then the triangles must be congruent.'
        figure: 'Unit 2 Summary Notes_sss_ex'
        proof:
          given: '$\overline{GU} \cong \overline{GJ}$ and $\overline{HU} \cong \overline{HJ}$'
          prove: '$\triangle HUG \cong \triangle HJG$'
          rows:
            - ['$\overline{GU} \cong \overline{GJ}$', 'Given']
            - ['$\overline{HU} \cong \overline{HJ}$', 'Given']
            - ['$\overline{GH} \cong \overline{GH}$', 'Reflexive property']
            - ['$\triangle HUG \cong \triangle HJG$', 'SSS']
          height: 0.3
      - prompt:
          - '**Parallelogram Theorem:** In a parallelogram, opposite angles are congruent.'
          - '• $MNKL$ is a parallelogram with $\overline{MN} \parallel \overline{KL}$ and $\overline{NK} \parallel \overline{ML}$, so $\angle M \cong \angle K$ and $\angle N \cong \angle L$.'
          - '• Why: a diagonal makes two congruent triangles. Corresponding parts of congruent triangles are congruent (CPCTC).'
        figure: 'Unit 2 Summary Notes_para_angles'
        work: 0
