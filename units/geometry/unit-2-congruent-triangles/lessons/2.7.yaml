id: '2.7'
title: Angle-Side-Angle triangle congruence
notes_title: ASA and parallelograms
framing: >-
  Are two angles and the side between them enough to prove two triangles congruent?
materials: patty paper
numbering: auto
headings: warmup
source: 2.7 & 2.9 Student Notes (2.7 parts), 2.7 Practice Problems
targets:
  - id: LT1
    understand: 'Students will understand that two angles and the side between them fix a triangle, so rigid motions take one such triangle exactly onto the other.'
    able_to: 'Students will be able to explain why the ASA Triangle Congruence Theorem works using a sequence of rigid motions.'
    standard: G-CO.B.8
  - id: LT2
    understand: 'Students will understand that a diagonal splits a parallelogram into two triangles that are congruent by ASA.'
    able_to: 'Students will be able to use ASA in a two-column proof and use the Parallelogram Theorem.'
    standard: G-CO.C.11

sections:
  - kind: warmup
    items:
      - minutes: 3
        target: LT1
        prompt: 'Both triangles have $\angle D = 75^\circ$ and $\angle G = 45^\circ$.'
        figure: 2.7_warmup
        fig_w: 3.6
        layout: stacked
        fill: [['$m\angle O$ in each triangle:', '$60^\circ$'], ['Are the triangles congruent? (yes or no)', 'no']]
        fill_cols: 1
        box_w: 0.9
        answer: 'Same three angles, different sizes. Two angles fix the shape, not the size.'

  - kind: together
    items:
      - id: asa_why
        minutes: 6
        target: LT1
        type: cr
        demand: dm
        prompt:
          - '$\angle W \cong \angle D$, $\overline{WX} \cong \overline{DE}$, and $\angle X \cong \angle E$. Two rigid motions take $\triangle WXY$ onto $\triangle DEF$:'
          - 'Step 1: Translate $\triangle WXY$ so that $W$ lands on $D$.'
          - 'Step 2: Rotate around $D$. $WX = DE$, so $X$ lands on $E$.'
          - 'Why does $Y$ have to land on $F$?'
        figure: 2.7_asa_pair
        fig_w: 2.3
        layout: stacked
        frame:
          - ['$\angle W \cong \angle D$, so ray $WY$ lands on ray', '$DF$', '.']
          - ['$\angle X \cong \angle E$, so ray $XY$ lands on ray', '$EF$', '.']
          - ['$Y$ is on both rays, and the rays cross at only one point. So $Y$ lands on', '$F$', '.']
        answer: 'No reflection is needed for this pair: $Y$ and $F$ end up on the same side of $\overline{DE}$.'
      - id: asa_example
        minutes: 3
        target: LT1
        type: cr
        demand: pwc
        prompt:
          - '**Angle-Side-Angle (ASA) Triangle Congruence Theorem:** In two triangles, if two pairs of corresponding angles and the pair of corresponding sides between the angles are congruent, then the triangles must be congruent.'
        figure: 2.7_bowtie
        fig_w: 1.6
        fill: [['$\angle A \cong$', '$\angle C$'], ['$\overline{AE} \cong$', '$\overline{CE}$'], ['$\angle DEA \cong$', '$\angle BEC$'], ['$\triangle DEA \cong$', '$\triangle BEC$']]
        fill_cols: 2
        box_w: 1.0
        answer: '$\angle DEA$ and $\angle BEC$ are vertical angles.'

  - kind: partner
    items:
      - id: para_proof
        minutes: 10
        target: LT2
        type: cr
        demand: pwc
        prompt: 'A **parallelogram** is a quadrilateral in which both pairs of opposite sides are parallel. Diagonal $\overline{BD}$ splits parallelogram $ABCD$ into 2 triangles. Complete the proof that opposite sides of a parallelogram are congruent.'
        figure: 2.7_para
        fig_w: 2.0
        layout: stacked
        proof:
          given: '$ABCD$ is a parallelogram: $\overline{AB} \parallel \overline{DC}$ and $\overline{AD} \parallel \overline{BC}$.'
          prove: '$\overline{AB} \cong \overline{CD}$ and $\overline{BC} \cong \overline{AD}$'
          rows:
            - ['$\overline{AB} \parallel \overline{DC}$', 'Given']
            - [{ans: '$\angle ABD \cong \angle CDB$'}, 'Alternate interior angles']
            - ['$\overline{BD} \cong \overline{DB}$', 'A segment is congruent to itself']
            - ['$\overline{AD} \parallel \overline{BC}$', 'Given']
            - [{ans: '$\angle ADB \cong \angle CBD$'}, 'Alternate interior angles']
            - [{ans: '$\triangle ABD \cong \triangle CDB$'}, {ans: 'ASA'}]
            - ['$\overline{AB} \cong \overline{CD}$ and $\overline{BC} \cong \overline{AD}$', {ans: 'Corresponding parts of congruent triangles are congruent'}]

  - kind: notes

quicknotes:
  - target: LT1
    title: I can explain why the ASA Triangle Congruence Theorem works.
    bullets:
      - 'Two angles alone do not fix a triangle. A triangle with $\angle D = 75^\circ$ and $\angle G = 45^\circ$ can be any size.'
      - '**ASA Triangle Congruence Theorem:** If two pairs of corresponding angles and the pair of corresponding sides between them are congruent, then the triangles are congruent.'
      - 'Why it works: rigid motions put the congruent sides on top of each other. The congruent angles send the other sides along the same rays, and two rays cross at only one point.'
  - target: LT2
    title: I can use the ASA Triangle Congruence Theorem in a proof.
    bullets:
      - 'A **parallelogram** is a quadrilateral in which pairs of opposite sides are parallel.'
      - 'In a two-column proof, every statement has a reason: given, a definition, or a theorem.'
      - '**Parallelogram Theorem:** In a parallelogram, pairs of opposite sides and opposite angles are congruent.'

practice:
  title: 'ASA triangle congruence: practice'
  rows:
    - cells:
        - n: 1
          target: LT2
          prompt: '$MNKL$ is a parallelogram. Use the Parallelogram Theorem.'
          figure: 2.7_mnkl
          fig_w: 1.5
          fill: [['$\overline{NM} \cong$', '$\overline{KL}$'], ['$\overline{NK} \cong$', '$\overline{ML}$'], ['$\angle M \cong$', '$\angle K$'], ['$\angle N \cong$', '$\angle L$']]
          fill_cols: 2
          box_w: 0.9
          answer: '$M$ is across from $K$, and $N$ is across from $L$.'
        - n: 2
          target: LT2
          prompt: ['$\overline{GE}$ is an angle bisector of $\angle HEF$ and of $\angle FGH$.', 'Prove $\triangle HGE \cong \triangle FGE$.']
          figure: 2.7_pr_kite
          fig_w: 1.1
          answer: ['$\angle HEG \cong \angle FEG$ and $\angle HGE \cong \angle FGE$ (definition of angle bisector).', '$\overline{GE} \cong \overline{GE}$ (same segment).', 'The side is between the angles, so the triangles are congruent by ASA.']
          work: 1.9
    - cells:
        - n: 3
          target: LT2
          prompt:
            - 'In the figure, $\overline{DC} \parallel \overline{AB}$. Han wrote a proof that $\triangle BCD \cong \triangle DAB$. His proof is incomplete.'
            - '(1) $\overleftrightarrow{AB} \parallel \overleftrightarrow{DC}$, cut by transversal $DB$. So $\angle CDB$ and $\angle ABD$ are alternate interior angles and are congruent.'
            - '(2) $\overline{DB} \cong \overline{DB}$ because they are the same segment.'
            - '(3) $\angle A \cong \angle C$ because they are both right angles.'
            - '(4) By the ASA Triangle Congruence Theorem, $\triangle BCD \cong \triangle DAB$.'
            - 'How can he fix his proof?'
          figure: 2.7_pr_rect
          fig_w: 1.2
          answer: ['In $\triangle BCD$, $\overline{DB}$ is not between $\angle CDB$ and $\angle C$ (the side between them is $\overline{DC}$), so ASA does not apply yet.', 'Fix: add, before (4), "By the Triangle Angle Sum Theorem, $\angle ADB \cong \angle CBD$." Then $\angle CDB$, $\overline{DB}$, $\angle CBD$ match $\angle ABD$, $\overline{BD}$, $\angle ADB$.']
          work: 1.5
        - n: 4
          target: LT1
          prompt: 'Which conjecture is possible to prove?'
          choices:
            - 'All triangles with at least one side $= 5$ are congruent.'
            - 'All pentagons with at least one side $= 5$ are congruent.'
            - 'All rectangles with at least one side $= 5$ are congruent.'
            - 'All squares with at least one side $= 5$ are congruent.'
          key: D
          distractors: {A: 'one side does not fix the other sides or the angles', B: 'one side does not fix a pentagon', C: 'the other side can be any length (5 by 2, 5 by 9)'}
          answer: 'Every square with a side of 5 has four sides of 5 and four $90^\circ$ angles, so rigid motions take any one onto any other.'
    - page_break_before: true
      cells:
        - n: 5
          target: LT2
          prompt: 'Complete the two-column proof.'
          figure: 2.7_pr_zigzag
          fig_w: 1.3
          proof:
            given: '$\overline{AB} \parallel \overline{CD}$, $\angle B \cong \angle D$, and $\overline{AB} \cong \overline{CD}$'
            prove: '$\triangle ABF \cong \triangle CDE$'
            rows:
              - ['$\overline{AB} \parallel \overline{CD}$', {ans: 'Given'}]
              - [{ans: '$\angle A \cong \angle C$'}, 'Alternate interior angles']
              - [{ans: '$\angle B \cong \angle D$'}, 'Given']
              - ['$\overline{AB} \cong \overline{CD}$', {ans: 'Given'}]
              - ['$\triangle ABF \cong \triangle CDE$', {ans: 'ASA'}]
        - n: 6
          prompt: 'Complete the two-column proof.'
          figure: 2.7_pr_kqab
          fig_w: 1.1
          proof:
            given: '$\overline{QK} \cong \overline{QA}$, and $\overline{QB}$ bisects $\angle KQA$'
            prove: '$\overline{KB} \cong \overline{AB}$'
            rows:
              - [{ans: '$\overline{QK} \cong \overline{QA}$'}, 'Given']
              - ['$\overline{QB}$ bisects $\angle KQA$', {ans: 'Given'}]
              - [{ans: '$\angle KQB \cong \angle AQB$'}, 'Definition of bisector']
              - [{ans: '$\overline{QB} \cong \overline{QB}$'}, 'Reflexive Property']
              - [{before: '$\triangle KBQ \cong \triangle$', ans: '$ABQ$'}, {ans: 'SAS'}]
              - ['$\overline{KB} \cong \overline{AB}$', {ans: 'Corresponding parts of congruent triangles are congruent'}]
    - heading: SBA review
      cells:
        - n: 7
          prompt: 'Write a linear equation that has slope $m = -4$ and passes through the point $(1, 3)$.'
          answer: '$y - 3 = -4(x - 1)$, so $y = -4x + 7$'
          work: 1.4
        - n: 8
          prompt: ['Solve the equation by factoring.', '$x^2 - 2x - 48 = 0$']
          answer: ['$(x - 8)(x + 6) = 0$', '$x = 8$ or $x = -6$']
          work: 1.4
  selected: [[1, '$\overline{KL}$, $\overline{ML}$, $\angle K$, $\angle L$'], [2, 'ASA (bisected angles, shared side $\overline{GE}$)'], [3, 'add $\angle ADB \cong \angle CBD$ (Triangle Angle Sum Theorem)'], [4, D], [5, 'given; $\angle A \cong \angle C$; $\angle B \cong \angle D$; given; ASA'], [6, '$\triangle ABQ$ by SAS'], [7, '$y = -4x + 7$'], [8, '$x = 8$ or $x = -6$']]

plan: |
  **Overview.** Lesson 2.6 proved SAS with rigid motions. Today students prove ASA the same way, then use it: a diagonal splits a parallelogram into two triangles that are congruent by ASA. Lesson 2.9 does SSS.

  **Core idea.** Students see that once the side between the angles lines up, the two angles send the other two sides along the same rays, and two rays cross at only one point, so the third vertex has to land on its match. Spend whole-class time on the three boxes in {ref:asa_why}. Translate and rotate are review from 2.6, so they are printed; move past them quickly.

  **Objectives.** (1) Explain why ASA works with a sequence of rigid motions. (2) Use ASA in a two-column proof. **Standards.** G-CO.B.8, G-CO.C.11. SMP 3, 5, 6.

  **Quick look (32 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-4 | Warm-up | Students, 1 min share |
  | 4-14 | Together: Problems 1-2 | Teacher + class |
  | 14-25 | With a partner: Problem 3 | Students (pairs) |
  | 25-29 | QuickNotes | Teacher + class |
  | 29-32 | Collect, assign practice | Teacher |

  **Warm-up (4 min).** Angle sum is review. The point is the second box: same angles, different sizes, so two angles are not enough. Ask "What else would we need to know to pin down the size?" and leave it open.

  **Together (10 min, doc camera).** {ref:asa_why} (6 min): trace $\triangle WXY$ on patty paper and do Steps 1-2 quickly. Then slow down for the boxes: the angle at $D$ sends $Y$ somewhere on ray $DF$, the angle at $E$ sends it somewhere on ray $EF$. Ask "Could $Y$ land anywhere else on ray $DF$?" and "When would we need a reflection?" (a mirror-image pair). {ref:asa_example} (3 min): read the theorem, point to the side between the two angles, and ask why the angles at $E$ match (vertical angles).

  **Partner work (11 min).** {ref:para_proof}. The parallel marks, the diagonal, the shared side, and the Given rows are printed; students find the two pairs of alternate interior angles and name the congruence.
  - Assessing: "Which lines are parallel, and which line cuts across them?" "Which side is between your two angles?"
  - Advancing: "What if you used diagonal $\overline{AC}$ instead?" ($\triangle ABC \cong \triangle CDA$ by ASA.)
  - MLL supports: printed definition, labeled boxes, routine rows filled in. "Between" in ASA means the side shared by both angles; point to it. Any language for partner talk.
  - Watch for: pairing $\angle ABD$ with $\angle ADB$ (same triangle), or a congruence statement in alphabetical order instead of matching order.

  **QuickNotes (4 min).** Read the ASA bullets and point back to {ref:asa_why}. For the Parallelogram Theorem, point back to {ref:para_proof}: it proved the sides part.

guide_notes: |
  **Nov 19 (round 2): no exit ticket.** The exit item ($\angle A \cong \angle C$ from the parallelogram proof) was cut (it checks corresponding parts, the same step as Statement 7 of {ref:para_proof}, not the ray argument; practice 1 uses the opposite angles). The handout prints only the Warm-up heading.

  **Nov 19: cut for the core idea.** Warm-up: the DOG and CAT drawings (6 min, protractors) are now two printed DOG triangles; students find the third angle and say whether they are congruent (3 min). Problem 1: the triangles are printed with labels and marks, and Steps 1-2 (translate, rotate: review from 2.6) are printed, so the boxes are only the ray argument. The Step 3 reflection box is cut (this pair never needs it; it is a question in the plan). Problems 3-4 are now one problem: the definition is printed, and the parallel marks and diagonal are on the figure. In the proof, the shared side and both Given rows are printed; the blanks are the angle pairs, the congruence, and the reasons that matter. Cut the Check your understanding section ($MNKL$ fill-in); it is now practice 1, which replaces the old practice 1 (the same bowtie as {ref:asa_example}).

  **Source.** 2.7 & 2.9 Student Notes (Warm-up 2.7.1, Activity 2.7.2, Activity 2.7.4, Cool-down 1) and 2.7 Practice Problems. Cool-down 1 is the same proof as Activity 2.7.4, so it is the partner problem. Source typo fixed: "$\overline{BE} \parallel \overline{AD}$" is $\overline{BC} \parallel \overline{AD}$.

  **Practice.** The source key listed "4. 125°" and "5. D" from another version; here 4 is D and 5 is a proof. Practice 6 is SAS review from Lesson 2.6. Row 5 is $\triangle KBQ \cong \triangle ABQ$ ($K \to A$, $B \to B$, $Q \to Q$).

  **Scoring notes (MLL).** Score the math, not grammar. Accept "same", "equal", or a home-language word for congruent; "alt. int. angles"; "CPCTC" or "matching parts" for corresponding parts; a reason written as a short phrase.
