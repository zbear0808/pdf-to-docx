id: 3.4
title: Dilating lines and angles
notes_title: Dilating lines and angles
framing: >-
  Does a dilation change angle measures? Where does a line go after a dilation?
materials: ruler
headings: warmup
max_pages: 2                       # one double-sided sheet: Problem 3 on the front, QuickNotes on the back

sections:
  - kind: warmup
    items:
      - minutes: 3
        prompt: '$\triangle A''B''C''$ is a dilation of $\triangle ABC$ with center $P$ and scale factor 2. How do the angles of $\triangle A''B''C''$ compare to the angles of $\triangle ABC$?'
        figure: 3.4_warmup
        fig_w: 2.0
        fill:
          - ['Bigger, the same, or smaller?', 'the same']
          - ['Is your answer true for every dilation? (yes or no)', 'yes']
        fill_cols: 1
        box_w: 1.0
        answer: '$\angle A \cong \angle A''$, $\angle B \cong \angle B''$, and $\angle C \cong \angle C''$. The image is bigger but has the same shape.'

  - kind: together
    items:
      - n: 1
        id: center_line
        minutes: 2
        prompt: 'A dilation with center $C$ and scale factor 2 takes $C$ to $C'' = C$ and $E$ to $E''$, twice as far from $C$.'
        figure: 3.4_lines
        layout: stacked
        frame:
          - ['A line through the center of a dilation lands on', 'itself', '.']
        answer: 'Both $C''$ and $E''$ are on line $CE$, so line $C''E''$ is line $CE$.'

  - kind: partner
    items:
      - n: 2
        id: jada_proof
        minutes: 10
        prompt:
          - '$\triangle A''B''C''$ is the dilation of $\triangle ABC$ from the warm-up (center $P$, scale factor 2). $E$ is on $\overline{PB}$, and $E''$ is the image of $E$.'
          - '**Fact:** A transversal cuts two lines. If corresponding angles are congruent, then the two lines are parallel.'
          - 'Use the warm-up and the fact to explain why $\overline{BC} \parallel \overline{B''C''}$.'
          - '*Optional start:* $\angle E''B''C''$ is the image of $\angle EBC$, so ...'
        figure: 3.4_proof
        fig_w: 2.0
        box: 1.9
        answer: '$\angle E''B''C''$ is the image of $\angle EBC$, and a dilation does not change angle measures, so $\angle E''B''C'' \cong \angle EBC$. Line $PB$ is a transversal that cuts $\overline{BC}$ and $\overline{B''C''}$, and the two angles are corresponding angles. Congruent corresponding angles mean $\overline{BC} \parallel \overline{B''C''}$.'
      - n: 3
        id: same_or_parallel
        minutes: 4
        prompt: '$\triangle ABC$ is dilated with center $D$ and scale factor 2. Give a reason for each answer.'
        figure: 3.4_cyu
        fig_w: 1.9
        parts:
          - label: a.
            prompt: 'Is line $A''B''$ the same line as line $AB$, or parallel to it?'
            answer: 'Parallel. Line $AB$ does not pass through the center $D$.'
          - label: b.
            prompt: 'Is line $B''C''$ the same line as line $BC$, or parallel to it?'
            answer: 'The same line. Line $BC$ passes through the center $D$.'

  - kind: notes

notes_height: 1.5
quicknotes:
  - '**LT 1: I can explain what a dilation does to angles.**'
  - '- A dilation does not change angle measures.'
  - '- If $\triangle A''B''C''$ is a dilation of $\triangle ABC$, then $\angle A \cong \angle A''$, $\angle B \cong \angle B''$, and $\angle C \cong \angle C''$.'
  - '**LT 2: I can explain what a dilation does to lines.**'
  - '- A line through the center of the dilation lands on itself.'
  - '- A line that does not pass through the center goes to a parallel line.'
  - '- Why ({ref:jada_proof}): line $PB$ is a transversal for $\overline{BC}$ and $\overline{B''C''}$. $\angle E''B''C''$ is the image of $\angle EBC$, so they are congruent corresponding angles, and $\overline{BC} \parallel \overline{B''C''}$.'

practice:
  title: 'Dilating lines and angles: practice'
  rows:
    - cells:
        - n: 1
          prompt: '$\angle A''B''C''$ is a dilation of $\angle ABC$ with center $P$ and scale factor 3. The measure of $\angle ABC$ is $21^\circ$. What is the measure (how many degrees) of $\angle A''B''C''$?'
          answer: '$21^\circ$. A dilation does not change angle measures.'
        - n: 2
          prompt: 'Select **all** the lines that could be the image of line $m$ by a dilation.'
          figure: 3.4_five_lines
          fig_w: 1.9
          layout: stacked
          choices: ['$\ell$', '$m$', '$n$', '$o$', '$p$']
          choice_cols: 5
          work: 0.1
          answer: '[B], [C], [E]. $m$ itself (center on $m$), or a line parallel to $m$: $n$ and $p$.'
    - cells:
        - n: 3
          prompt: 'Line $f$ is dilated with scale factor 2. The image is line $g$. With scale factor 2, each image point is twice as far from the center as the original point. Which labeled point could be the center of this dilation?'
          figure: 3.4_center
          fig_w: 1.9
          layout: stacked
          choices: ['$A$', '$B$', '$C$', '$D$']
          choice_cols: 4
          work: 0.1
          answer: '[D]. $g$ is twice as far from the center as $f$, on the same side, so the center is on the far side of $f$ from $g$. A center on $f$ ($C$) or $g$ ($B$) would leave that line in place.'
        - n: 4
          prompt: 'Quadrilateral $A''B''C''E''$ is the image of quadrilateral $ABCE$ after a dilation with center $F$. Find the scale factor of this dilation.'
          figure: 3.4_quad
          fig_w: 2.2
          layout: stacked
          work: 0.6
          answer: '$\frac{1}{2}$, since $\frac{1.5}{3} = \frac{3}{6} = \frac{2.5}{5} = \frac{1}{2}$.'
    - cells:
        - n: 5
          prompt:
            - 'In $\triangle ABC$ and $\triangle XYZ$, $\angle CAB$ and $\angle ZXY$ are both $30^\circ$, $AC$ and $XZ$ are both 3 units, and $CB$ and $ZY$ are both 2 units.'
            - 'Start from the $30^\circ$ angle and side $AC$ below. Sketch 2 triangles with these measurements that are NOT congruent. (Unit 2)'
          figure: 3.4_ssa
          fig_w: 2.3
          work: 0.3
          answer: 'Solid: $\triangle ABC$. Dashed: $\triangle XYZ$ drawn with $X$ on $A$ and $Z$ on $C$. Both have a $30^\circ$ angle, a side of 3, and a side of 2 ($CB = ZY = 2$), but $AB \neq XY$, so they are not congruent.'
    - heading: SBA review
      cells:
        - n: 6
          prompt: 'What is the value of $k$ so that the slope between the points $(3, k)$ and $(1, -3)$ is 5?'
          work: 1.2
          answer: ['$\frac{k - (-3)}{3 - 1} = 5$', '$k + 3 = 10$, so $k = 7$']
  selected: [[1, '$21^\circ$'], [2, 'B, C, E'], [3, D], [4, '$\frac{1}{2}$'], [6, '$k = 7$']]

plan: |
  **Overview.** 3.1 and 3.3: dilations, lengths scale by $k$. Today: angles stay the same, and lines either stay put (through the center) or go to parallel lines. Lesson 3.5 uses the parallel result for the midsegment.

  **Core idea.** Students see that a dilation keeps angle measures, so a line that misses the center goes to a parallel line: line $PB$ goes through the center, cuts $\overline{BC}$ and $\overline{B'C'}$, and makes congruent corresponding angles with them. Spend whole-class time on the {ref:jada_proof} share. Known steps are printed: $C' = C$ and $E'$ in {ref:center_line} (the 3.1 move), $E$, $E'$, and the corresponding angles fact in {ref:jada_proof}, and the image points in {ref:same_or_parallel}. Only the new steps are blank: where line $C'E'$ lands, why $\overline{BC} \parallel \overline{B'C'}$, and same line or parallel. The angle fact (3.3 QuickNotes) stays the warm-up's blank; printing it in {ref:jada_proof} would answer the warm-up.

  **Objectives.** (1) Use the fact that a dilation does not change angle measures. (2) Explain what a dilation does to a line through the center and to a line not through the center. **Standards.** G-SRT.A.1a, G-SRT.A.2. SMP 3, 7.

  **Quick look (25 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up | Students, 1 min share |
  | 3-5 | Together: Problem 1 | Teacher + class |
  | 5-19 | With a partner: Problems 2-3 | Students (pairs), 2 min share |
  | 19-22 | QuickNotes | Teacher + class |
  | 22-25 | Collect, assign practice | Teacher |

  **Warm-up (3 min).** Take "the same" and ask "How could we check?" Put a protractor on one angle at the doc camera. Name the fact: a dilation does not change angle measures. {ref:jada_proof} uses it.

  **Together (2 min, doc camera).** {ref:center_line}: $C' = C$ and $E'$ are printed (the 3.1 move), so point to them and ask "Where is line $C'E'$?" Students fill the box. Then ask "What about a line that misses $C$?" and send that question to partners.

  **With a partner (14 min, 2 min share).** {ref:jada_proof}, then {ref:same_or_parallel}. The key move in {ref:jada_proof} is seeing line $PB$ as a transversal for $\overline{BC}$ and $\overline{B'C'}$.
  - Assessing: "Which line cuts both $\overline{BC}$ and $\overline{B'C'}$?" "Which angle is the image of $\angle EBC$?"
  - Advancing: "Does this work for $\overline{AC}$ too?" (Yes: a point on $\overline{PC}$ or $\overline{PA}$ gives $\overline{AC} \parallel \overline{A'C'}$ and $\overline{AB} \parallel \overline{A'B'}$.)
  - Watch for: "they look parallel" or "same shape" with no angle reason, and "alternate interior" for the pair (both angles sit in the same spot at $B$ and at $B'$, so they are corresponding).
  - Share: one pair reads their {ref:jada_proof} explanation; revoice it as image angle, transversal, corresponding angles, parallel.
  - {ref:same_or_parallel}: students check whether each line passes through $D$. Credit the answer plus a short reason (the reasons are {ref:center_line} and {ref:jada_proof}). Common error: "parallel" in part b (didn't notice $D$, $C$, and $B$ are on one line; the tick marks and the $B = C'$ label show it).
  - MLL supports: labeled figure, the printed fact, optional start, any language in talk. "Corresponding" has two meanings in this unit: matching parts of a figure and its image, and angles in the same spot along a transversal. Today it is the transversal one; point to line $PB$ when you say "transversal."

  **QuickNotes (3 min).** Students turn to page 2 only now: its Why bullet answers {ref:jada_proof}, and the LT 2 bullets answer {ref:same_or_parallel}. Read together and tie the Why bullet to the pair's explanation from the share.

guide_notes: |
