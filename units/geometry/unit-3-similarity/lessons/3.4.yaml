id: 3.4
title: Dilating lines and angles
notes_title: Dilating lines and angles
framing: >-
  A dilation makes every length longer or shorter by the scale factor. Today's question: what does a dilation do
  to the angles of a figure, and what does it do to lines?
materials: ruler

sections:
  - kind: warmup
    items:
      - minutes: 3
        prompt: '$\triangle A''B''C''$ is a dilation of $\triangle ABC$ with center $P$ and scale factor 2.'
        figure: 3.4_warmup
        fig_w: 2.0
        parts:
          - label: a.
            prompt: 'What do you think is true about the angles of $\triangle A''B''C''$ compared to the angles of $\triangle ABC$?'
            work: 0.5
            answer: 'Sample: they look the same. $\angle A \cong \angle A''$, $\angle B \cong \angle B''$, $\angle C \cong \angle C''$. The image is bigger but has the same shape.'
          - label: b.
            prompt: 'Do you think this is true for every dilation?'
            work: 0.4
            answer: 'Sample: yes, a dilation changes size, not shape.'

  - kind: together
    items:
      - n: 1
        minutes: 3
        prompt: 'Estimate each dilation. Use center $C$ for both. Label each image.'
        figure: 3.4_lines
        fig_w: 3.0
        parts:
          - label: a.
            prompt: 'Dilate point $D$ with scale factor $\frac{3}{2}$. Label the image $D''$.'
            work: 0.3
            answer: '$D''$ is on line $AB$, on $D$''s side of $C$, with $CD'' = 1.5CD$.'
          - label: b.
            prompt: 'Dilate line $CE$ with scale factor 2. Label the image $C''E''$.'
            work: 0.3
            answer: '$C'' = C$ and $CE'' = 2CE$, so line $C''E''$ is line $CE$.'
      - n: 2
        minutes: 2
        prompt: 'Look at your work in Problem 1. What happens when you dilate a line using a center that is ON the line? Fill in the box.'
        frame:
          - ['A line through the center of a dilation lands on', 'itself', '.']

  - kind: partner
    items:
      - n: 3
        id: jada_proof
        minutes: 10
        prompt: 'Jada says each side of $\triangle ABC$ is parallel to its image in $\triangle A''B''C''$ (same dilation: center $P$, scale factor 2). Prove it for $\overline{BC}$.'
        figure: 3.4_proof
        fig_w: 1.8
        layout: stacked
        parts:
          - label: a.
            prompt: 'Mark a point $E$ on $\overline{PB}$, between $P$ and $B$.'
            work: 0
            answer: 'Sample $E$ in red, between $P$ and $B$.'
          - label: b.
            prompt: 'Estimate the dilation of $E$ with center $P$ and scale factor 2. Label it $E''$.'
            work: 0
            answer: '$E''$ is on ray $PB$, twice as far from $P$ as $E$.'
          - label: c.
            prompt: 'Compare $\angle EBC$ and $\angle E''B''C''$. Then finish the proof. Fill in each box.'
            frame:
              - ['$\angle E''B''C''$ is the image of $\angle EBC$, so the two angles are', 'congruent', '.']
              - ['In the {ref:jada_proof} figure, they are', 'corresponding', 'angles for the transversal $\overleftrightarrow{PB}$.', 1.4]
              - ['Congruent corresponding angles mean $\overline{BC}$ is', 'parallel', 'to $\overline{B''C''}$.']

  - kind: notes
    new_page: false

  - kind: exit
    items:
      - n: 1
        minutes: 5
        prompt: '$\triangle ABC$ is dilated with center $D$ and scale factor 2. $m\angle ABC = 42^\circ$. Answer each question and give a reason.'
        figure: 3.4_cyu
        fig_w: 1.9
        parts:
          - label: a.
            prompt: 'Find $m\angle A''B''C''$.'
            work: 0.45
            answer: '$42^\circ$. A dilation does not change angle measures.'
          - label: b.
            prompt: 'Is line $A''B''$ the same line as line $AB$, or parallel to it?'
            work: 0.45
            answer: 'Parallel. Line $AB$ does not pass through the center $D$.'
          - label: c.
            prompt: 'Is line $B''C''$ the same line as line $BC$, or parallel to it?'
            work: 0.45
            answer: 'The same line. Line $BC$ passes through the center $D$.'

notes_height: 1.5
quicknotes:
  - '**LT 1: I can explain what a dilation does to angles.**'
  - '- A dilation does not change angle measures. Corresponding angles are congruent.'
  - '- If $\triangle A''B''C''$ is a dilation of $\triangle ABC$, then $\angle A \cong \angle A''$, $\angle B \cong \angle B''$, and $\angle C \cong \angle C''$.'
  - '**LT 2: I can explain what a dilation does to lines.**'
  - '- A line through the center of the dilation does not change. It lands on itself.'
  - '- A line that does not pass through the center goes to a parallel line.'
  - '- Why: the angles at $B$ and $B''$ in {ref:jada_proof} are congruent corresponding angles, so $\overline{BC} \parallel \overline{B''C''}$.'

practice:
  title: 'Dilating lines and angles: practice'
  rows:
    - cells:
        - n: 1
          prompt: '$\angle A''B''C''$ is a dilation of $\angle ABC$ with center $P$ and scale factor 3. The measure of $\angle ABC$ is $21^\circ$. What is the measure (how many degrees) of $\angle A''B''C''$?'
          work: 0.8
          answer: '$21^\circ$. A dilation does not change angle measures.'
        - n: 2
          prompt: 'Here is a diagram with 5 lines. Select **all** the lines that could be the image of line $m$ by a dilation.'
          figure: 3.4_five_lines
          fig_w: 1.9
          layout: stacked
          choices: ['$\ell$', '$m$', '$n$', '$o$', '$p$']
          choice_cols: 5
          work: 0.1
          answer: '[B], [C], [E]. $m$ itself (center on $m$), or a line parallel to $m$: $n$ and $p$.'
    - cells:
        - n: 3
          prompt: 'Line $f$ is dilated with scale factor 2. The image is line $g$. Which labeled point could be the center of this dilation?'
          figure: 3.4_center
          fig_w: 1.9
          layout: stacked
          choices: ['$A$', '$B$', '$C$', '$D$']
          choice_cols: 4
          work: 0.1
          answer: '[D]. $g$ is twice as far from the center as $f$, on the same side, so the center is on the far side of $f$ from $g$. A center on $f$ ($C$) or $g$ ($B$) would leave that line in place.'
        - n: 4
          prompt: 'Quadrilateral $A''B''C''E''$ is the image of quadrilateral $ABCE$ after a dilation with center $F$. Find the scale factor of this dilation.'
          figure: 3.4_quad
          fig_w: 2.2
          layout: stacked
          work: 0.6
          answer: '$\frac{1}{2}$, since $\frac{1.5}{3} = \frac{3}{6} = \frac{2.5}{5} = \frac{1}{2}$.'
    - cells:
        - n: 5
          prompt:
            - 'Here are some measurements for $\triangle ABC$ and $\triangle XYZ$: $\angle CAB$ and $\angle ZXY$ are both $30^\circ$, $AC$ and $XZ$ are both 3 units, and $CB$ and $ZY$ are both 2 units.'
            - 'Clare says the triangles might not be congruent. Start from the $30^\circ$ angle and side $AC$ below. Sketch 2 triangles with these measurements that are NOT congruent. (Unit 2)'
          figure: 3.4_ssa
          fig_w: 2.3
          work: 0.3
          answer: 'Solid: $\triangle ABC$. Dashed: $\triangle XYZ$ drawn with $X$ on $A$ and $Z$ on $C$. Both have a $30^\circ$ angle, a side of 3, and a side of 2 ($CB = ZY = 2$), but $AB \neq XY$, so they are not congruent.'
    - heading: SBA review
      cells:
        - n: 6
          prompt: 'What is the value of $k$ so that the slope between the points $(3, k)$ and $(1, -3)$ is 5?'
          work: 1.2
          answer: ['$\frac{k - (-3)}{3 - 1} = 5$', '$k + 3 = 10$, so $k = 7$']
  selected: [[1, '$21^\circ$'], [2, 'B, C, E'], [3, D], [4, '$\frac{1}{2}$'], [6, '$k = 7$']]

plan: |
  **Overview.** Lessons 3.1 and 3.3 set up dilations and showed lengths scale by $k$. Today: angles stay the same, and lines either stay put (through the center) or go to parallel lines. Lesson 3.5 uses the parallel result for the midsegment.

  **Objectives.** (1) Explain why corresponding angles in a dilation are congruent. (2) Explain what a dilation does to a line through the center and to a line not through the center. **Standards.** G-SRT.A.1a, G-SRT.A.2. SMP 3, 7.

  **Quick look (30 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up | Students, 1 min share |
  | 3-8 | Together: Problems 1-2 | Teacher + class |
  | 8-18 | With a partner: Problem 3 | Students (pairs) |
  | 18-21 | QuickNotes | Teacher + class |
  | 21-27 | Exit ticket 1 (1 min to turn the page) | Students |
  | 27-30 | Collect, assign practice | Teacher |

  **Warm-up (3 min).** Take "they look the same" and ask "how could we check?" Protractor on one angle at the doc camera. Name it the assertion (LT 1 in QuickNotes).

  **Together (5 min, doc camera).** Problem 1 (3 min): use a ruler along line $AB$ from $C$. Stress that $D'$ stays on $D$'s side of $C$ (the common error is putting it on the other side). Problem 2 (2 min): one box, call on two pairs.

  **Partners (10 min).**
  - Problem 3 (10 min, 2 min share included): the key move is seeing $\overleftrightarrow{PB}$ as a transversal. Assessing: "Which line cuts both $\overline{BC}$ and $\overline{B'C'}$?" Advancing: "Does this work for $\overline{AC}$ too?" (Yes: the same steps with a point on $\overline{PC}$ or $\overline{PA}$ prove $\overline{AC} \parallel \overline{A'C'}$ and $\overline{AB} \parallel \overline{A'B'}$.)
  - Early finishers: start the practice problems.
  - MLL supports: labeled figures, fill boxes on 2 and 3c; any language in talk. On the exit ticket, students can point to the QuickNotes bullet they used and name it in a few words.

  **QuickNotes (3 min).** Read together. Connect bullet 3 of LT 2 to a student's Problem 3.

  **Exit (5 min + 1 to turn the page).** Students apply the QuickNotes to the figure: part a (LT 1) needs the angle stays $42^\circ$; parts b and c (LT 2) need them to check whether each line passes through $D$. Credit an answer plus a short reason (the "why"). Common errors: $84^\circ$ in part a (doubled the angle); "parallel" in part c (didn't notice $D$, $C$, $B$ are on one line).

