  **Earlier cuts (Nov 16).** To fit 30 minutes: the scale factor less than 1 partner item, the grid slope item (same "sides are parallel" fact the proof shows), both check-your-understanding items, two more points to dilate in the Together problem, and the exit parts on lengths (Lesson 3.3 content). Practice went from 9 to 6: cut the perimeter item and the proportion item (same scale-factor move as the quadrilateral item) and the system SBA item.

  **Scoring notes (MLL).** Score the math, not grammar. Accept "same size", "equal", or a home-language word for congruent; "corr. angles" or "same spot" for corresponding if the student names or marks the pair; "goes through $D$" for passes through the center.
