id: 3.13
title: Tangled triangles
notes_title: Altitude to the hypotenuse
framing: >-
  Draw the altitude from the right angle of a right triangle and you get two smaller triangles. Today's question:
  how are the three triangles related, and how can we use that to find missing lengths?
materials: patty paper

sections:
  - kind: warmup
    items:
      - minutes: 4
        prompt: 'Review: the Pythagorean theorem says $a^2 + b^2 = c^2$, where $c$ is the hypotenuse.'
        figure: 3.13_warmup
        fig_w: 1.5
        after: 0.04
        parts:
          - label: a.
            prompt: 'Find $x$.'
            fill: [['$x =$', '9']]
            box_w: 0.9
            answer: '$x^2 + 12^2 = 15^2$, so $x^2 = 225 - 144 = 81$ and $x = 9$.'
            work: 0.6
          - label: b.
            prompt: 'A triangle has sides 10, 25, and 26. Is it a right triangle? Fill in each box.'
            fill: [['$10^2 + 25^2 =$', '725'], ['$26^2 =$', '676'], ['Right triangle? (yes or no)', 'no']]
            box_w: 0.9
            answer: '$725 \neq 676$, so it is not a right triangle (converse of the Pythagorean theorem). Since $725 > 676$, it is acute.'
            work: 0

  - kind: together
    items:
      - n: 1
        minutes: 3
        prompt: 'Is $\triangle ADC \sim \triangle CDB$? Use the angles. Fill in each box.'
        figure: 3.13_together
        fig_w: 2.7
        after: 0.04
        frame:
          - ['$m\angle ACD = 180^\circ - 90^\circ - 53^\circ =$', '$37^\circ$', '.']
          - ['$m\angle DCB = 180^\circ - 90^\circ - 37^\circ =$', '$53^\circ$', '.']
          - ['So $\triangle ADC \sim \triangle CDB$ by', 'AA', '.', 0.9]
        answer: '$\angle A \cong \angle DCB$ ($53^\circ$) and $\angle ADC \cong \angle CDB$ (right angles). Check with sides: $\frac{CD}{AD} = \frac{7.2}{5.4}$, $\frac{DB}{CD} = \frac{9.6}{7.2}$, $\frac{CB}{AC} = \frac{12}{9}$. All equal $\frac{4}{3}$.'
        work: 0
      - n: 2
        minutes: 2
        prompt: 'Pretend all the measurements in Problem 1 are erased. You only know that $\angle ACB$ and $\angle ADC$ are right angles. Can you prove $\triangle ADC \sim \triangle CDB$ by adding just one measurement? Which one? Explain.'
        work: 0.8
        answer: 'Yes. One acute angle is enough, for example $m\angle A = 53^\circ$. Then $m\angle ACD = 37^\circ$ and $m\angle DCB = 90^\circ - 37^\circ = 53^\circ$, so AA. Any value works the same way ($x$ and $90^\circ - x$), so the triangles are always similar.'

  - kind: partner
    page_break_before: true
    items:
      - n: 3
        minutes: 2
        prompt: 'In right $\triangle HFE$, $\overline{EG}$ is the altitude to the hypotenuse. How many right triangles are in the figure? Name them.'
        figure: 3.13_hfe
        fig_w: 2.6
        after: 0.04
        fill: [['Number:', '3'], ['Names:', '$\triangle HFE$, $\triangle HEG$, $\triangle EFG$']]
        box_w: 2.6
        answer: 'Right angles: $\angle HEF$, $\angle HGE$, $\angle EGF$.'
        work: 0
      - n: 4
        minutes: 5
        prompt:
          - 'Untangle the triangles from Problem 3.'
          - 'Step 1: Trace $\triangle HEG$ and $\triangle EFG$ on separate pieces of patty paper.'
          - 'Step 2: Turn or flip each one so the hypotenuse is on top and the right angle is at the bottom, like $\triangle HFE$.'
          - 'Step 3: Draw both triangles in the box. Label the vertices, the lengths you know, and the angle measures.'
        draw:
          height: 2.4
          key_figure: 3.13_redraw
          key_fig_w: 3.3
          key_note: '$\triangle HEG$: $\angle H = 53^\circ$, $\angle E = 37^\circ$, $\angle G = 90^\circ$. $\triangle EFG$: $\angle E = 53^\circ$, $\angle F = 37^\circ$, $\angle G = 90^\circ$.'
      - n: 5
        minutes: 3
        prompt: 'Write the similarity statement. Match the vertices by angle. Fill in each box.'
        after: 0.04
        frame:
          - ['$\triangle HFE \sim \triangle$', '$HEG$', '.']
          - ['$\triangle HFE \sim \triangle$', '$EFG$', '.']
          - ['In Problem 4, each pair of triangles has two congruent angles, so they are similar by', 'AA', '.', 0.9]
        answer: 'Order: the $53^\circ$ angle, then the $37^\circ$ angle, then the right angle.'
        work: 0
      - n: 6
        minutes: 2
        prompt: 'Use the Pythagorean theorem to find $HF$ in Problem 3.'
        fill: [['$HF =$', '20']]
        box_w: 0.9
        answer: '$12^2 + 16^2 = 144 + 256 = 400$, so $HF = 20$.'
        work: 0.6
      - n: 7
        minutes: 4
        prompt: 'Use similarity to find $HG$, $GE$, and $GF$. Write a proportion for each one.'
        fill: [['$HG =$', '7.2'], ['$GE =$', '9.6'], ['$GF =$', '12.8']]
        fill_cols: 3
        box_w: 0.9
        answer:
          - '$\triangle HEG \sim \triangle HFE$, so $\frac{HG}{HE} = \frac{HE}{HF}$. Then $\frac{HG}{12} = \frac{12}{20}$ and $HG = 7.2$.'
          - 'Also $\frac{GE}{FE} = \frac{HE}{HF}$. Then $\frac{GE}{16} = \frac{12}{20}$ and $GE = 9.6$.'
          - '$GF = 20 - 7.2 = 12.8$ (or $\frac{GF}{16} = \frac{16}{20}$).'
        work: 1.3

  - kind: notes

  - kind: cyu
    items:
      - n: 1
        minutes: 3
        prompt: 'In right $\triangle PQR$, $\overline{QS}$ is the altitude to the hypotenuse. Which similarity statement is true?'
        figure: 3.13_cyu
        fig_w: 2.0
        choices: ['$\triangle PQR \sim \triangle PQS$', '$\triangle PQR \sim \triangle SQR$', '$\triangle PQR \sim \triangle PSQ$', '$\triangle PQR \sim \triangle QRS$']
        choice_cols: 2
        answer: '[C] $P \to P$, right angle $Q \to$ right angle $S$, $R \to Q$. [A] copies the letters from the figure; [B] pairs $P$ with the right angle $S$; [D] pairs the right angle $Q$ with $\angle R$.'
        work: 0.1
  - kind: exit
    items:
      - n: 2
        minutes: 5
        prompt: 'Find $AB$ and $BD$. Then check $BD$ a different way. Show your work.'
        figure: 3.13_exit
        fig_w: 2.3
        fill: [['$AB =$', '4'], ['$BD =$', '2.4']]
        fill_cols: 2
        box_w: 0.9
        answer:
          - '$AC = 3.2 + 1.8 = 5$. $AB^2 + 3^2 = 5^2$, so $AB = 4$.'
          - 'Pythagorean theorem in $\triangle BDC$: $BD^2 + 1.8^2 = 3^2$, $BD^2 = 5.76$, $BD = 2.4$.'
          - 'Check with similarity: $\triangle ABC \sim \triangle BDC$, so $\frac{BD}{AB} = \frac{DC}{BC}$. Then $\frac{BD}{4} = \frac{1.8}{3}$ and $BD = 2.4$.'
        work: 1.6

quicknotes:
  - '**LT 1: I can find the similar triangles made by the altitude to the hypotenuse of a right triangle.**'
  - '- An altitude goes from a vertex to the opposite side and is perpendicular to that side.'
  - '- In right $\triangle ABC$ with right angle $C$, altitude $\overline{CD}$ makes three similar triangles: $\triangle ABC \sim \triangle ACD \sim \triangle CBD$.'
  - '- Why: each small triangle has a right angle and shares one acute angle with $\triangle ABC$ (AA).'
  - '- Match each vertex of $\triangle ABC$ to the vertex with the same angle. The right angle $C$ goes with the right angle $D$.'
  - '**LT 2: I can use the Pythagorean theorem and similarity to find lengths.**'
  - '- Pythagorean theorem: in a right triangle, $a^2 + b^2 = c^2$. The hypotenuse $c$ is across from the right angle and is the longest side.'
  - '- Converse: if $a^2 + b^2 = c^2$, then the triangle is a right triangle.'
  - '- Similarity: write a proportion with matching sides, for example $\frac{AD}{AC} = \frac{AC}{AB}$. Then check with the other method.'

practice:
  title: 'Altitude to the hypotenuse: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'In right $\triangle ABC$, altitude $\overline{CD}$ is drawn to the hypotenuse. Select **all** the triangles that are similar to $\triangle ABC$.'
          figure: 3.13_p1
          fig_w: 1.9
          choices: ['$\triangle ACD$', '$\triangle BCD$', '$\triangle BDC$', '$\triangle CAD$', '$\triangle CBD$']
          answer: ['[A], [E]', '$\triangle ABC \sim \triangle ACD$: $A \to A$, $B \to C$, $C \to D$. $\triangle ABC \sim \triangle CBD$: $A \to C$, $B \to B$, $C \to D$. [B], [C], [D] match the vertices in the wrong order.']
          work: 0.1
        - n: 2
          prompt: 'In $\triangle ABC$ (**not** a right triangle), altitude $\overline{CD}$ is drawn to side $\overline{AB}$, and $AB = c$. Which statement must be true?'
          figure: 3.13_p2
          fig_w: 2.2
          choices: ['$m\angle ACB = m\angle B$', '$b^2 = c^2 + a^2$', '$\triangle ADC \sim \triangle ACB$', 'The area of $\triangle ABC$ is $\frac{1}{2}hc$.']
          answer: ['[D]', 'Area $= \frac{1}{2} \cdot$ base $\cdot$ height, with base $AB = c$ and height $CD = h$. [B] and [C] need a right angle at $C$, and $m\angle ACB = 75^\circ$. [A] has no reason to be true.']
          work: 0.1
    - cells:
        - n: 3
          prompt: 'In right $\triangle ABC$, altitude $\overline{CD}$ with length $h$ is drawn to the hypotenuse. $AD = 12$ and $DB = 3$. Find $h$.'
          figure: 3.13_p3
          fig_w: 2.3
          answer: ['$\triangle ADC \sim \triangle CDB$, so $\frac{AD}{CD} = \frac{CD}{DB}$: $\frac{12}{h} = \frac{h}{3}$.', '$h^2 = 36$, so $h = 6$.']
          work: 1.2
        - n: 4
          prompt: 'In the diagram, $\overline{A''B''} \parallel \overline{AB}$.'
          figure: 3.13_p4
          fig_w: 1.9
          parts:
            - label: a.
              prompt: 'Find $A''A$.'
              answer: ['$\triangle CA''B'' \sim \triangle CAB$ with scale factor $\frac{20}{8} = 2.5$.', '$CA = 12 \cdot 2.5 = 30$, so $A''A = 30 - 12 = 18$.']
              work: 0.8
            - label: b.
              prompt: 'Find $B''B$.'
              answer: '$CB = 6 \cdot 2.5 = 15$, so $B''B = 15 - 6 = 9$.'
              work: 0.8
    - cells:
        - n: 5
          prompt: '$\triangle DEF$ is formed by connecting the midpoints of the sides of $\triangle ABC$. Select **all** true statements.'
          figure: 3.13_p5
          fig_w: 1.8
          choices: ['$\triangle BDE \cong \triangle EFC$', '$\triangle BDE \cong \triangle DAF$', '$\overline{BD} \cong \overline{FE}$', '$BC = 8$', '$BC = 6$']
          answer: ['[A], [B], [C], [D]', 'Each midsegment is half the side it is parallel to: $DF = \frac{1}{2}BC$, so $BC = 8$. $FE = \frac{1}{2}AB = BD$. The midsegments cut $\triangle ABC$ into four congruent triangles (SSS).']
          work: 0.1
    - heading: SBA review
      cells:
        - n: 6
          prompt: 'Hassan has twice as many five-dollar bills as one-dollar bills in his wallet. He has 33 dollars in all. How many of each bill does he have?'
          answer: ['Let $x$ = number of one-dollar bills, so $2x$ = number of five-dollar bills.', '$1x + 5(2x) = 33$, $11x = 33$, $x = 3$.', '3 one-dollar bills and 6 five-dollar bills.']
          work: 2.0
        - n: 7
          prompt: ['Solve the system by graphing.', '$y = x - 2$', '$y = x^2 - x - 2$']
          figure: 3.13_p7
          fig_w: 2.4
          answer: ['$(0, -2)$ and $(2, 0)$', 'Check: $x - 2 = x^2 - x - 2$ gives $x^2 - 2x = 0$, so $x = 0$ or $x = 2$.']
          work: 0.1
  selected: [[1, 'A, E'], [2, D], [3, '6'], [4, 'a. 18  b. 9'], [5, 'A, B, C, D'], [6, '3 ones, 6 fives'], [7, '(0, -2), (2, 0)']]

plan: |
  **Overview.** Last lesson of Unit 3. Students already know AA (3.9) and the Pythagorean theorem. Today they see that the altitude from the right angle splits a right triangle into two triangles similar to it and to each other, then find lengths two ways (Pythagorean theorem and proportions).

  **Objectives.** (1) Name the three similar triangles and write a correct similarity statement. (2) Find missing lengths with the Pythagorean theorem and with similarity, and check one with the other. **Standards.** G-SRT.B.4, G-SRT.B.5. SMP 3, 5 (patty paper), 7.

  **Quick look (40 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-4 | Warm-up (Pythagorean review) | Students, 1 min share |
  | 4-9 | Together: Problems 1-2 | Teacher + class |
  | 9-25 | With a partner: Problems 3-7 | Students (pairs) |
  | 25-29 | QuickNotes | Teacher + class |
  | 29-37 | CYU 1 and exit ticket 2 | Students (individual) |
  | 37-40 | Collect exit ticket, assign practice | Teacher |

  **Together (5 min, doc camera).** Problem 1: fill the angle boxes with the class, then check the side ratios (all $\frac{4}{3}$). Problem 2 (from Math Medic 6.4): ask "what is the least we need to know?" Push to "any one acute angle," then "actually nothing: $x$ and $90^\circ - x$ always work."

  **Work time (16 min, pairs).**
  - Problem 4 is the core. Students trace each small triangle and turn or flip it until the right angle is at the bottom. Assessing: "Which angle in $\triangle HEG$ is $53^\circ$? How do you know?" Advancing: "Which side of $\triangle HEG$ matches $\overline{HF}$?"
  - Common error in Problem 5: copying letters in figure order ($\triangle HGE$). Send them back to the angles in Problem 4.
  - Problem 7: if a pair is stuck, point to the hypotenuse of each triangle: 20, 12, 16 gives scale factors 0.6 and 0.8.
  - MLL supports: labeled figure, frames on Problems 1 and 5, any language in pair talk. Keep the words *altitude*, *hypotenuse*, *leg*.

  **QuickNotes (4 min).** Printed on page 3. Connect the AA bullet to Problem 2 and the proportion bullet to Problem 7.

  **CYU (8 min).** CYU 1 shows who matches vertices by angle. The exit ticket asks for two methods; full credit for either method plus a correct check.

guide_notes: |
  **Scoring notes (MLL).** Score the math, not the English. Accept decimal commas (2,4) and home-language words.
