id: 3.13
title: Altitude to the hypotenuse
notes_title: Altitude to the hypotenuse
framing: >-
  Draw the altitude from the right angle of a right triangle and you get two smaller triangles. Today's question:
  how are the three triangles related, and how can we use that to find missing lengths?
materials: patty paper

sections:
  - kind: warmup
    items:
      - minutes: 3
        prompt: 'Review: the Pythagorean theorem says $a^2 + b^2 = c^2$, where $c$ is the hypotenuse. Find $x$.'
        figure: 3.13_warmup
        fig_w: 1.5
        after: 0.04
        fill: [['$x =$', '9']]
        box_w: 0.9
        answer: '$x^2 + 12^2 = 15^2$, so $x^2 = 225 - 144 = 81$ and $x = 9$.'
        work: 0.4

  - kind: together
    items:
      - n: 1
        id: minimum
        minutes: 5
        prompt: 'Pretend all the measurements in the figure are erased. You only know that $\angle ACB$ and $\angle ADC$ are right angles. Can you prove $\triangle ADC \sim \triangle CDB$ by adding just one measurement? Which one? Explain.'
        figure: 3.13_together
        fig_w: 2.7
        after: 0.04
        frame:
          - ['Add:', 'one acute angle, like $m\angle A$', '.', 2.4]
          - ['So $\triangle ADC \sim \triangle CDB$ by', 'AA', '.', 0.9]
        work: 0.8
        answer: 'Yes. One acute angle is enough, for example $m\angle A = 53^\circ$. Then $m\angle ACD = 37^\circ$ and $m\angle DCB = 90^\circ - 37^\circ = 53^\circ$, so AA. Any value works the same way ($x$ and $90^\circ - x$), so the triangles are always similar.'

  - kind: partner
    items:
      - prompt: 'In right $\triangle HFE$, $\overline{EG}$ is the altitude to the hypotenuse. Use this figure for Problems {num:untangle} and {num:lengths}.'
        figure: 3.13_hfe
        fig_w: 2.2
        after: 0.04
        work: 0
        no_answer: true
      - n: 2
        id: untangle
        minutes: 7
        prompt:
          - 'Untangle the two small triangles.'
          - 'Step 1: Trace $\triangle HEG$ and $\triangle EFG$ on separate pieces of patty paper.'
          - 'Step 2: Turn or flip each one so the hypotenuse is on top and the right angle is at the bottom, like $\triangle HFE$.'
          - 'Step 3: Draw both triangles in the box. Label the vertices, the lengths you know, and the angle measures.'
        draw:
          height: 2.2
          key_figure: 3.13_redraw
          key_fig_w: 3.3
          key_note: '$\triangle HEG$: $\angle H = 53^\circ$, $\angle E = 37^\circ$, $\angle G = 90^\circ$. $\triangle EFG$: $\angle E = 53^\circ$, $\angle F = 37^\circ$, $\angle G = 90^\circ$.'
      - n: 3
        id: lengths
        minutes: 3
        prompt: '$HF = 20$. Use similarity to find $HG$ and $GE$. Write a proportion for each one.'
        fill: [['$HG =$', '7.2'], ['$GE =$', '9.6']]
        fill_cols: 2
        box_w: 0.9
        answer:
          - '$\triangle HEG \sim \triangle HFE$, so $\frac{HG}{HE} = \frac{HE}{HF}$. Then $\frac{HG}{12} = \frac{12}{20}$ and $HG = 7.2$.'
          - 'Also $\frac{GE}{FE} = \frac{HE}{HF}$. Then $\frac{GE}{16} = \frac{12}{20}$ and $GE = 9.6$.'
        work: 1.6

  - kind: notes
    new_page: false

  - kind: exit
    items:
      - n: 1
        id: exit
        minutes: 6
        prompt: 'Find $AB$ and $BD$. Then check $BD$ a different way. Show your work.'
        figure: 3.13_exit
        fig_w: 2.3
        fill: [['$AB =$', '4'], ['$BD =$', '2.4']]
        fill_cols: 2
        box_w: 0.9
        answer:
          - '$AC = 3.2 + 1.8 = 5$. $AB^2 + 3^2 = 5^2$, so $AB = 4$.'
          - 'Pythagorean theorem in $\triangle BDC$: $BD^2 + 1.8^2 = 3^2$, $BD^2 = 5.76$, $BD = 2.4$.'
          - 'Check with similarity: $\triangle ABC \sim \triangle BDC$, so $\frac{BD}{AB} = \frac{DC}{BC}$. Then $\frac{BD}{4} = \frac{1.8}{3}$ and $BD = 2.4$.'
        work: 2.6

quicknotes:
  - '**LT 1: I can find the similar triangles made by the altitude to the hypotenuse of a right triangle.**'
  - '- An altitude goes from a vertex to the opposite side and is perpendicular to that side.'
  - '- In right $\triangle ABC$ with right angle $C$, altitude $\overline{CD}$ makes three similar triangles: $\triangle ABC \sim \triangle ACD \sim \triangle CBD$.'
  - '- Why: each small triangle has a right angle and shares one acute angle with $\triangle ABC$ (AA).'
  - '- Match each vertex of $\triangle ABC$ to the vertex with the same angle. The right angle $C$ goes with the right angle $D$.'
  - '**LT 2: I can use the Pythagorean theorem and similarity to find lengths.**'
  - '- Pythagorean theorem: in a right triangle, $a^2 + b^2 = c^2$. The hypotenuse $c$ is across from the right angle and is the longest side.'
  - '- Similarity: write a proportion with matching sides, for example $\frac{AD}{AC} = \frac{AC}{AB}$. Then check with the other method.'

practice:
  title: 'Altitude to the hypotenuse: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'In right $\triangle ABC$, altitude $\overline{CD}$ is drawn to the hypotenuse. Select **all** the triangles that are similar to $\triangle ABC$.'
          figure: 3.13_p1
          fig_w: 1.9
          choices: ['$\triangle ACD$', '$\triangle BCD$', '$\triangle BDC$', '$\triangle CAD$', '$\triangle CBD$']
          answer: ['[A], [E]', '$\triangle ABC \sim \triangle ACD$: $A \to A$, $B \to C$, $C \to D$. $\triangle ABC \sim \triangle CBD$: $A \to C$, $B \to B$, $C \to D$. [B], [C], [D] match the vertices in the wrong order.']
          work: 0.1
        - n: 2
          prompt: 'In $\triangle ABC$ (**not** a right triangle), altitude $\overline{CD}$ is drawn to side $\overline{AB}$, and $AB = c$. Which statement must be true?'
          figure: 3.13_p2
          fig_w: 2.2
          choices: ['$m\angle ACB = m\angle B$', '$b^2 = c^2 + a^2$', '$\triangle ADC \sim \triangle ACB$', 'The area of $\triangle ABC$ is $\frac{1}{2}hc$.']
          answer: ['[D]', 'Area $= \frac{1}{2} \cdot$ base $\cdot$ height, with base $AB = c$ and height $CD = h$. [B] and [C] need a right angle at $C$, and $m\angle ACB = 75^\circ$. [A] has no reason to be true.']
          work: 0.1
    - cells:
        - n: 3
          prompt: 'In right $\triangle ABC$, altitude $\overline{CD}$ with length $h$ is drawn to the hypotenuse. $AD = 12$ and $DB = 3$. Find $h$.'
          figure: 3.13_p3
          fig_w: 2.3
          answer: ['$\triangle ADC \sim \triangle CDB$, so $\frac{AD}{CD} = \frac{CD}{DB}$: $\frac{12}{h} = \frac{h}{3}$.', '$h^2 = 36$, so $h = 6$.']
          work: 1.2
        - n: 4
          prompt: 'In the diagram, $\overline{A''B''} \parallel \overline{AB}$. Find $A''A$.'
          figure: 3.13_p4
          fig_w: 1.9
          answer: ['$\triangle CA''B'' \sim \triangle CAB$ with scale factor $\frac{20}{8} = 2.5$.', '$CA = 12 \cdot 2.5 = 30$, so $A''A = 30 - 12 = 18$.']
          work: 1.2
    - heading: SBA review
      cells:
        - n: 5
          prompt: 'Hassan has twice as many five-dollar bills as one-dollar bills in his wallet. He has 33 dollars in all. How many of each bill does he have?'
          answer: ['Let $x$ = number of one-dollar bills, so $2x$ = number of five-dollar bills.', '$1x + 5(2x) = 33$, $11x = 33$, $x = 3$.', '3 one-dollar bills and 6 five-dollar bills.']
          work: 2.0
        - n: 6
          prompt: ['Solve the system by graphing.', '$y = x - 2$', '$y = x^2 - x - 2$']
          figure: 3.13_p7
          fig_w: 2.4
          answer: ['$(0, -2)$ and $(2, 0)$', 'Check: $x - 2 = x^2 - x - 2$ gives $x^2 - 2x = 0$, so $x = 0$ or $x = 2$.']
          work: 0.1
  selected: [[1, 'A, E'], [2, D], [3, '6'], [4, '18'], [5, '3 ones, 6 fives'], [6, '(0, -2), (2, 0)']]

plan: |
  **Overview.** Last lesson of Unit 3. Students already know AA (3.9) and the Pythagorean theorem. Today they see that the altitude from the right angle splits a right triangle into two triangles similar to it and to each other, then find lengths two ways (Pythagorean theorem and proportions).

  **Objectives.** (1) Name the three similar triangles and write a correct similarity statement. (2) Find missing lengths with the Pythagorean theorem and with similarity, and check one with the other. **Standards.** G-SRT.B.4, G-SRT.B.5. SMP 3, 5 (patty paper), 7.

  **Quick look (30 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up (Pythagorean review) | Students, 1 min share |
  | 3-8 | Together: {ref:minimum}, then hand out patty paper | Teacher + class |
  | 8-18 | With a partner: Problems {num:untangle}-{num:lengths} | Students (pairs) |
  | 18-21 | QuickNotes | Teacher + class |
  | 21-27 | Exit ticket {num:exit} | Students (individual) |
  | 27-30 | Collect exit ticket, assign practice | Teacher |

  **Together (5 min, doc camera).** {ref:minimum} (from Math Medic 6.4): ask "what is the least we need to know?" Start from the $53^\circ$ in the figure: $m\angle ACD = 37^\circ$ and $m\angle DCB = 53^\circ$, so AA (write this on the board as the worked case). Students fill the two frame boxes, then write one sentence. Push to "any one acute angle," then "actually nothing: $x$ and $90^\circ - x$ always work."

  **Work time (10 min, pairs).**
  - {ref:untangle} is the core (7 min). Students trace each small triangle and turn or flip it until the right angle is at the bottom. Assessing: "Which angle in $\triangle HEG$ is $53^\circ$? How do you know?" Advancing: "Which side of $\triangle HEG$ matches $\overline{HF}$?" Before they move on, have each pair say the statement $\triangle HFE \sim \triangle HEG \sim \triangle EFG$ out loud. Common error: copying letters in figure order ($\triangle HGE$); send them back to the angles in their drawing.
  - {ref:lengths} (3 min): if a pair is stuck, point to the hypotenuse of each triangle: 20, 12, 16 gives scale factors 0.6 and 0.8.
  - Early finishers: start the practice problems.
  - MLL supports: labeled figures, frame boxes on {ref:minimum}, fill boxes on {ref:lengths}, any language in pair talk. Keep the words *altitude*, *hypotenuse*, *leg*.

  **QuickNotes (3 min).** Printed on page 2, right after {ref:lengths}. Connect the AA bullet to {ref:minimum}, the vertex-matching bullet to {ref:untangle}, and the proportion bullet to {ref:lengths}.

  **Exit ticket (6 min).** The exit ticket asks for two methods; full credit for either method plus a correct check. Vertex matching (LT 1) is checked in pairs on {ref:untangle} and on practice 1 tonight.

