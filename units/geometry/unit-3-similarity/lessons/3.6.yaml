id: 3.6
title: Similarity and transformations
notes_title: Similarity and transformations
framing: >-
  When are two figures similar, and how do we write it?

sections:
  - kind: warmup
    items:
      - minutes: 4
        prompt: 'Why is $GHFE$ not a dilation of $ADCB$ with center $P$?'
        figure: 3.6_warmup
        key_figure: 3.6_warmup_key
        fig_w: 2.6
        frame:
          - ['$GH = 2 \cdot AD$, and $GE =$', '$1 \cdot AB$', '']
          - ['Every length should be multiplied by the', 'same', '']
        answer: '$GH$ was doubled but $GE$ was not, so $GHFE$ is not a square. Red dashed: the real image.'
        work: 0.6
        after: 0.06

  - kind: together
    box: ['**Move bank**  translate  |  rotate around a point  |  reflect across a line  |  dilate (center, scale factor)']
    items:
      - n: 1
        minutes: 5
        prompt: 'Finish a sequence of transformations that takes $\triangle ABC$ onto $\triangle DEF$.'
        figure: 3.6_together
        fig_w: 2.5
        fill:
          - ['Step 1: Translate $A$ to point', '$D$']
          - ['Step 2: Rotate counterclockwise around $D$ by', '$90^\circ$']
          - ['Step 3: Dilate with center $D$ and scale factor', '$\frac{1}{2}$']
        box_w: 1.0
        answer: 'Halving every length lands $B$ on $E$ and $C$ on $F$.'
        work: 0
        after: 0.06

  - kind: partner
    items:
      - n: 2
        minutes: 9
        prompt: 'In the figure, $\overline{AB} \parallel \overline{QR}$ and $\overline{AE} \parallel \overline{QT}$.'
        figure: 3.6_soup
        fig_w: 2.0
        parts:
          - label: a.
            prompt: 'Finish a sequence that takes $\triangle EAB$ onto $\triangle TQR$.'
            fill:
              - ['Step 1: Dilate with center $A$ and scale factor', '$\frac{2}{5}$']
              - ['Step 2: Translate $A$ to point', '$Q$']
            box_w: 0.9
            answer: '$\frac{6}{15} = \frac{3.2}{8} = \frac{6.8}{17} = \frac{2}{5}$. Parallel sides: no rotation.'
            work: 0.8
          - label: b.
            prompt: 'Write a similarity statement.'
            frame:
              - ['$\triangle EAB \sim \triangle$', '$TQR$', '']
          - label: c.
            prompt: 'Is each statement right or wrong?'
            fill: [['$\triangle ABE \sim \triangle QRT$', 'right'], ['$\triangle EAB \sim \triangle RQT$', 'wrong']]
            fill_cols: 2
            box_w: 0.9
            answer: 'Order matters: $E \to T$, $A \to Q$, $B \to R$. The second one pairs $E$ with $R$.'
            work: 0

  - kind: notes
    new_page: false

  - kind: exit
    items:
      - n: 3
        minutes: 4
        prompt: '$\triangle JKL \sim \triangle XYZ$. $JK = 6$, $KL = 8$, $JL = 10$, and $YZ = 6$. Are the triangles congruent? Explain how you know.'
        fill: [['Scale factor from $\triangle JKL$ to $\triangle XYZ$:', '$\frac{3}{4}$'], ['Congruent (yes or no):', 'no']]
        box_w: 1.0
        answer: '$\overline{KL}$ matches $\overline{YZ}$, so $k = \frac{6}{8} = \frac{3}{4}$, not 1. Every side shrinks ($XY = 4.5$), so they are not congruent.'
        work: 0.8

quicknotes:
  - '**LT 1: I know the definition of similarity.**'
  - '- Two figures are **similar** if a sequence of rigid motions and/or dilations takes one figure onto the other.'
  - '- Rigid motions keep lengths and angles. A dilation keeps angles and multiplies every length by the scale factor $k$.'
  - '- Going back from the image to the original uses scale factor $\frac{1}{k}$.'
  - '- Congruent figures are always similar ($k = 1$). Similar figures are congruent only when $k = 1$.'
  - '**LT 2: I can write similarity statements.**'
  - '- The symbol $\sim$ means "is similar to."'
  - '- $\triangle ABC \sim \triangle DEF$ matches letters by position: $A \to D$, $B \to E$, $C \to F$. So $\angle A \cong \angle D$, and $\overline{AB}$ matches $\overline{DE}$.'
  - '- You can list the vertices in any order, as long as both names use the same matching: $\triangle BCA \sim \triangle EFD$ says the same thing.'

practice:
  title: 'Similarity and transformations: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'Write a sequence of transformations that takes square $ABCD$ onto square $EFGH$.'
          figure: 3.6_pr_squares
          fig_w: 2.2
          layout: stacked
          answer: 'Sample: Translate $A$ to $E$. Rotate around $E$ until $B$ is on ray $EF$. Dilate with center $E$ and scale factor $\frac{2}{5}$.'
          work: 1.0
        - n: 2
          prompt: 'Quadrilaterals $P$ and $Q$ are similar.'
          figure: assets/3.6/prac2_PQ.png
          fig_w: 1.6
          layout: stacked
          parts:
            - label: a.
              prompt: 'What is the scale factor of the dilation that takes $P$ onto $Q$?'
              fill: [['Scale factor:', '$\frac{5}{4}$']]
              box_w: 0.9
              answer: '$\frac{5}{4} = \frac{2.5}{2} = 1.25$'
              work: 0
            - label: b.
              prompt: 'What is the scale factor of the dilation that takes $Q$ onto $P$?'
              fill: [['Scale factor:', '$\frac{4}{5}$']]
              box_w: 0.9
              answer: 'Going back uses $\frac{1}{k} = \frac{4}{5}$.'
              work: 0
    - cells:
        - n: 3
          prompt: 'Which is our definition of similar?'
          choices:
            - 'Two figures with the same angles are similar.'
            - 'Two figures with proportional sides are similar.'
            - 'Two figures are similar if a sequence of rigid motions takes one onto the other.'
            - 'Two figures are similar if a sequence of rigid motions and dilations takes one onto the other.'
          answer: '[D] [A] and [B] are not our definition (and fail for some polygons). [C] describes congruent figures.'
          work: 0.1
        - n: 4
          prompt: '$\triangle DEF$ is made by connecting the midpoints of the sides of $\triangle ABC$. What is $BC$?'
          figure: assets/3.6/prac4_midsegment.png
          fig_w: 1.6
          choices: ['3 units', '4 units', '6 units', '8 units']
          choice_cols: 2
          answer: '[D] $\overline{DF}$ joins the midpoints of $\overline{AB}$ and $\overline{AC}$, so $BC = 2 \cdot DF = 2 \cdot 4 = 8$.'
          work: 0.1
    - heading: SBA review
      cells:
        - n: 5
          prompt: 'The point $(k, 8)$ is on the line $y = 3x + 5$. What is $k$?'
          answer: ['$8 = 3k + 5$', '$3 = 3k$', '$k = 1$']
          work: 0.8
        - n: 6
          prompt: 'A line passes through $(2, 8)$ and has a $y$-intercept of 4. What is its slope?'
          answer: ['The line passes through $(0, 4)$ and $(2, 8)$.', '$m = \frac{8 - 4}{2 - 0} = 2$']
          work: 0.8
  selected: [[1, 'translate, rotate, dilate by $\frac{2}{5}$'], [2, 'a. $\frac{5}{4}$  b. $\frac{4}{5}$'], [3, D], [5, '$k = 1$'], [6, '$m = 2$']]

plan: |
  **Overview.** 3.1-3.5: dilations scale lengths and keep angles. Today: define similar with transformations (rigid motions and/or dilations) and write similarity statements. Lesson 3.7 uses this definition to reason about angles and sides; 3.9 shortens it to AA.

  **Objectives.** (1) Write a sequence of rigid motions and dilations that takes one figure onto another. (2) Write a similarity statement with the vertices in matching order. **Standards.** G-SRT.A.2, G-SRT.A.1b. SMP 3, 6.

  **Quick look (30 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-4 | Warm-up | Students, 1 min share |
  | 4-9 | Together: Problem 1 | Teacher + class |
  | 9-19 | With a partner: Problem 2 | Students (pairs) |
  | 19-22 | QuickNotes | Teacher + class |
  | 22-26 | Exit ticket 3 | Students |
  | 26-29 | Collect exit ticket, assign practice | Teacher |
  | 29-30 | Buffer | |

  **Warm-up (4 min).** 3 min to fill the two boxes, 1 min share. Ask "which length broke the rule?"

  **Together (5 min).** Read the framing box, then ask out loud (1 min, quick vote): "Can rigid motions alone move $\triangle ABC$ onto $\triangle DEF$?" (No: every side of $\triangle DEF$ is half as long, and rigid motions keep lengths.) Ask "what would we need to add to the move bank?" Problem 1 (4 min): do it on patty paper under the doc camera; trace, translate, rotate, then show that halving lands $B$ on $E$.

  **Partner work (10 min).** 1 min to get into pairs, then Problem 2 (about 9 min, including a 2 min share of 2c). 2a: pairs check all three ratios before writing $\frac{2}{5}$. 2c is the key talk: ask "which vertex does $E$ match? How do you know?"
  - MLL supports: move bank with the four transformation words, fill-in boxes for every step, Problem 2b uses a sentence frame. Any language is fine for partner talk.
  - Watch for: students who write the statement in alphabetical order, or who name the scale factor upside down ($\frac{5}{2}$ instead of $\frac{2}{5}$).

  **QuickNotes (3 min).** Read the definition together. For the $\frac{1}{k}$ bullet, point back to Problem 1: $\triangle ABC$ to $\triangle DEF$ uses $\frac{1}{2}$, so going back uses 2. Connect the last LT 2 bullet to Problem 2c.

  **Exit ticket (4 min).** Problem 3 applies the QuickNotes fact (congruent only when $k = 1$) and letter order. Watch for students who see "6 and 6" and say congruent: $\overline{YZ}$ matches $\overline{KL}$, not $\overline{JK}$. Say out loud as you collect: "So are congruent figures similar?" (always, $k = 1$).

guide_notes: |
  **Nov 16: trimmed to 40 minutes.** Cut: the nested-triangles problem ($\triangle QOR$ and $\triangle PON$; same "find $k$, write the statement" as Alphabet Soup) and the squares problem (squares $F$ and $G$; same rotate-then-dilate as the Together sequence, and practice covers the squares sequence and $\frac{1}{k}$).

  **Nov 16 (round 2): cut to 30 minutes.** Cut: the "rigid motions alone?" question (now asked out loud before the Together sequence), the warm-up's third box (rays), CYU ($\triangle MNP \sim \triangle STU$ letter order; Problem 2c checks the same thing), and exit part a ("congruent figures are similar"; asked out loud at collect).

  **Nov 16 (round 2, follow-up).** QuickNotes print inline (2-page handout). The exit ticket was "Similar figures are congruent" (must/could/can't), which the QuickNotes answered word for word; it is now a given pair ($\triangle JKL \sim \triangle XYZ$, $YZ = 6$) where students find $k$ from matching sides and decide if the triangles are congruent.

  **Practice cut:** 11 to 6 problems. Cut the right-angle, perimeter, center-$C$ dilation, and draw-a-dilation items (repeat "find or use $k$" from earlier lessons and practice 2) and the parallelogram review. Kept the squares sequence, $P$ and $Q$ scale factors both ways, the definition MC, the midsegment review, and both SBA items.

  **Nov 16 (round 3):** cut extra instructions and flair.

  **Scoring notes (MLL).** Score the math, not grammar. Accept "same", "same size", or a home-language word for congruent. Accept answers that list the moves in a different valid order.
