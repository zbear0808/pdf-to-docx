id: 3.5
title: The midsegment of a triangle
notes_title: The midsegment of a triangle
framing: >-
  How is the segment joining the midpoints of two sides of a triangle related to the third side?
headings: warmup

sections:
  - kind: warmup
    items:
      - minutes: 3
        prompt: 'A dilation with center $O$ and scale factor 2 takes $P$ to $P''$ and $Q$ to $Q''$.'
        figure: 3.5_warmup
        fill: [['$P''Q'' =$', '3'], ['Is line $P''Q''$ parallel to line $PQ$? (yes or no)', 'yes']]
        fill_cols: 1
        box_w: 0.9
        answer: '$2 \cdot 1.5 = 3$. A dilation takes a line that does not pass through $O$ to a parallel line.'

  - kind: together
    items:
      - n: 1
        id: proof
        minutes: 4
        prompt:
          - '$M$ and $N$ are the midpoints of $\overline{AB}$ and $\overline{AC}$, so $AB = 2 \cdot AM$ and $AC = 2 \cdot AN$.'
          - 'One dilation with scale factor 2 takes $M$ to $B$ and $N$ to $C$, so it takes $\overline{MN}$ to $\overline{BC}$.'
          - 'As in the warm-up, the image is parallel and 2 times as long: $\overline{MN} \parallel \overline{BC}$ and $BC = 2MN$.'
        figure: 3.5_amn
        fig_w: 2.0
        frame:
          - ['The center of this dilation is', '$A$', '.']
        answer: '$A$ stays put while $M$ moves along ray $AB$ to $B$ and $N$ moves along ray $AC$ to $C$.'

  - kind: partner
    items:
      - n: 2
        id: two_thirds
        minutes: 5
        prompt:
          - '$M$ is $\frac{2}{3}$ of the way from $A$ to $B$. $N$ is $\frac{2}{3}$ of the way from $A$ to $C$. $BC = 9$.'
          - 'How does $\overline{MN}$ compare to $\overline{BC}$? Find $MN$, and explain using a dilation.'
          - '*Optional start:* $AM = \frac{2}{3} AB$ and $AN = \frac{2}{3} AC$, so ...'
        figure: 3.5_two_thirds
        fig_w: 1.7
        fill: [['$MN =$', '6']]
        box_w: 0.9
        box: 1.6
        answer: 'A dilation with center $A$ and scale factor $\frac{2}{3}$ takes $B$ to $M$ and $C$ to $N$, so it takes $\overline{BC}$ to $\overline{MN}$. So $\overline{MN} \parallel \overline{BC}$ and $MN = \frac{2}{3} \cdot 9 = 6$.'

  - kind: notes

quicknotes:
  - '**LT: I can explain why the segment joining the midpoints of two sides of a triangle is parallel to the third side and half as long.**'
  - '- A **midsegment** joins the midpoints of two sides of a triangle.'
  - '- If $M$ and $N$ are the midpoints of $\overline{AB}$ and $\overline{AC}$, a dilation with center $A$ and scale factor 2 takes $\triangle AMN$ onto $\triangle ABC$.'
  - '- A dilation takes a line that does not pass through the center to a parallel line, so $\overline{MN} \parallel \overline{BC}$.'
  - '- A dilation multiplies lengths by the scale factor, so $BC = 2MN$, or $MN = \frac{1}{2} BC$.'
  - '**Theorem.** $M$ is on $\overline{AB}$ and $N$ is on $\overline{AC}$. If $\frac{AM}{AB} = \frac{AN}{AC}$, then $\overline{MN} \parallel \overline{BC}$.'
  - '- Also, $MN = \frac{AM}{AB} \cdot BC$.'
  - '- {ref:two_thirds}: $\frac{2}{3}$ of the way along each side, so $MN = \frac{2}{3} BC$.'

practice:
  title: 'The midsegment of a triangle: practice'
  rows:
    - cells:
        - n: 1
          prompt:
            - 'What is the measure of $\angle A''B''C$?'
            - '$CB = 3 + 6 = 9$ and $CA = 4 + 2 = 6$.'
            - 'A dilation does not change angle measures.'
          figure: assets/3.5/prac1_angle.png
          fig_w: 2.4
          choices: ['$20^\circ$', '$40^\circ$', '$60^\circ$', '$80^\circ$']
          answer: ['[B] $\frac{CB''}{CB} = \frac{6}{9} = \frac{2}{3}$ and $\frac{CA''}{CA} = \frac{4}{6} = \frac{2}{3}$.', 'So one dilation with center $C$ takes $\angle ABC$ to $\angle A''B''C$.']
          work: 0.1
        - n: 2
          prompt: '$\triangle DEF$ is made by connecting the midpoints of the sides of $\triangle ABC$. What is the length of $AB$?'
          figure: assets/3.5/prac2_midpoints.png
          fig_w: 2.4
          fill: [['$AB =$', '6']]
          answer: '$E$ and $F$ are the midpoints of $\overline{BC}$ and $\overline{AC}$, so $\overline{EF}$ is the midsegment parallel to $\overline{AB}$ and $AB = 2 \cdot EF = 2 \cdot 3 = 6$.'
          work: 0.3
    - cells:
        - n: 3
          prompt: '$\triangle XYZ$ is dilated and the image is $\triangle X''Y''Z''$. Write 2 equations that could be used to find $a$. Then solve for $a$.'
          figure: assets/3.5/prac6_xyz.png
          fig_w: 2.2
          fill: [['$a =$', '$\frac{15}{8}$']]
          answer: ['Scale factor $k = \frac{3}{8}$.', 'Equations: $\frac{a}{5} = \frac{3}{8}$ and $\frac{a}{3} = \frac{5}{8}$ (or $8k = 3$ and $5k = a$).', '$a = \frac{15}{8} = 1.875$']
          work: 1.0
    - page_break_before: true
      cells:
        - n: 4
          prompt:
            - 'Is polygon $ABCDE$ a dilation of polygon $VWXYZ$? Explain how you know.'
            - 'The vertices match in order ($A$ with $V$, $B$ with $W$, and so on).'
          figure: assets/3.5/prac5_polygons.png
          fig_w: 3.2
          answer: ['No. A dilation multiplies every side by the same scale factor.', '$AB = \frac{1}{2} VW$, $BC = \frac{1}{2} WX$, $CD = \frac{1}{2} XY$, and $DE = \frac{1}{2} YZ$,', 'but $AE = 10$ is not $\frac{1}{2} \cdot 12 = 6$.']
          work: 1.2
    - heading: SBA review
      cells:
        - n: 5
          prompt: 'It takes 1 can of red paint and 2 cans of white paint to make 1 can of pink paint. How many cans of white paint do you need to make 4 cans of pink paint?'
          fill: [['Cans of white paint:', '8']]
          answer: '2 cans of white per can of pink, so $4 \cdot 2 = 8$.'
          work: 1.0
  selected: [[1, B], [4, 'No: $VZ \neq 2AE$'], [5, '8 cans of white paint']]

plan: |
  **Overview.** 3.4: dilations of lines and angles. Today: one dilation (center $A$, scale factor 2) shows the midsegment is parallel to the third side and half as long. Then the same idea for any matching fraction ($\frac{2}{3}$). Lesson 3.6 moves to similarity. Lesson 3.11 picks up the side splitter with parallel lines (Math Medic 6.5 street map).

  **Core idea.** Students see that $M$ and $N$ are the same fraction of the way from $A$ on both sides, so one dilation with center $A$ takes $B$ to $M$ and $C$ to $N$ at the same time. That dilation takes $\overline{BC}$ onto $\overline{MN}$, so $\overline{MN} \parallel \overline{BC}$ and $MN$ is that fraction of $BC$. Spend whole-class time on the center box in {ref:proof} and on the explanations in {ref:two_thirds}. Known steps are printed: in {ref:proof}, everything but the center ($AB = 2 \cdot AM$ from the ticks, the image of $\overline{MN}$ from 3.1, and the warm-up's 3.3 and 3.4 facts); in {ref:two_thirds}, "$\frac{2}{3}$ of the way" as $AM = \frac{2}{3} AB$. Only the new steps are blank: the center in {ref:proof}, and $MN$ with the dilation that explains it in {ref:two_thirds}.

  **Objective.** Students will be able to explain why the segment joining the midpoints of two sides of a triangle is parallel to the third side and half as long. **Standards.** G-SRT.A.1, G-SRT.B.4 (midsegment case). SMP 3, 7.

  **Quick look (20 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up | Students, 1 min share |
  | 3-7 | Together: Problem 1 | Teacher + class |
  | 7-14 | With a partner: Problem 2 | Students (pairs) |
  | 14-17 | QuickNotes | Teacher + class |
  | 17-20 | Collect, assign practice | Teacher |

  **Warm-up (3 min).** 2 min to fill, 1 min share. Review only: the image is 2 times as long and parallel. Write "parallel, $k$ times as long" on the board; the last line of {ref:proof} uses it.

  **Together (4 min, doc camera).** {ref:proof}. Only the center is blank. Read the printed lines aloud: the midpoint ticks give $AB = 2 \cdot AM$ and $AC = 2 \cdot AN$, the dilation moves the whole segment $\overline{MN}$ onto $\overline{BC}$, and the last line is the warm-up again. Then ask "Is there one dilation that takes $M$ to $B$ and $N$ to $C$? Which point stays put?" Give wait time and take the center from a student.

  **Partner work (7 min).** 1 min to get into pairs, 5 min on {ref:two_thirds}, 1 min share.
  - Assessing: "Which point is the center? Does your dilation go from $\overline{BC}$ to $\overline{MN}$, or back?"
  - Advancing: "What if $M$ were halfway from $A$ to $B$ and $N$ were $\frac{2}{3}$ of the way to $C$?" (No single dilation from $A$ does both, so $\overline{MN}$ is not parallel to $\overline{BC}$.)
  - Common error: $MN = \frac{3}{2} \cdot 9$. Ask "Is $\overline{MN}$ longer or shorter than $\overline{BC}$?" Scale factor $\frac{3}{2}$ from $\overline{MN}$ to $\overline{BC}$ is also right if they solve $\frac{3}{2} MN = 9$.
  - Share one explanation that names the center and the scale factor. {ref:two_thirds} is the example for the QuickNotes theorem.
  - MLL supports: the warm-up facts are printed in {ref:proof}; the optional start turns "$\frac{2}{3}$ of the way from $A$ to $B$" into $AM = \frac{2}{3} AB$ (trace from $A$ along the side as you say it). Keep *midpoint*, *midsegment*, *scale factor*, *parallel*. Turn and Talk in any language before writing.

  **QuickNotes (3 min).** Read the bullets; point to {ref:proof} for "$BC = 2MN$" and {ref:two_thirds} for the theorem.

