  **Source.** 3.3 Student Notes (Activity 1 "All the Scale Factors", the side-length ratio table, the cool down) and 3.3 Practice Problems. The cool down was the exit ticket, cut Nov 19 (round 2). Cut Nov 16 for time: both source warm-ups (dilate $FGH$ with $k = 3$; find the wrong image point), the center-distance ratio table (the 3.1 definition, now a QuickNotes bullet), the tracing-paper comparison, a $k = \frac{1}{2}$ partner item, and a find-$k$ item (8 cm to 2 cm, now a spoken QuickNotes question). $\triangle EFG$ is a 3-4-5 triangle on a grid so the lengths are exact after printing.

  **Practice.** Source practice kept except the pentagon scale factor (practice 4a finds $k$ the same way), dilate $ABCD$ from $D$ (practice 3 is the harder drawing), and the roots of $3x^2 + 5x + 2 = 0$ (practice 5 also finds roots). Source key letters were shifted; fixed. Practice 4 (polygons $P$ and $Q$) used to repeat Lesson 3.1 practice 2; 3.1 cut its copy on Nov 19.

  **Scoring notes (MLL).** Score the math, not grammar. On {ref:rule}, accept "times 2", "double", "$k$ times as long", or a home-language word, as long as every side is multiplied, not added to.
