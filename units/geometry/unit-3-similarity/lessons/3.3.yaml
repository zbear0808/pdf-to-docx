id: 3.3
title: Measuring dilations
notes_title: Measuring dilations
framing: >-
  What happens to the side lengths when a figure is dilated?
materials: ruler or a strip of paper
headings: warmup

sections:
  - kind: warmup
    items:
      - minutes: 2
        prompt: 'Count grid units to find $EF$ and $EG$. $FG = 5$.'
        figure: 3.3_efg
        fig_w: 3.0
        fill: [['$EF =$', '3'], ['$EG =$', '4']]
        box_w: 0.9
        answer: 'The key grid also shows $\triangle E''F''G''$ from {ref:dilate}.'

  - kind: together
    items:
      - n: 1
        id: predict
        minutes: 3
        prompt: 'Predict the side lengths of the image when $\triangle EFG$ is dilated using center $C$ and scale factor 2.'
        fill: [['$E''F'' =$', '6'], ['$E''G'' =$', '8'], ['$F''G'' =$', '10']]
        fill_cols: 3
        box_w: 0.9

  - kind: partner
    items:
      - n: 2
        id: dilate
        minutes: 2
        prompt:
          - 'Dilate $\triangle EFG$ on the warm-up grid using center $C$ and scale factor 2. Label the image $\triangle E''F''G''$.'
          - 'From $C$: $E''$ is 2 right and 2 up, $F''$ is 2 right and 8 up, and $G''$ is 10 right and 2 up.'
        answer: 'Red triangle on the warm-up grid. Each image vertex is on the dashed ray from $C$.'
        work: 0.3
      - n: 3
        id: ratios
        minutes: 3
        prompt: 'Measure $\triangle E''F''G''$. Count grid units for $E''F''$ and $E''G''$. For $F''G''$, mark the length of $\overline{FG}$ (5 units) on a strip of paper and lay it along side $F''G''$.'
        table:
          header: ['Ratio', '$\frac{E''F''}{EF}$', '$\frac{E''G''}{EG}$', '$\frac{F''G''}{FG}$']
          row_label: 'Value'
          answers: ['$\frac{6}{3} = 2$', '$\frac{8}{4} = 2$', '$\frac{10}{5} = 2$']
          first_w: 1.0
          height: 0.5
      - n: 4
        id: rule
        minutes: 4
        prompt:
          - 'What does a dilation with scale factor $k$ do to the side lengths of a figure? Explain using your table in {ref:ratios}.'
          - '*Optional start:* Each side of $\triangle E''F''G''$ is ...'
        box: 1.2
        answer: 'Each side of $\triangle E''F''G''$ is 2 times the matching side of $\triangle EFG$, and 2 is the scale factor. This works for $\overline{FG}$ too, which does not touch $C$. So a dilation with scale factor $k$ multiplies every side length by $k$: image length $\div$ original length $= k$.'

  - kind: notes

quicknotes:
  - '**LT: I know that when a figure is dilated by scale factor $k$, all lengths in the figure are multiplied by $k$.**'
  - '- Distances from the center: $CA'' = k \cdot CA$ (Lesson 3.1).'
  - '- Side lengths: $A''B'' = k \cdot AB$ for every side. The perimeter is multiplied by $k$ too.'
  - '- To find $k$, divide: $k$ = image length $\div$ original length. For example, $k = A''B'' \div AB$.'
  - '- $k > 1$: the image is larger (enlargement). $0 < k < 1$: the image is smaller (reduction). $k = 1$: same size.'
  - '- Angles do not change in a dilation, so the image has the same shape (Lesson 3.4).'

practice:
  title: 'Measuring dilations: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'A polygon has perimeter 12 units (the sum of its side lengths). It is dilated with scale factor $\frac{3}{4}$. What is the perimeter of its image?'
          choices: ['9 units', '12 units', '16 units', 'It cannot be determined.']
          answer: '[A] Every side is multiplied by $\frac{3}{4}$, so the perimeter is $12 \cdot \frac{3}{4} = 9$.'
          work: 0.4
        - n: 2
          prompt: '$\triangle ABC$ is dilated to $\triangle A''B''C''$. Which scale factors give an image that is **larger** than $\triangle ABC$? Choose **all** that work.'
          choices: ['$\frac{3}{5}$', '$\frac{13}{17}$', '$1$', '$\frac{4}{3}$']
          choice_cols: 2
          answer: '[D] only. $\frac{4}{3}$ is the only scale factor greater than 1. A scale factor of 1 gives the same size.'
          work: 0.4
    - cells:
        - n: 3
          prompt:
            - 'Dilate Figure $G$ using center $B$ and scale factor 3. Label the image $G''$.'
            - 'From $B$, the three dots on Figure $G$ are 1 right and 1 up, 3 right and 1 up, and 2 right and 1 down.'
          figure: 3.3_prac_cone
          fig_w: 2.6
          layout: stacked
          answer: 'The dots move to 3 right and 3 up, 9 right and 3 up, and 6 right and 3 down from $B$ (3 times as far). The half circle becomes a half circle 3 times as wide.'
          work: 0
        - n: 4
          prompt: 'Polygon $Q$ is a dilation of polygon $P$. The side marked 4 matches the side marked 3, and $x$ matches $y$.'
          answer: 'Image side 3 matches original side 4.'
          figure: 3.3_prac_polygons
          fig_w: 2.4
          layout: stacked
          parts:
            - label: a.
              prompt: 'What is the scale factor?'
              fill: [['$k =$', '$\frac{3}{4}$']]
              box_w: 0.9
              answer: 'Image side $\div$ original side $= 3 \div 4$. You do not need $x$.'
              work: 0.3
            - label: b.
              prompt: 'If $x = 6$, find $y$.'
              fill: [['$y =$', '4.5']]
              box_w: 0.9
              answer: 'Multiply $x$ by the scale factor: $\frac{3}{4} \cdot 6 = 4.5$.'
              work: 0.5
    - heading: SBA review
      cells:
        - n: 5
          prompt: 'Find the roots and the vertex of $y = x^2 + 6x + 5$. Then sketch the graph.'
          figure: 3.3_prac_parabola
          fig_w: 1.9
          fill: [['Roots:', '$-1$ and $-5$'], ['Vertex:', '$(-3, -4)$']]
          box_w: 1.2
          answer: '$(x + 1)(x + 5) = 0$. The vertex is halfway between the roots: $x = -3$, $y = 9 - 18 + 5 = -4$.'
          work: 0.3
  selected: [[1, 'A'], [2, 'D'], ['4a', '$\frac{3}{4}$'], ['4b', '4.5'], [5, 'roots $-1$, $-5$; vertex $(-3, -4)$']]

plan: |
  **Overview.** Second lesson of Unit 3. In 3.1, students dilated points: the distance from the center is multiplied by $k$. Today they measure an image and find that every side length is multiplied by $k$ too. Lesson 3.4 does lines and angles.

  **Core idea.** Students see that a dilation multiplies every side length by $k$, not just the distances from the center: all three ratios in {ref:ratios} are 2, even for $\overline{FG}$, which does not touch $C$. Spend whole-class time on the {ref:predict} predictions and on the rules pairs write in {ref:rule}. Known steps are printed; only the new steps are blank: the predictions ({ref:predict}), the ratio values ({ref:ratios}), and the rule ({ref:rule}). Printed so you can move past them: $FG = 5$ (off the grid lines), the 3.1 move as image counts from $C$ in {ref:dilate} (students only plot), and the way to measure $F'G'$ with a paper strip. Three known steps stay blank on purpose: the warm-up's counts (the one skill it reviews), the measured lengths in {ref:ratios} (6, 8, and 10 are the {ref:predict} answers and the warm-up's 3 and 4 sit on the same page), and the plot in {ref:dilate} (its only blank, and it makes the image students measure).

  **Objectives.** (1) Explain, from measurements, that a dilation multiplies every side length by $k$. (2) Find an image length from $k$, and $k$ from a side and its image. **Standards.** G-SRT.A.1b, G-SRT.A.2. SMP 5, 6, 8.

  **Quick look (22 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-3 | Warm-up | Students, 1 min check |
  | 3-6 | Together: Problem 1 | Teacher + class |
  | 6-16 | With a partner: Problems 2-4 | Students (pairs) |
  | 16-19 | QuickNotes | Teacher + class |
  | 19-22 | Collect, assign practice | Teacher |

  **Warm-up (3 min).** Students count $EF$ and $EG$ as they sit down. $FG = 5$ is printed because it is not on grid lines. Check 3 and 4 out loud.

  **Together (3 min, doc camera).** {ref:predict}: write a few predictions for each length on the board. Expect 6, 8, 10, and also "add 2" (5, 6, 7). Don't confirm; partners check them in {ref:ratios}.

  **With a partner (10 min).**
  - {ref:dilate} (2 min): the counts from $C$ are printed, so pairs only plot and label. If an image looks off, ask "Where did you start counting?"
  - {ref:ratios} (3 min): show the paper strip once at the doc camera. Mark $FG$ on the strip and lay it along $F'G'$: it fits twice. Students write each length in its ratio.
  - {ref:rule} (4 min) is the core. Assessing: "Which sides did you check? Does $\overline{FG}$ go through $C$?" Advancing: "Would the ratios still match with scale factor 3? With $\frac{1}{2}$?" Watch for "each side gets longer by the same amount": the differences are 3, 4, and 5, but every ratio is 2.
  - Last minute: pairs read their rule to the next pair and compare it with the board predictions.
  - MLL supports: labeled grid, printed counts, short sentences, the optional start on {ref:rule}. Partner talk in any language before writing. Say "ratio" and "scale factor" while pointing to the table header.

  **QuickNotes (3 min).** Page 2 states the {ref:rule} rule, so students stay on page 1 until now. Read each bullet against {ref:ratios} (the perimeter goes from 12 to 24). For the $0 < k < 1$ bullet, ask: "If $\overline{AB}$ is 8 cm and its image is 2 cm, what is $k$?" ($\frac{1}{4}$; watch for 4 or 6.)

