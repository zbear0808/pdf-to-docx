id: 3.3
title: Measuring dilations
notes_title: Measuring dilations
framing: >-
  In Lesson 3.1 you dilated points: each image point is $k$ times as far from the center. Today's question:
  what happens to the lengths of the sides?
materials: ruler or a strip of paper

sections:
  - kind: warmup
    items:
      - minutes: 2
        prompt: 'Here is center $C$ and $\triangle EFG$. Count grid units to find the side lengths. $FG = 5$ is given.'
        figure: 3.3_efg
        fig_w: 3.0
        fill: [['$EF =$', '3'], ['$EG =$', '4']]
        box_w: 0.9
        answer: 'The key grid also shows $\triangle E''F''G''$ from Problem 2.'

  - kind: together
    items:
      - n: 1
        minutes: 3
        prompt: 'You will dilate $\triangle EFG$ using center $C$ and scale factor 2. Predict the side lengths of the image.'
        fill: [['$E''F'' =$', '6'], ['$E''G'' =$', '8'], ['$F''G'' =$', '10']]
        fill_cols: 3
        box_w: 0.9

  - kind: partner
    items:
      - n: 2
        minutes: 6
        prompt: 'Dilate $\triangle EFG$ on the warm-up grid. Use center $C$ and scale factor 2. Label the image $\triangle E''F''G''$.'
        answer: 'Red triangle on the warm-up grid. $E$ is over 1 and up 1 from $C$, so $E''$ is over 2 and up 2. In the same way, $F''$ is over 2 and up 8, and $G''$ is over 10 and up 2.'
        work: 0.5
      - n: 3
        minutes: 4
        prompt:
          - 'Measure $\triangle E''F''G''$. Count units for $E''F''$ and $E''G''$. For $F''G''$, mark the length of $\overline{FG}$ (5 units) on a strip of paper and lay it along $\overline{F''G''}$.'
          - 'Then fill in the table.'
        table:
          header: ['Ratio', '$\frac{E''F''}{EF}$', '$\frac{E''G''}{EG}$', '$\frac{F''G''}{FG}$']
          row_label: 'Value'
          answers: ['$\frac{6}{3} = 2$', '$\frac{8}{4} = 2$', '$\frac{10}{5} = 2$']
          first_w: 1.0
          height: 0.5
      - n: 4
        minutes: 3
        prompt: 'Sum it up. Use Problem 3. Fill in each box.'
        frame:
          - ['When a figure is dilated with scale factor $k$, every side length is multiplied by', '$k$', '.']
          - ['Image length divided by original length equals', '$k$', '.']
          - ['If $k > 1$, the image is', 'larger', '. If $0 < k < 1$, the image is smaller.']
          - ['The perimeter is also multiplied by', '$k$', '.']

  - kind: notes

  - kind: exit
    items:
      - n: 1
        minutes: 5
        prompt: '$\triangle P''Q''R''$ is a dilation of $\triangle PQR$ using center $C$ and scale factor 1.5.'
        figure: 3.3_exit
        fig_w: 1.8
        parts:
          - label: a.
            prompt: 'Is $\triangle P''Q''R''$ larger or smaller than $\triangle PQR$? Fill in each box.'
            frame:
              - ['$\triangle P''Q''R''$ is', 'larger', '.']
              - ['I know because the scale factor 1.5 is', 'greater', ' than 1.']
          - label: b.
            prompt: 'Find $P''Q''$. Explain how you know.'
            fill: [['$P''Q'' =$', '7.5']]
            box_w: 0.9
            answer: 'Multiply by the scale factor: $1.5 \cdot 5 = 7.5$. A dilation multiplies every length by the scale factor.'
            work: 0.7

quicknotes:
  - '**LT: I know that when a figure is dilated by scale factor $k$, all lengths in the figure are multiplied by $k$.**'
  - '- Distances from the center: $CA'' = k \cdot CA$ (Lesson 3.1).'
  - '- Side lengths: $A''B'' = k \cdot AB$ for every side. The perimeter is multiplied by $k$ too.'
  - '- To find $k$, divide: $k$ = image length $\div$ original length. For example, $k = A''B'' \div AB$.'
  - '- $k > 1$: the image is larger (enlargement). $0 < k < 1$: the image is smaller (reduction). $k = 1$: same size.'
  - '- Angles do not change in a dilation, so the image has the same shape (Lesson 3.4).'

practice:
  title: 'Measuring dilations: practice'
  rows:
    - cells:
        - n: 1
          prompt: 'A polygon has perimeter 12 units. It is dilated with scale factor $\frac{3}{4}$. What is the perimeter of its image?'
          choices: ['9 units', '12 units', '16 units', 'It cannot be determined.']
          answer: '[A] Every side is multiplied by $\frac{3}{4}$, so the perimeter is $12 \cdot \frac{3}{4} = 9$.'
          work: 0.4
        - n: 2
          prompt: '$\triangle ABC$ is dilated to $\triangle A''B''C''$. Which scale factors give an image that is **larger** than $\triangle ABC$? Choose **all** that work.'
          choices: ['$\frac{3}{5}$', '$\frac{13}{17}$', '$1$', '$\frac{4}{3}$']
          choice_cols: 2
          answer: '[D] only. $\frac{4}{3}$ is the only scale factor greater than 1. A scale factor of 1 gives the same size.'
          work: 0.4
    - cells:
        - n: 3
          prompt: 'Dilate Figure $G$ using center $B$ and scale factor 3. Label the image $G''$.'
          figure: 3.3_prac_cone
          fig_w: 2.6
          layout: stacked
          answer: 'Each marked point moves 3 times as far from $B$. The half circle becomes a half circle 3 times as wide.'
          work: 0
        - n: 4
          prompt: 'Polygon $Q$ is a dilation of polygon $P$. The side marked 4 matches the side marked 3, and $x$ matches $y$.'
          answer: 'Image side 3 matches original side 4.'
          figure: 3.3_prac_polygons
          fig_w: 2.4
          layout: stacked
          parts:
            - label: a.
              prompt: 'What is the scale factor?'
              fill: [['$k =$', '$\frac{3}{4}$']]
              box_w: 0.9
              answer: 'Image side $\div$ original side $= 3 \div 4$. You do not need $x$.'
              work: 0.3
            - label: b.
              prompt: 'If $x = 6$, find $y$.'
              fill: [['$y =$', '4.5']]
              box_w: 0.9
              answer: 'Multiply $x$ by the scale factor: $\frac{3}{4} \cdot 6 = 4.5$.'
              work: 0.5
    - heading: SBA review
      cells:
        - n: 5
          prompt: 'Find the roots and the vertex of $y = x^2 + 6x + 5$. Then sketch the graph.'
          figure: 3.3_prac_parabola
          fig_w: 1.9
          fill: [['Roots:', '$-1$ and $-5$'], ['Vertex:', '$(-3, -4)$']]
          box_w: 1.2
          answer: '$(x + 1)(x + 5) = 0$. The vertex is halfway between the roots: $x = -3$, $y = 9 - 18 + 5 = -4$.'
          work: 0.3
  selected: [[1, 'A'], [2, 'D'], ['4a', '$\frac{3}{4}$'], ['4b', '4.5'], [5, 'roots $-1$, $-5$; vertex $(-3, -4)$']]

plan: |
  **Overview.** Second lesson of Unit 3. In 3.1 students dilated points (distance from the center times $k$). Today they measure an image and find that every side length, and the perimeter, is multiplied by $k$. Lesson 3.4 adds lines and angles.

  **Objectives.** Students will be able to: (1) find image lengths from a scale factor; (2) find a scale factor from an image length and an original length; (3) tell from $k$ whether the image is larger or smaller. **Standards.** G-SRT.A.1b, G-SRT.A.2. SMP 5, 6, 8.

  **Quick look (30 min).**
  | Time | Part | Who talks |
  |---|---|---|
  | 0-2 | Warm-up | Students (individual) |
  | 2-6 | Together: Problem 1 | Teacher + class |
  | 6-19 | With a partner: Problems 2-4 | Students (pairs) |
  | 19-22 | QuickNotes | Teacher + class |
  | 22-27 | Exit ticket | Students (individual) |
  | 27-30 | Collect, assign practice | Teacher |

  **Warm-up (2 min).** Students count $EF$ and $EG$ on their own as they sit down. $FG = 5$ is printed because it is not on grid lines.

  **Together (4 min, doc camera).** Check $EF = 3$ and $EG = 4$ (30 seconds). Problem 1 (3 min): take three predictions and write them on the board. Don't confirm; Problem 3 checks them. About 30 seconds to start pairs.

  **With a partner (13 min).**
  - Problem 2 (6 min): count from $C$ to each vertex ("over, up"), then double. This is the 3.1 move. Watch for students who double the side lengths from $E$ instead of from $C$; ask where $E'$ is.
  - Problem 3 (4 min): show the paper-strip move once. Students write the measured length on top of each ratio. Compare with the predictions from Problem 1.
  - Problem 4 (3 min) is the summary that leads into QuickNotes. For the perimeter box, students add the sides: 12 and 24.
  - MLL supports: labeled grid, short sentences, fill-in boxes on the warm-up, Problem 1, and Problem 4. Any language is fine for partner talk.
  - Early finishers (say it, don't print it): "Another pair used $k = \frac{1}{2}$. Without drawing, find their side lengths and perimeter. Is their image larger or smaller?" (1.5, 2, 2.5; perimeter 6; smaller because $\frac{1}{2} < 1$.)

  **QuickNotes (3 min).** Read each bullet against Problem 3. For the $0 < k < 1$ bullet, ask: "If $\overline{AB}$ is 8 cm and its image is 2 cm, what is $k$?" ($\frac{1}{4}$; watch for 4 or 6.)

  **Exit ticket (5 min).** Checks "larger or smaller" and one image length.

