id: 3.1-3.5 Progress Check Retake A
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: Retake A
title: 'Progress check retake: lessons 3.1-3.5'
directions: 'Show your work.'
total_points: 9
max_pages: 2
targets:
  - id: LT1
    understand: 'a dilation moves each point along the ray from the center to $k$ times as far, so $k > 1$ enlarges and $0 < k < 1$ shrinks'
    able_to: 'dilate a figure given a center and a scale factor'
    standard: G-SRT.A.1
  - id: LT2
    understand: 'a dilation multiplies every length by the scale factor $k$'
    able_to: 'find $k$ from a side and its image, and use $k$ to find a missing length'
    standard: G-SRT.A.1b
  - id: LT3
    understand: 'a dilation keeps angle measures and takes a line that misses the center to a parallel line (a line through the center to itself)'
    able_to: 'tell what a dilation does to angles, lines, and segments'
    standard: G-SRT.A.1a

sections:
  - kind: plain
    target: LT1
    items:
      - id: q1
        target: LT1
        type: cr
        demand: pwoc
        points: 2
        prompt: 'Dilate $\triangle GHK$ using center $C$ and scale factor $\frac{1}{2}$. Label the image $\triangle G''H''K''$.'
        figure: 3.1-3.5 Progress Check Retake A_q1
        fig_w: 2.7
        work: 0
        answer: '$G$ is 10 left, 6 up from $C$, so $G''$ is 5 left, 3 up. $H$: 4 left, 6 up, so $H''$ is 2 left, 3 up. $K$: 8 left, so $K''$ is 4 left.'
      - id: q2
        target: LT1
        type: sr
        demand: mem
        key: C
        points: 1
        prompt: 'Parallelogram $PQRS$ is dilated to make parallelogram $P''Q''R''S''$. Which scale factor makes the image **larger** than $PQRS$?'
        choices: ['$\frac{8}{9}$', '1', '$\frac{6}{5}$', '$\frac{1}{2}$']
        choice_cols: 4
        answer: '[C] $\frac{6}{5}$ is greater than 1, so every length grows. (1 keeps the same size. $\frac{8}{9}$ and $\frac{1}{2}$ make it smaller.)'
        distractors:
          A: 'reads $\frac{8}{9}$ as large'
          B: 'thinks $k = 1$ enlarges it'
          D: 'thinks $0 < k < 1$ enlarges'

  - kind: plain
    target: LT2
    items:
      - id: q3
        target: LT2
        type: cr
        model:
          kind: scaled_rectangles
          source_name: S
          image_name: T
          known_axis: height
          source_known: 9
          image_known: 12
          given_other: 24
          given_on: image
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check Retake A_q3
        fig_w: 3.0
        parts:
          - label: a.
            demand: pwoc
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            demand: pwoc
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol}$ is on ${value:q3.source_name}$, so divide: ${value:q3.given_other} \div {value:q3.scale} = {value:q3.answer}$. (Check: ${value:q3.scale} \cdot {value:q3.answer} = {value:q3.given_other}$.)'
            work: 0.5

  - kind: plain
    target: LT3
    page_break_before: true
    items:
      - id: q5
        target: LT3
        type: sr
        demand: pwc
        key: 'A, B, D'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $m$ after a dilation.'
          - 'Each wrong or missing choice loses 1 point.'
        figure: 3.1-3.5 Progress Check Retake A_q5
        fig_w: 2.6
        choices: ['$j$', '$k$', '$\ell$', '$m$', '$n$']
        choice_cols: 5
        answer: '[A], [B], [D]. A dilation takes $m$ to a parallel line ($j$ or $k$), or to $m$ itself when the center is on $m$. Lines $\ell$ and $n$ cross $m$. A blank or all five scores 0.'
      - id: q6
        target: LT3
        type: sr
        demand: mem
        key: 'B, D, F'
        select_all: true
        points: 2
        prompt:
          - '$\triangle ABC$ is dilated by scale factor 3 to make $\triangle DEF$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{2}{3}$ point.'
        figure: 3.1-3.5 Progress Check Retake A_q6
        fig_w: 2.2
        choices: ['$m\angle D = 3 \cdot m\angle A$', '$\angle D \cong \angle A$', '$\frac{AB}{DE} = 3$', '$\frac{DE}{AB} = 3$', '$\overline{AB} \cong \overline{DE}$', '$\overline{AB} \parallel \overline{DE}$']
        choice_cols: 3
        answer: '[B], [D], [F]. Angles do not change. Image lengths are 3 times the original, so $\frac{DE}{AB} = 3$. A dilation takes $\overline{AB}$ to a parallel segment. ([A] triples the angle. [C] is upside down. [E]: $DE = 3 \cdot AB$, not equal.) A blank or all six scores 0.'

guide_notes: |
  **Retake A** checks the same targets as Versions A and B, with no penalty for needing a second try. Item 1 uses a reduction ($k = \frac{1}{2}$), and item 2 asks for an enlargement.

  **Difficulty.** Item 3b is a step harder than on A and B, as in the source retake: ${value:q3.unknown_symbol}$ is on the smaller polygon, so students divide. Retake B matches Retake A.

  **Nov 19: less is more, no headings.** Cut old item 4 ($V'W'$, 1 pt): finding $k$ and then multiplying the third side is the same move at the same level as item 3 (every form cut it). Old items 5-6 are now {num:q5}-{num:q6}; 10 to 9 points. No section headings; the directions say only "Show your work." Nov 20: a blank or every choice now scores 0 on the select-all items; item 2 uses $\frac{6}{5}$ (was $\frac{5}{4}$, a Version A choice); item {num:q6}'s figure moves $E$ clear of $C$.

  **Targets.** LT1 (3.1): dilate a figure from a center by $k$; $k > 1$ enlarges, $0 < k < 1$ shrinks. LT2 (3.3): lengths multiply by $k$. LT3 (3.4): angles stay the same; a line goes to a parallel line, or to itself when the center is on it.

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $G'$, $H'$, $K'$ on segment $\overline{CG}$, $\overline{CH}$, $\overline{CK}$ at half the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle G'H'K'$.
  - 3a: credit $\frac{{value:q3.image_known}}{{value:q3.source_known}}$, ${value:q3.scale|decimal2}$, or ${value:q3.scale}$.
  - 3b: ${value:q3.unknown_symbol}$ is on the smaller polygon, so students divide; the common error is ${value:q3.scale} \cdot {value:q3.given_other} = {value:q3.multiply_given}$. Credit any valid method (${value:q3.unknown_symbol} = {value:q3.given_other} \div {value:q3.scale}$, ${value:q3.unknown_symbol} = {value:q3.given_other} \cdot {value:q3.inverse_scale}$, or $\frac{{value:q3.source_known}}{{value:q3.image_known}} = \frac{{value:q3.unknown_symbol}}{{value:q3.given_other}}$); carry through a wrong 3a; a correct setup with an arithmetic slip earns the point.
  - Items {num:q5}-{num:q6} (2 pts each): each wrong or missing choice takes off 1 on item {num:q5} and $\frac{2}{3}$ on item {num:q6} (2 divided by the number of wrong choices), lowest 0. Item {num:q6}'s angle pair ([A] triples the angle, [B] keeps it) is the LT3 angle evidence; reteach with the Lesson 3.4 warm-up and QuickNotes LT 1.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2} for ${value:q3.scale}$), home-language words or cognates, and labels such as G1 for $G'$.
