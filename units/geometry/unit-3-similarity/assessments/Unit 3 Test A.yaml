id: Unit 3 Test A
doc_type: assessment
title: 'Unit 3 Test: Version A'
directions: 'NO WORK = NO CREDIT!'
total_points: 20
max_pages: 2

sections:
  - kind: plain
    items:
      - n: 1
        points: 3
        prompt: '$\triangle ABC$ can be taken to $\triangle A''B''C''$ using rigid motions and a dilation. Select **all** the equations that are true. (1/2 point off for each wrong choice.)'
        figure: Unit 3 Test A_ratios
        fig_w: 1.45
        choices:
          - '$\dfrac{A''C''}{B''A''} = \dfrac{AC}{BA}$'
          - '$\dfrac{B''C''}{B''A''} = \dfrac{BA}{BC}$'
          - '$\dfrac{AC}{A''C''} = \dfrac{B''A''}{BA}$'
          - '$\dfrac{CA}{C''A''} = \dfrac{CB}{C''B''}$'
          - '$\dfrac{A''B''}{AB} = \dfrac{C''B''}{CB}$'
          - '$\dfrac{AB}{BC} = \dfrac{A''C''}{B''C''}$'
        choice_cols: 3
        answer: '[A], [D], [E]. Each one compares matching sides in the same order. [B] flips one side of the equation; [C] puts the original on top on the left and the image on top on the right; [F] matches $\overline{BC}$ with $\overline{B''C''}$ but $\overline{AB}$ with $\overline{A''C''}$.'
        work: 0.1
      - n: 2
        points: 3
        prompt: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$. Solve for $x$.'
        figure: Unit 3 Test A_splitter
        fig_w: 2.2
        fill: [['$x =$', '$\frac{40}{11} \approx 3.64$']]
        box_w: 1.3
        answer: ['$\triangle ADE \sim \triangle ABC$, so use the whole side: $AB = 5 + 6 = 11$.', '$\frac{x}{8} = \frac{5}{11}$, so $11x = 40$ and $x = \frac{40}{11} \approx 3.64$.']
        work: 1.0
      - n: 3
        prompt: 'The two triangles are similar. The figures are not drawn to scale. (1 pt for each box)'
        figure: Unit 3 Test A_similar
        fig_w: 2.7
        layout: stacked
        parts:
          - label: a.
            points: 1
            prompt: 'Complete the similarity statement.'
            frame: [['$\triangle CAB \sim \triangle$', '$EDF$', '']]
            answer: '$m\angle C = 180^\circ - 85^\circ - 56^\circ = 39^\circ = m\angle E$, so $C \to E$, $A \to D$, $B \to F$.'
            work: 0
          - label: b.
            points: 1
            prompt: 'What is the scale factor that moves $\triangle ABC$ onto $\triangle DFE$?'
            fill: [['Scale factor:', '$\frac{1}{4}$']]
            box_w: 1.0
            answer: '$\frac{FE}{BC} = \frac{6}{24} = \frac{1}{4}$'
            work: 0.4
          - label: c.
            points: 4
            prompt: 'Find each measure.'
            fill: [['$DF =$', '3.75'], ['$DE =$', '5'], ['$m\angle C =$', '$39^\circ$'], ['$m\angle D =$', '$85^\circ$']]
            fill_cols: 2
            box_w: 1.0
            answer: '$DF = \frac{1}{4} \cdot 15 = 3.75$, $DE = \frac{1}{4} \cdot 20 = 5$, $m\angle D = m\angle A = 85^\circ$'
            work: 0.5
        page_break_after: true
      - n: 4
        prompt: 'Use $\triangle ABC$ and point $P$. Use a ruler.'
        figure: Unit 3 Test A_dilate
        fig_w: 2.3
        parts:
          - label: a.
            points: 2
            prompt: 'Dilate $\triangle ABC$ using center $P$ and scale factor 3. Label the image $A''B''C''$.'
            answer: 'See the red image. $A''$ and $C''$ stay on line $AC$, with $PA'' = 3 \cdot PA$ and $PC'' = 3 \cdot PC$. $B''$ is on ray $PB$ with $PB'' = 3 \cdot PB$.'
            work: 0.2
          - label: b.
            points: 1
            prompt: 'How does $\angle B''$ compare to $\angle B$? Explain.'
            frame:
              - ['$\angle B''$ is', 'congruent to', '$\angle B$.']
              - ['Reason:', 'Dilations do not change angle measures.', '', 3.2]
            answer: 'So $m\angle B'' = m\angle B$.'
            work: 0.3
      - n: 5
        points: 2
        prompt: 'Rectangle $ABCD$ has some right triangles inside it. $EF = 8$ and $ED = 10$. Find $FD$.'
        figure: Unit 3 Test A_rect
        fig_w: 2.6
        fill: [['$FD =$', '6 units']]
        box_w: 1.1
        answer: ['$\triangle EFD$ has a right angle at $F$. Its hypotenuse is $\overline{ED}$.', '$8^2 + FD^2 = 10^2$, so $FD^2 = 36$ and $FD = 6$.']
        work: 1.7
      - n: 6
        points: 3
        prompt: '$\triangle ABC \sim \triangle DEF$. Write a sequence of transformations that moves $\triangle ABC$ onto $\triangle DEF$. Write one move in each box. For a dilation, name the center and the scale factor.'
        figure: Unit 3 Test A_seq
        fig_w: 2.0
        fill:
          - ['Step 1:', 'Dilate with center $B$ and scale factor $\frac{3}{7}$.']
          - ['Step 2:', 'Reflect across line $AB$.']
          - ['Step 3:', 'Translate $B$ to $E$.']
        box_w: 3.0
        answer: 'Scale factor $\frac{DF}{AC} = \frac{3}{7}$. $\triangle DEF$ faces the other way, so a reflection is needed. After Steps 1-2, $C$ is to the left of $B$; the translation lands $A$ on $D$, $B$ on $E$, and $C$ on $F$.'
        work: 0.6

guide_notes: |
  **Scoring (20 pts).**
  - Problem 1 (3 pts): 1 pt for each of [A], [D], [E]; 1/2 pt off for each wrong choice (lowest score 0).
  - Problem 2 (3 pts): 1 pt for a proportion that uses the whole side 11 (not 6), 1 pt for solving, 1 pt for $\frac{40}{11}$ or 3.64. The proportion $\frac{x}{8} = \frac{5}{6}$ (part over part) earns 1 pt for work at most.
  - Problem 3 (6 pts): 1 pt per box. Follow through on parts b and c from a wrong statement in part a. Accept $\frac{1}{4}$, 0.25, or "1 to 4". A scale factor of 4 goes the wrong way (0 pts for part b), but follow through on part c.
  - Problem 4 (3 pts): part a, 1 pt for each image point on the correct ray at about 3 times the distance (2 pts for all three); part b, 1 pt for "congruent" or "the same measure" with a reason (dilations keep angle measures).
  - Problem 5 (2 pts): 1 pt for the Pythagorean theorem (or a 6-8-10 triangle), 1 pt for 6. Also accept a similarity method that reaches 6.
  - Problem 6 (3 pts): 1 pt per move: a dilation by $\frac{3}{7}$ with a center, a reflection (any line that flips the triangle), and a translation that says where it goes. Accept any valid order. Take 1/2 pt off a dilation with no center or with scale factor $\frac{7}{3}$.

  **MLL notes.** Score the math, not grammar or spelling. Accept "same", "equal", or a home-language word for congruent, "flip", "slide", "shrink by 3/7" for the moves, and a decimal comma (3,64). Accept answers that end with the claim after the work.

  **Changes from the source.** Problem 1: "none of the above" replaced by a false equation. Problem 5: the source gave $FD = 10$ and asked for $FD$; the 10 is now $ED$ (it matches the source's $53^\circ$ angle), and the unused $53^\circ$ label is gone. Problem 6: added "$\triangle ABC \sim \triangle DEF$" and right-angle marks.
