id: 3.1-3.5 Progress Check A
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: A
title: 'Progress check: lessons 3.1-3.5'
directions: 'Show your work.'
total_points: 9
max_pages: 2
targets:
  - id: LT1
    understand: 'a dilation moves each point along the ray from the center to $k$ times as far, so $k > 1$ enlarges and $0 < k < 1$ shrinks'
    able_to: 'dilate a figure given a center and a scale factor'
    standard: G-SRT.A.1
  - id: LT2
    understand: 'a dilation multiplies every length by the scale factor $k$'
    able_to: 'find $k$ from a side and its image, and use $k$ to find a missing length'
    standard: G-SRT.A.1b
  - id: LT3
    understand: 'a dilation keeps angle measures and takes a line that misses the center to a parallel line (a line through the center to itself)'
    able_to: 'tell what a dilation does to angles, lines, and segments'
    standard: G-SRT.A.1a

sections:
  - kind: plain
    target: LT1
    items:
      - id: q1
        target: LT1
        type: cr
        demand: pwoc
        points: 2
        prompt: 'Dilate $\triangle ABC$ using center $P$ and scale factor 2. Label the image $\triangle A''B''C''$.'
        figure: 3.1-3.5 Progress Check A_q1
        fig_w: 2.7
        work: 0
        answer: '$A$ is 2 right, 3 up from $P$, so $A''$ is 4 right, 6 up. $B$: 4 right, 2 up, so $B''$ is 8 right, 4 up. $C$: 3 right, 1 down, so $C''$ is 6 right, 2 down.'
      - id: q2
        target: LT1
        type: sr
        demand: mem
        key: A
        points: 1
        prompt: 'Parallelogram $JKLM$ is dilated to make parallelogram $J''K''L''M''$. Which scale factor makes the image **smaller** than $JKLM$?'
        choices: ['$\frac{7}{10}$', '1', '$\frac{5}{4}$', '2']
        choice_cols: 4
        answer: '[A] $\frac{7}{10}$ is between 0 and 1, so every length shrinks. (1 keeps the same size. $\frac{5}{4}$ and 2 make it larger.)'
        distractors:
          B: 'thinks $k = 1$ shrinks it'
          C: 'reads any fraction as small'
          D: 'thinks a larger $k$ shrinks it'

  - kind: plain
    target: LT2
    items:
      - id: q3
        target: LT2
        type: cr
        model:
          kind: scaled_rectangles
          source_name: M
          image_name: N
          known_axis: height
          source_known: 8
          image_known: 12
          given_other: 10
          given_on: source
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check A_q3
        fig_w: 3.0
        parts:
          - label: a.
            demand: pwoc
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            demand: pwoc
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other} = {value:q3.answer}$'
            work: 0.5

  - kind: plain
    target: LT3
    page_break_before: true
    items:
      - id: q5
        target: LT3
        type: sr
        demand: pwc
        key: 'B, C, D'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $w$ after a dilation.'
          - 'Each wrong or missing choice loses 1 point.'
        figure: 3.1-3.5 Progress Check A_q5
        fig_w: 2.6
        choices: ['$f$', '$h$', '$v$', '$w$', '$z$']
        choice_cols: 5
        answer: '[B], [C], [D]. A dilation takes $w$ to a parallel line ($h$ or $v$), or to $w$ itself when the center is on $w$. Lines $f$ and $z$ cross $w$. A blank or all five scores 0.'
      - id: q6
        target: LT3
        type: sr
        demand: mem
        key: 'B, D, E'
        select_all: true
        points: 2
        prompt:
          - 'Quadrilateral $ABCD$ is dilated by scale factor 2 to make quadrilateral $A''B''C''D''$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{2}{3}$ point.'
        figure: 3.1-3.5 Progress Check A_q6
        fig_w: 2.3
        choices: ['$\frac{AD}{A^{\prime}D^{\prime}} = 2$', '$\frac{A^{\prime}D^{\prime}}{AD} = 2$', '$m\angle C'' = 2 \cdot m\angle C$', '$\angle C \cong \angle C''$', '$\overline{AD} \parallel \overline{A''D''}$', '$\overline{AD} \cong \overline{A''D''}$']
        choice_cols: 3
        answer: '[B], [D], [E]. Image lengths are 2 times the original, so $\frac{A^{\prime}D^{\prime}}{AD} = 2$. Angles do not change. A dilation takes $\overline{AD}$ to a parallel segment. ([A] is upside down. [C] doubles the angle. [F]: $A''D'' = 2 \cdot AD$, not equal.) A blank or all six scores 0.'

guide_notes: |
  **Nov 19: less is more, no headings.** Cut old item 4 ($m\angle A'B'C$, 1 pt): the same fact and level as old item 6's angle choices, and Lesson 3.5 practice 1 word for word. Old items 5-6 are now {num:q5}-{num:q6}; 10 to 9 points. No section headings; the directions say only "Show your work." Nov 20: item {num:q5} redrawn (it was Lesson 3.4 practice 2), and a blank or every choice now scores 0 on the select-all items.

  **Targets.** LT1 (3.1): dilate a figure from a center by $k$; $k > 1$ enlarges, $0 < k < 1$ shrinks. LT2 (3.3): lengths multiply by $k$. LT3 (3.4): angles stay the same; a line goes to a parallel line, or to itself when the center is on it.

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $A'$, $B'$, $C'$ on the ray from $P$ at twice the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle A'B'C'$. Rays are not required.
  - 3a: credit $\frac{{value:q3.image_known}}{{value:q3.source_known}}$, ${value:q3.scale|decimal2}$, or ${value:q3.scale}$. 3b: credit any valid method (${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other}$, $\frac{{value:q3.source_known}}{{value:q3.image_known}} = \frac{{value:q3.given_other}}{{value:q3.unknown_symbol}}$, or ${value:q3.unknown_symbol} = {value:q3.given_other} \cdot \frac{{value:q3.image_known}}{{value:q3.source_known}}$); carry through a wrong 3a; a correct setup with an arithmetic slip earns the point.
  - Items {num:q5}-{num:q6} (2 pts each): each wrong or missing choice takes off 1 on item {num:q5} and $\frac{2}{3}$ on item {num:q6} (2 divided by the number of wrong choices), lowest 0. Item {num:q6}'s angle pair ([C] doubles the angle, [D] keeps it) is the LT3 angle evidence; reteach with the Lesson 3.4 warm-up and QuickNotes LT 1.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2}), home-language words or cognates, and labels such as A1 for $A'$.
