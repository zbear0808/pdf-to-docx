id: 3.3-3.5 Progress Check B
doc_type: assessment
title: '3.3-3.5 Progress Check, Version B'
directions: Show your work.
total_points: 10
max_pages: 2

sections:
  - kind: plain
    title: 'Dilations and lengths (Lessons 3.1, 3.3)'
    items:
      - n: 1
        points: 2
        prompt: 'Dilate $\triangle DEF$ using center $Q$ and scale factor $\frac{1}{2}$. Label the image $\triangle D''E''F''$.'
        figure: 3.3-3.5 Progress Check B_dilate
        fig_w: 3.0
        work: 0
        answer: 'Red triangle. Each image point is halfway from $Q$ to its point. From $Q$: $D''$ is left 6, up 1; $E''$ is left 3, down 2; $F''$ is left 6, down 1.'
      - n: 2
        points: 2
        prompt:
          - 'Parallelogram $WXYZ$ is dilated to parallelogram $W''X''Y''Z''$. Which scale factors make the image **larger** than the original? Choose **all** that work.'
          - '(1 point for each correct choice. $\frac{1}{4}$ point off for each wrong choice.)'
        choices: ['$\frac{4}{3}$', '$\frac{9}{10}$', '$1$', '$\frac{5}{2}$']
        choice_cols: 4
        work: 0.1
        answer: '[A] and [D]. A scale factor greater than 1 makes the image larger. ([B] makes it smaller. [C] keeps the same size.)'
      - n: 3
        prompt: 'Polygon $S$ is a dilation of polygon $R$.'
        figure: 3.3-3.5 Progress Check B_rects
        fig_w: 2.6
        parts:
          - label: a.
            points: 1
            prompt: 'What is the scale factor?'
            fill: [['$k =$', '$\frac{3}{2}$']]
            box_w: 0.9
            answer: '$k = \frac{9}{6} = \frac{3}{2}$ (image length $\div$ original length).'
            work: 0.7
          - label: b.
            points: 2
            prompt: 'If $x = 10$, what is $y$?'
            fill: [['$y =$', '15']]
            box_w: 0.9
            answer: '$y = \frac{3}{2} \cdot 10 = 15$'
            work: 1.2

  - kind: plain
    title: 'Angles and lines (Lessons 3.4, 3.5)'
    page_break_before: true
    items:
      - n: 4
        points: 1
        prompt: 'Here are $\triangle DEF$ and $\triangle D''E''F$. What is the measure of $\angle D''E''F$? (How many degrees is it?)'
        figure: 3.3-3.5 Progress Check B_angle
        fig_w: 1.9
        fill: [['$m\angle D''E''F =$', '$50^\circ$']]
        box_w: 0.9
        work: 1.2
        answer: '$\frac{FE''}{FE} = \frac{8}{12} = \frac{2}{3}$ and $\frac{FD''}{FD} = \frac{8}{12} = \frac{2}{3}$. So a dilation with center $F$ takes $\triangle DEF$ to $\triangle D''E''F$. A dilation keeps angle measures, so $m\angle D''E''F = m\angle DEF = 50^\circ$.'
      - n: 5
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $n$ after a dilation.'
          - '(1 point for each correct choice. $\frac{1}{4}$ point off for each wrong choice.)'
        figure: 3.3-3.5 Progress Check B_lines
        fig_w: 2.1
        choices: ['$k$', '$j$', '$m$', '$\ell$']
        work: 0
        answer: '[B] and [C]. A dilation takes line $n$ to a parallel line (or to $n$ itself if the center is on $n$). Lines $j$ and $m$ are parallel to $n$. Lines $k$ and $\ell$ cross $n$.'

guide_notes: |
  **Scoring.**
  - 1 (2 pts): 1 point for image points halfway along each ray from $Q$ (all three), 1 point for a labeled triangle $D'E'F'$. Small drawing error (half a grid unit): full credit if the halfway idea is clear.
  - 2 and 5 (2 pts each): 1 point for each correct choice, minus $\frac{1}{4}$ for each wrong choice. Lowest score 0.
  - 3a (1 pt): $\frac{3}{2}$ or 1.5. 3b (2 pts): 1 point for a correct method ($y = 1.5x$ or a proportion), 1 point for 15.
  - 4 (1 pt): $50^\circ$. A student who scales the angle (for example $33^\circ$ or $75^\circ$) still thinks a dilation changes angles; reteach with Lesson 3.4 QuickNotes.

  **Scoring notes (MLLs).** Score the math, not grammar or spelling. Accept a decimal comma (1,5 = 1.5), home-language words, and answers written as a drawing or labeled figure.
