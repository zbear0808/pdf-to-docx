id: Unit 3 Test Retake
doc_type: assessment
title: 'Unit 3 Test: Retake'
directions: 'NO WORK = NO CREDIT!'
total_points: 20
max_pages: 4

sections:
  - kind: plain
    items:
      - n: 1
        points: 3
        prompt: '$\triangle XYZ$ can be taken to $\triangle X''Y''Z''$ using rigid motions and a dilation. Select **all** the equations that are true. (1/2 point off for each wrong choice.)'
        figure: Unit 3 Test Retake_ratios
        fig_w: 1.6
        choices:
          - '$\dfrac{XZ}{YX} = \dfrac{X''Z''}{Y''X''}$'
          - '$\dfrac{XY}{X''Y''} = \dfrac{Z''Y''}{ZY}$'
          - '$\dfrac{X''Y''}{Y''Z''} = \dfrac{XY}{YZ}$'
          - '$\dfrac{ZY}{Z''Y''} = \dfrac{ZX}{Z''X''}$'
          - '$\dfrac{Z''X''}{ZX} = \dfrac{XY}{X''Y''}$'
          - '$\dfrac{XY}{XZ} = \dfrac{X''Z''}{X''Y''}$'
        choice_cols: 3
        answer: '[A], [C], [D]. Each one compares matching sides in the same order. [B] and [E] put the original on top on one side and the image on top on the other; [F] flips one side of the equation.'
        work: 0.1
      - n: 2
        points: 1
        prompt: 'Is $\overleftrightarrow{AB} \parallel \overleftrightarrow{DE}$? Choose the best reason.'
        figure: Unit 3 Test Retake_parallel
        fig_w: 2.3
        choices:
          - 'Yes. $\triangle CAB$ is a dilation of $\triangle CDE$ with center $C$ and scale factor 4.'
          - 'Yes. $\triangle CAB$ is a dilation of $\triangle CDE$ with center $C$ and scale factor 3.'
          - 'Yes. $\triangle CAB$ is a dilation of $\triangle CDE$ with center $C$ and scale factor 1.5.'
          - 'No. No dilation takes $\triangle CDE$ onto $\triangle CAB$, so the lines are not parallel.'
        answer: '[A] $\frac{CA}{CD} = \frac{16}{4} = 4$ and $\frac{CB}{CE} = \frac{24}{6} = 4$. A dilation takes a line to a parallel line. [B] uses $\frac{DA}{CD} = \frac{12}{4}$ (part over part); [C] uses $\frac{CE}{CD} = \frac{6}{4}$; [D] misses that the ratios match.'
        work: 0.1
      - n: 3
        prompt: 'Is this statement true or false: $\triangle PQR \sim \triangle FHG$? The letter order shows which vertices match. Matching arcs show congruent angles.'
        figure: Unit 3 Test Retake_sas
        fig_w: 2.2
        parts:
          - label: a.
            points: 1
            prompt: 'Set up a proportion to test the statement.'
            answer: '$\frac{FH}{PQ} = \frac{FG}{PR}$? $\frac{22}{25} = 0.88$ and $\frac{10}{55} \approx 0.18$'
            work: 0.7
          - label: b.
            points: 0.5
            prompt: 'Is the statement true or false?'
            fill: [['TRUE or FALSE:', 'FALSE']]
            box_w: 1.1
            answer: 'The ratios are not equal.'
            work: 0
          - label: c.
            points: 0.5
            prompt: 'How do you know?'
            frame: [['The ratios', 'are not equal: $0.88 \neq 0.18$', '.', 2.6]]
            answer: 'The statement matches $Q \to H$ and $R \to G$, so $\frac{FH}{PQ}$ should equal $\frac{FG}{PR}$. But $\frac{22}{25} \neq \frac{10}{55}$. (The triangles are similar with a different matching: $\triangle PQR \sim \triangle FGH$, since $\frac{10}{25} = \frac{22}{55} = 0.4$ and $\angle P \cong \angle F$.)'
            work: 0.4
        page_break_after: true
      - n: 4
        points: 1
        prompt: 'Jian used $\frac{x}{15} = \frac{16}{10}$ to find the distance $x$ across Heritage Lake. That equation is wrong. What was Jian''s mistake?'
        figure: Unit 3 Test Retake_lake
        fig_w: 2.0
        choices:
          - 'The ratio $\frac{16}{10}$ should be $\frac{10}{16}$.'
          - 'Jian used part of the bottom side instead of the whole side.'
          - 'The 15 m side does not match side $x$.'
          - 'The two triangles are not similar.'
        answer: '[B] The big triangle''s bottom side is $16 + 10 = 26$ m. [A] keeps the part 16; [C] 15 m and $x$ are both vertical legs, so they match; [D] the triangles share an angle and both have a right angle (AA).'
        parts:
          - label: Correction.
            points: 1
            prompt: 'Write a correct equation and find $x$.'
            fill: [['$x =$', '39 m']]
            box_w: 1.1
            answer: '$\frac{x}{15} = \frac{26}{10}$, so $10x = 390$ and $x = 39$ m.'
            work: 0.8
      - n: 5
        prompt: '$\triangle ABC \sim \triangle EFD$.'
        figure: Unit 3 Test Retake_sf
        fig_w: 2.3
        parts:
          - label: a.
            points: 1
            prompt: 'What scale factor dilates $\triangle ABC$ so that its image $\triangle A''B''C''$ is congruent to $\triangle EFD$?'
            choices: ['$\frac{5}{12}$', '$\frac{1}{3}$', '$\frac{12}{5}$', '3']
            choice_cols: 4
            answer: '[A] $\frac{EF}{AB} = \frac{5}{12}$. [B] is $\frac{5}{15}$ (sides that don''t match); [C] goes from $\triangle EFD$ back to $\triangle ABC$; [D] is $\frac{15}{5}$.'
            work: 0.1
          - label: b.
            points: 1
            prompt: 'What is the length of $\overline{ED}$?'
            fill: [['$ED =$', '6.25']]
            box_w: 1.0
            answer: '$\overline{ED}$ matches $\overline{AC}$: $ED = \frac{5}{12} \cdot 15 = 6.25$'
            work: 0.7
        page_break_after: true
      - n: 6
        prompt: 'The two triangles are similar. (Part c: 1/2 pt for each box.)'
        figure: Unit 3 Test Retake_similar
        fig_w: 2.4
        parts:
          - label: a.
            points: 1
            prompt: 'Complete the similarity statement.'
            frame: [['$\triangle PNU \sim \triangle$', '$BDA$', '']]
            answer: '$m\angle P = 180^\circ - 88^\circ - 39^\circ = 53^\circ = m\angle B$, so $P \to B$, $N \to D$, $U \to A$.'
            work: 0
          - label: b.
            points: 1
            prompt: 'What is the scale factor that moves $\triangle DAB$ onto $\triangle NUP$?'
            fill: [['Scale factor:', '2']]
            box_w: 1.0
            answer: '$\frac{NU}{DA} = \frac{20}{10} = 2$'
            work: 0.4
          - label: c.
            points: 2
            prompt: 'Find each measure.'
            fill: [['$AB =$', '12.5'], ['$BD =$', '8'], ['$m\angle A =$', '$39^\circ$'], ['$m\angle P =$', '$53^\circ$']]
            fill_cols: 2
            box_w: 0.9
            answer: '$AB = 25 \div 2 = 12.5$, $BD = 16 \div 2 = 8$, $m\angle A = m\angle U = 39^\circ$'
            work: 0.5
      - n: 7
        prompt: 'Use $\triangle WIN$ and point $Z$. Use a ruler.'
        figure: Unit 3 Test Retake_dilate
        fig_w: 2.3
        parts:
          - label: a.
            points: 1.5
            prompt: 'Dilate $\triangle WIN$ using center $Z$ and scale factor 2. Label the image $W''I''N''$.'
            answer: 'See the red image. $W''$ and $I''$ stay on line $WI$, with $ZW'' = 2 \cdot ZW$ and $ZI'' = 2 \cdot ZI$. $N''$ is on ray $ZN$ with $ZN'' = 2 \cdot ZN$.'
            work: 0.2
          - label: b.
            points: 0.5
            prompt: 'What do the properties of dilations tell you about $\angle N''$?'
            answer: '$\angle N'' \cong \angle N$. Dilations do not change angle measures.'
            work: 0.8
      - n: 8
        points: 1
        prompt: 'Tyler wants to prove that all squares are similar. He thinks, "If I draw two squares, I can find a dilation that takes one square onto the other." Select **all** the statements that are true for ANY two squares. (1/4 point off for each wrong choice.)'
        choices:
          - 'Corresponding diagonals are congruent.'
          - 'Corresponding sides are proportional.'
          - 'The same value can be added to all sides of a square.'
          - 'Corresponding angles are congruent.'
          - 'Corresponding sides are congruent.'
          - 'Each angle is multiplied by the scale factor.'
        choice_cols: 2
        answer: '[B], [D]. All four sides of a square are equal, so every side ratio is the same; all angles are $90^\circ$. [A] and [E] are only true when the squares are the same size; [C] adding is not scaling; [F] dilations keep angles.'
        work: 0.1
        page_break_after: true
      - n: 9
        points: 1
        prompt: 'A ramp has a vertical brace. Find the length of the brace.'
        figure: Unit 3 Test Retake_brace
        fig_w: 2.8
        layout: stacked
        fill: [['Brace:', '1.6 ft']]
        box_w: 1.1
        answer: ['The small triangle and the whole ramp share the left angle, and both have a right angle (AA).', 'The brace is $10 - 6 = 4$ ft from the left end. $\frac{b}{4} = \frac{4}{10}$, so $b = 1.6$ ft.']
        work: 0.8
      - n: 10
        prompt: 'Rectangle $ABDE$ has some right triangles inside it.'
        figure: Unit 3 Test Retake_rect
        fig_w: 2.6
        layout: stacked
        parts:
          - label: a.
            points: 1
            prompt: 'Which similarity statements are true? Select **all**. (1/4 point off for each wrong choice.)'
            choices:
              - '$\triangle AEC \sim \triangle FEC$'
              - '$\triangle AEC \sim \triangle DEC$'
              - '$\triangle AEC \sim \triangle CEF$'
              - '$\triangle AEC \sim \triangle ECD$'
              - '$\triangle AEC \sim \triangle ACF$'
              - '$\triangle AEC \sim \triangle CAB$'
              - '$\triangle AEC \sim \triangle FCA$'
              - '$\triangle AEC \sim \triangle CBA$'
            choice_cols: 4
            answer: '[C], [D], [E], [F]. In $\triangle AEC$: $A = 30^\circ$, $E = 60^\circ$, $C = 90^\circ$. Each correct triangle lists its $30^\circ$, $60^\circ$, and $90^\circ$ angles in that order. [A], [B], [G], [H] are similar triangles with the letters in the wrong order.'
            work: 0.1
          - label: b.
            points: 1
            prompt: 'Use $CE = 10$ and $FE = 5$. What is $BC$? Explain with math or words.'
            fill: [['$BC =$', '15 units']]
            box_w: 1.1
            answer: '$\triangle CEF \sim \triangle AEC$, so $\frac{FE}{CE} = \frac{CE}{AE}$: $\frac{5}{10} = \frac{10}{AE}$ and $AE = 20$. $AF = 20 - 5 = 15$. $ABCF$ is a rectangle, so $BC = AF = 15$.'
            work: 1.2
      - prompt: ['**Confidence level.** Circle the score you think you earned.', 'Below 60%      60      65      70      75      80      85      90      95      100      100+']
        no_answer: true
        work: 0

guide_notes: |
  **Scoring (20 pts).** The source had no total; its point values (27) were scaled to 20.
  - Problem 1 (3 pts): 1 pt for each of [A], [C], [D]; 1/2 pt off for each wrong choice (lowest score 0).
  - Problem 2 (1 pt): [A].
  - Problem 3 (2 pts): 1 pt for a proportion with matching sides (follow the statement's order), 1/2 pt for FALSE, 1/2 pt for the reason (the ratios are not equal). A student who tests $\triangle FGH$, finds $0.4 = 0.4$, and writes TRUE earns 1 pt for the proportion.
  - Problem 4 (2 pts): 1 pt for [B], 1 pt for a whole-side equation and 39 m.
  - Problem 5 (2 pts): 1 pt for [A], 1 pt for 6.25 (follow through on a wrong scale factor).
  - Problem 6 (4 pts): 1 pt each for parts a and b; part c, 1/2 pt per box. Follow through on parts b and c from a wrong statement in part a.
  - Problem 7 (2 pts): part a, 1/2 pt per image point on the correct ray at about 2 times the distance; part b, 1/2 pt for "congruent" or "same measure".
  - Problem 8 (1 pt): 1/2 pt each for [B] and [D]; 1/4 pt off for each wrong choice.
  - Problem 9 (1 pt): 1.6 ft with a proportion.
  - Problem 10 (2 pts): part a, 1/4 pt each for [C], [D], [E], [F], 1/4 pt off for each wrong choice; part b, 1 pt for 15 with a reason (similar triangles, or the Pythagorean theorem plus similarity).

  **MLL notes.** Score the math, not grammar or spelling. Accept "same", "equal", or a home-language word for congruent, ratios written as decimals, a decimal comma (6,25), and reasons written as a list of steps.

  **Changes from the source.** Letters in Problem 1 are new ($XYZ$), so the retake does not repeat Version A. "None of the above" choices are gone. Problem 4 now lists Jian's possible mistakes (the source said "circle one" with no choices). Problem 6 uses $PN = 16$ and $PU = 25$ (the source's 14 and 26 don't fit the angles). Problem 8 replaces two statements that were true but not part of the proof. Problem 10 uses $FE = 5$ (the source's 6 doesn't fit the $60^\circ$ angle).
