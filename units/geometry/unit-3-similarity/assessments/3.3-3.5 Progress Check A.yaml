id: 3.3-3.5 Progress Check A
doc_type: assessment
title: '3.3-3.5 Progress Check, Version A'
directions: Show your work.
total_points: 10
max_pages: 2

sections:
  - kind: plain
    title: 'Dilations and lengths (Lessons 3.1, 3.3)'
    items:
      - n: 1
        points: 2
        prompt: 'Dilate $\triangle ABC$ using center $P$ and scale factor $\frac{1}{2}$. Label the image $\triangle A''B''C''$.'
        figure: 3.3-3.5 Progress Check A_dilate
        fig_w: 3.0
        work: 0
        answer: 'Red triangle. Each image point is halfway from $P$ to its point. From $P$: $A''$ is right 3, up 2; $B''$ is right 5, up 1; $C''$ is right 4, down 1.'
      - n: 2
        points: 2
        prompt:
          - 'Parallelogram $JKLM$ is dilated to parallelogram $J''K''L''M''$. Which scale factors make the image **larger** than the original? Choose **all** that work.'
          - '(1 point for each correct choice. $\frac{1}{4}$ point off for each wrong choice.)'
        choices: ['$\frac{7}{10}$', '$1$', '$\frac{5}{4}$', '$2$']
        choice_cols: 4
        work: 0.1
        answer: '[C] and [D]. A scale factor greater than 1 makes the image larger. ([A] makes it smaller. [B] keeps the same size.)'
      - n: 3
        prompt: 'Polygon $N$ is a dilation of polygon $M$.'
        figure: 3.3-3.5 Progress Check A_rects
        fig_w: 2.6
        parts:
          - label: a.
            points: 1
            prompt: 'What is the scale factor?'
            fill: [['$k =$', '$\frac{3}{2}$']]
            box_w: 0.9
            answer: '$k = \frac{12}{8} = \frac{3}{2}$ (image length $\div$ original length).'
            work: 0.7
          - label: b.
            points: 2
            prompt: 'If $x = 12$, what is $y$?'
            fill: [['$y =$', '18']]
            box_w: 0.9
            answer: '$y = \frac{3}{2} \cdot 12 = 18$'
            work: 1.2

  - kind: plain
    title: 'Angles and lines (Lessons 3.4, 3.5)'
    page_break_before: true
    items:
      - n: 4
        points: 1
        prompt: 'Here are $\triangle ABC$ and $\triangle A''B''C$. What is the measure of $\angle A''B''C$? (How many degrees is it?)'
        figure: 3.3-3.5 Progress Check A_angle
        fig_w: 2.0
        fill: [['$m\angle A''B''C =$', '$45^\circ$']]
        box_w: 0.9
        work: 1.2
        answer: '$\frac{CB''}{CB} = \frac{8}{12} = \frac{2}{3}$ and $\frac{CA''}{CA} = \frac{6}{9} = \frac{2}{3}$. So a dilation with center $C$ takes $\triangle ABC$ to $\triangle A''B''C$. A dilation keeps angle measures, so $m\angle A''B''C = m\angle ABC = 45^\circ$.'
      - n: 5
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $p$ after a dilation.'
          - '(1 point for each correct choice. $\frac{1}{4}$ point off for each wrong choice.)'
        figure: 3.3-3.5 Progress Check A_lines
        fig_w: 2.1
        choices: ['$\ell$', '$m$', '$n$', '$o$']
        work: 0
        answer: '[A] and [C]. A dilation takes line $p$ to a parallel line (or to $p$ itself if the center is on $p$). Lines $\ell$ and $n$ are parallel to $p$. Lines $m$ and $o$ cross $p$.'

guide_notes: |
  **Scoring.**
  - 1 (2 pts): 1 point for image points halfway along each ray from $P$ (all three), 1 point for a labeled triangle $A'B'C'$. Small drawing error (half a grid unit): full credit if the halfway idea is clear.
  - 2 and 5 (2 pts each): 1 point for each correct choice, minus $\frac{1}{4}$ for each wrong choice. Lowest score 0.
  - 3a (1 pt): $\frac{3}{2}$ or 1.5. 3b (2 pts): 1 point for a correct method ($y = 1.5x$ or a proportion), 1 point for 18.
  - 4 (1 pt): $45^\circ$. A student who scales the angle (for example $30^\circ$ or $67.5^\circ$) still thinks a dilation changes angles; reteach with Lesson 3.4 QuickNotes.

  **Scoring notes (MLLs).** Score the math, not grammar or spelling. Accept a decimal comma (1,5 = 1.5), home-language words, and answers written as a drawing or labeled figure.
