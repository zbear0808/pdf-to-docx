id: Unit 3 Test B
doc_type: assessment
title: 'Unit 3 Test: Version B'
directions: 'NO WORK = NO CREDIT!'
total_points: 20
max_pages: 2

sections:
  - kind: plain
    items:
      - n: 1
        points: 3
        prompt: '$\triangle JKL$ can be taken to $\triangle J''K''L''$ using rigid motions and a dilation. Select **all** the equations that are true. (1/2 point off for each wrong choice.)'
        figure: Unit 3 Test B_ratios
        fig_w: 1.8
        choices:
          - '$\dfrac{J''K''}{JK} = \dfrac{L''K''}{LK}$'
          - '$\dfrac{KL}{K''L''} = \dfrac{J''L''}{JL}$'
          - '$\dfrac{J''L''}{J''K''} = \dfrac{JL}{JK}$'
          - '$\dfrac{K''J''}{K''L''} = \dfrac{KL}{KJ}$'
          - '$\dfrac{LJ}{L''J''} = \dfrac{LK}{L''K''}$'
          - '$\dfrac{JK}{KL} = \dfrac{J''L''}{K''L''}$'
        choice_cols: 3
        answer: '[A], [C], [E]. Each one compares matching sides in the same order. [B] puts the original on top on the left and the image on top on the right; [D] flips one side of the equation; [F] matches $\overline{KL}$ with $\overline{K''L''}$ but $\overline{JK}$ with $\overline{J''L''}$.'
        work: 0.1
      - n: 2
        points: 3
        prompt: 'In $\triangle FGH$, $\overline{JK} \parallel \overline{GH}$. Solve for $x$.'
        figure: Unit 3 Test B_splitter
        fig_w: 2.1
        fill: [['$x =$', '$\frac{120}{13} \approx 9.23$']]
        box_w: 1.3
        answer: ['$\triangle FJK \sim \triangle FGH$, so use the whole side: $FG = 6 + 7 = 13$.', '$\frac{x}{20} = \frac{6}{13}$, so $13x = 120$ and $x = \frac{120}{13} \approx 9.23$.']
        work: 1.0
      - n: 3
        prompt: 'The two triangles are similar. The figures are not drawn to scale. (1 pt for each box)'
        figure: Unit 3 Test B_similar
        fig_w: 2.7
        layout: stacked
        parts:
          - label: a.
            points: 1
            prompt: 'Complete the similarity statement.'
            frame: [['$\triangle JGH \sim \triangle$', '$YZX$', '']]
            answer: '$m\angle J = 180^\circ - 48^\circ - 70^\circ = 62^\circ = m\angle Y$, so $J \to Y$, $G \to Z$, $H \to X$.'
            work: 0
          - label: b.
            points: 1
            prompt: 'What is the scale factor that moves $\triangle XYZ$ onto $\triangle HJG$?'
            fill: [['Scale factor:', '4']]
            box_w: 1.0
            answer: '$\frac{JG}{YZ} = \frac{20}{5} = 4$'
            work: 0.4
          - label: c.
            points: 4
            prompt: 'Find each measure.'
            fill: [['$XY =$', '4'], ['$XZ =$', '4.75'], ['$m\angle J =$', '$62^\circ$'], ['$m\angle X =$', '$70^\circ$']]
            fill_cols: 2
            box_w: 1.0
            answer: '$XY = 16 \div 4 = 4$, $XZ = 19 \div 4 = 4.75$, $m\angle X = m\angle H = 70^\circ$'
            work: 0.5
        page_break_after: true
      - n: 4
        prompt: 'Use $\triangle JKL$ and point $Q$. Use a ruler.'
        figure: Unit 3 Test B_dilate
        fig_w: 2.4
        parts:
          - label: a.
            points: 2
            prompt: 'Dilate $\triangle JKL$ using center $Q$ and scale factor 3. Label the image $J''K''L''$.'
            answer: 'See the red image. $J''$ and $K''$ stay on line $JK$, with $QJ'' = 3 \cdot QJ$ and $QK'' = 3 \cdot QK$. $L''$ is on ray $QL$ with $QL'' = 3 \cdot QL$.'
            work: 0.2
          - label: b.
            points: 1
            prompt: 'How does $\angle L''$ compare to $\angle L$? Explain.'
            frame:
              - ['$\angle L''$ is', 'congruent to', '$\angle L$.']
              - ['Reason:', 'Dilations do not change angle measures.', '', 3.2]
            answer: 'So $m\angle L'' = m\angle L$.'
            work: 0.3
      - n: 5
        points: 2
        prompt: 'Rectangle $GHJK$ has some right triangles inside it. $MN = 9$ and $MK = 15$. Find $KN$.'
        figure: Unit 3 Test B_rect
        fig_w: 2.6
        fill: [['$KN =$', '12 units']]
        box_w: 1.1
        answer: ['$\triangle MNK$ has a right angle at $N$. Its hypotenuse is $\overline{MK}$.', '$9^2 + KN^2 = 15^2$, so $KN^2 = 144$ and $KN = 12$.']
        work: 1.7
      - n: 6
        points: 3
        prompt: '$\triangle PQR \sim \triangle XYZ$. Write a sequence of transformations that moves $\triangle PQR$ onto $\triangle XYZ$. Write one move in each box. For a dilation, name the center and the scale factor.'
        figure: Unit 3 Test B_seq
        fig_w: 2.2
        fill:
          - ['Step 1:', 'Dilate with center $Q$ and scale factor $\frac{5}{2}$.']
          - ['Step 2:', 'Reflect across line $QR$.']
          - ['Step 3:', 'Translate $Q$ to $Y$.']
        box_w: 3.0
        answer: 'Scale factor $\frac{XZ}{PR} = \frac{10}{4} = \frac{5}{2}$. $\triangle XYZ$ faces the other way, so a reflection is needed. After Steps 1-2, $P$ is below $Q$; the translation lands $P$ on $X$, $Q$ on $Y$, and $R$ on $Z$.'
        work: 0.6

guide_notes: |
  **Scoring (20 pts).** Same rubric as Version A.
  - Problem 1 (3 pts): 1 pt for each of [A], [C], [E]; 1/2 pt off for each wrong choice (lowest score 0).
  - Problem 2 (3 pts): 1 pt for a proportion that uses the whole side 13 (not 7), 1 pt for solving, 1 pt for $\frac{120}{13}$ or 9.23. The proportion $\frac{x}{20} = \frac{6}{7}$ (part over part) earns 1 pt for work at most.
  - Problem 3 (6 pts): 1 pt per box. Follow through on parts b and c from a wrong statement in part a. Accept 4 or "4 to 1". A scale factor of $\frac{1}{4}$ goes the wrong way (0 pts for part b), but follow through on part c.
  - Problem 4 (3 pts): part a, 1 pt for each image point on the correct ray at about 3 times the distance (2 pts for all three); part b, 1 pt for "congruent" or "the same measure" with a reason (dilations keep angle measures).
  - Problem 5 (2 pts): 1 pt for the Pythagorean theorem (or a 9-12-15 triangle), 1 pt for 12. Also accept a similarity method that reaches 12.
  - Problem 6 (3 pts): 1 pt per move: a dilation by $\frac{5}{2}$ with a center, a reflection (any line that flips the triangle), and a translation that says where it goes. Accept any valid order. Take 1/2 pt off a dilation with no center or with scale factor $\frac{2}{5}$.

  **MLL notes.** Score the math, not grammar or spelling. Accept "same", "equal", or a home-language word for congruent, "flip", "slide", "grow by 5/2" for the moves, and a decimal comma (9,23). Accept answers that end with the claim after the work.

  **Version B vs A.** Same targets, item types, and points. New letters, numbers, and orientation: Problem 3 asks for an enlargement (scale factor 4) instead of a reduction, Problem 5 uses the left triangle, and Problem 6 reflects across a horizontal line.
