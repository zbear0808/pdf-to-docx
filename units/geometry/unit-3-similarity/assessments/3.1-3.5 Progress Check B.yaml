id: 3.1-3.5 Progress Check B
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: B
parallel_to: 3.1-3.5 Progress Check A
title: 'Progress check: lessons 3.1-3.5'
directions: 'Show your work.'
total_points: 9
max_pages: 2
targets:
  - id: LT1
    understand: 'a dilation moves each point along the ray from the center to $k$ times as far, so $k > 1$ enlarges and $0 < k < 1$ shrinks'
    able_to: 'dilate a figure given a center and a scale factor'
    standard: G-SRT.A.1
  - id: LT2
    understand: 'a dilation multiplies every length by the scale factor $k$'
    able_to: 'find $k$ from a side and its image, and use $k$ to find a missing length'
    standard: G-SRT.A.1b
  - id: LT3
    understand: 'a dilation keeps angle measures and takes a line that misses the center to a parallel line (a line through the center to itself)'
    able_to: 'tell what a dilation does to angles, lines, and segments'
    standard: G-SRT.A.1a

sections:
  - kind: plain
    target: LT1
    items:
      - id: q1
        target: LT1
        type: cr
        demand: pwoc
        points: 2
        prompt: 'Dilate $\triangle RST$ using center $Q$ and scale factor 2. Label the image $\triangle R''S''T''$.'
        figure: 3.1-3.5 Progress Check B_q1
        fig_w: 2.7
        work: 0
        answer: '$R$ is 1 left, 3 up from $Q$, so $R''$ is 2 left, 6 up. $S$: 5 left, 1 up, so $S''$ is 10 left, 2 up. $T$: 5 left, 3 up, so $T''$ is 10 left, 6 up.'
      - id: q2
        target: LT1
        type: sr
        demand: mem
        key: D
        points: 1
        prompt: 'Rectangle $WXYZ$ is dilated to make rectangle $W''X''Y''Z''$. Which scale factor makes the image **smaller** than $WXYZ$?'
        choices: ['3', '$\frac{4}{3}$', '1', '$\frac{3}{5}$']
        choice_cols: 4
        answer: '[D] $\frac{3}{5}$ is between 0 and 1, so every length shrinks. (1 keeps the same size. 3 and $\frac{4}{3}$ make it larger.)'
        distractors:
          A: 'thinks a larger $k$ shrinks it'
          B: 'reads any fraction as small'
          C: 'thinks $k = 1$ shrinks it'

  - kind: plain
    target: LT2
    items:
      - id: q3
        target: LT2
        type: cr
        model:
          kind: scaled_rectangles
          source_name: G
          image_name: H
          known_axis: width
          source_known: 6
          image_known: 15
          given_other: 4
          given_on: source
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check B_q3
        fig_w: 3.0
        parts:
          - label: a.
            demand: pwoc
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            demand: pwoc
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other} = {value:q3.answer}$'
            work: 0.5

  - kind: plain
    target: LT3
    page_break_before: true
    items:
      - id: q5
        target: LT3
        type: sr
        demand: pwc
        key: 'A, C, D'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $d$ after a dilation.'
          - 'Each wrong or missing choice loses 1 point.'
        figure: 3.1-3.5 Progress Check B_q5
        fig_w: 2.6
        choices: ['$a$', '$b$', '$c$', '$d$', '$e$']
        choice_cols: 5
        answer: '[A], [C], [D]. A dilation takes $d$ to a parallel line ($a$ or $c$), or to $d$ itself when the center is on $d$. Lines $b$ and $e$ cross $d$. A blank or all five scores 0.'
      - id: q6
        target: LT3
        type: sr
        demand: mem
        key: 'A, D, F'
        select_all: true
        points: 2
        prompt:
          - 'Quadrilateral $EFGH$ is dilated by scale factor 3 to make quadrilateral $E''F''G''H''$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{2}{3}$ point.'
        figure: 3.1-3.5 Progress Check B_q6
        fig_w: 2.1
        choices: ['$\frac{E^{\prime}F^{\prime}}{EF} = 3$', '$m\angle F'' = 3 \cdot m\angle F$', '$\overline{EF} \cong \overline{E''F''}$', '$\angle G \cong \angle G''$', '$\frac{EF}{E^{\prime}F^{\prime}} = 3$', '$\overline{EF} \parallel \overline{E''F''}$']
        choice_cols: 3
        answer: '[A], [D], [F]. Image lengths are 3 times the original, so $\frac{E^{\prime}F^{\prime}}{EF} = 3$. Angles do not change. A dilation takes $\overline{EF}$ to a parallel segment. ([B] triples the angle. [C]: $E''F'' = 3 \cdot EF$, not equal. [E] is upside down.) A blank or all six scores 0.'

guide_notes: |
  **Version B** mirrors Version A: same targets, item types, and points, with new letters, numbers, and orientation.

  **Nov 19: less is more, no headings.** Cut old item 4 ($m\angle D'E'F$, 1 pt): the same fact and level as old item 6's angle choices (Version A cut the same item). Old items 5-6 are now {num:q5}-{num:q6}; 10 to 9 points. No section headings; the directions say only "Show your work." Nov 20: a blank or every choice now scores 0 on the select-all items.

  **Targets.** LT1 (3.1): dilate a figure from a center by $k$; $k > 1$ enlarges, $0 < k < 1$ shrinks. LT2 (3.3): lengths multiply by $k$. LT3 (3.4): angles stay the same; a line goes to a parallel line, or to itself when the center is on it.

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $R'$, $S'$, $T'$ on the ray from $Q$ at twice the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle R'S'T'$. Rays are not required.
  - 3a: credit $\frac{{value:q3.image_known}}{{value:q3.source_known}}$, ${value:q3.scale|decimal2}$, or ${value:q3.scale}$. 3b: credit any valid method (${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other}$, $\frac{{value:q3.source_known}}{{value:q3.image_known}} = \frac{{value:q3.given_other}}{{value:q3.unknown_symbol}}$, or ${value:q3.unknown_symbol} = {value:q3.given_other} \cdot \frac{{value:q3.image_known}}{{value:q3.source_known}}$); carry through a wrong 3a; a correct setup with an arithmetic slip earns the point.
  - Items {num:q5}-{num:q6} (2 pts each): each wrong or missing choice takes off 1 on item {num:q5} and $\frac{2}{3}$ on item {num:q6} (2 divided by the number of wrong choices), lowest 0. Item {num:q6}'s angle pair ([B] triples the angle, [D] keeps it) is the LT3 angle evidence; reteach with the Lesson 3.4 warm-up and QuickNotes LT 1.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2}), home-language words or cognates, and labels such as R1 for $R'$.
