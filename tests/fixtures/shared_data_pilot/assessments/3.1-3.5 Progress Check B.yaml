id: 3.1-3.5 Progress Check B
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: B
parallel_to: 3.1-3.5 Progress Check A
title: 'Progress check: lessons 3.1-3.5'
directions: 'Show your work. Use the grid or a ruler.'
total_points: 10
max_pages: 2

sections:
  - kind: plain
    title: 'Lesson 3.1: dilate a figure'
    items:
      - id: q1
        points: 2
        prompt: 'Dilate $\triangle RST$ using center $Q$ and scale factor 2. Label the image $\triangle R''S''T''$.'
        figure: 3.1-3.5 Progress Check B_q1
        fig_w: 2.7
        work: 0
        answer: '$R$ is 1 left, 3 up from $Q$, so $R''$ is 2 left, 6 up. $S$: 5 left, 1 up, so $S''$ is 10 left, 2 up. $T$: 5 left, 3 up, so $T''$ is 10 left, 6 up.'
      - id: q2
        key: D
        points: 1
        prompt: 'Rectangle $WXYZ$ is dilated to make rectangle $W''X''Y''Z''$. Which scale factor makes the image **smaller** than $WXYZ$?'
        choices: ['3', '$\frac{4}{3}$', '1', '$\frac{3}{5}$']
        choice_cols: 4
        answer: '[D] $\frac{3}{5}$ is between 0 and 1, so every length shrinks. (1 keeps the same size. 3 and $\frac{4}{3}$ make it larger.)'
        work: 0.2
      - id: q3
        model:
          kind: scaled_rectangles
          source_name: G
          image_name: H
          known_axis: width
          source_known: 6
          image_known: 15
          given_other: 4
          given_on: source
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check B_q3
        fig_w: 3.0
        work: 0
        parts:
          - label: a.
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other} = {value:q3.answer}$'
            work: 0.5

  - kind: plain
    title: 'Lessons 3.3-3.5: lengths, angles, and lines'
    page_break_before: true
    items:
      - id: q4
        points: 1
        prompt: 'Here are $\triangle DEF$ and $\triangle D''E''F$. $\triangle D''E''F$ is a dilation of $\triangle DEF$ with center $F$. What is $m\angle D''E''F$?'
        figure: 3.1-3.5 Progress Check B_q4
        fig_w: 2.3
        fill: [['$m\angle D''E''F =$', '$75^\circ$']]
        answer: 'A dilation does not change angles. $\angle D''E''F$ matches $\angle DEF$, so it is $75^\circ$. (Check: $\frac{6}{10} = \frac{9}{15} = \frac{3}{5}$.)'
        work: 0.6
      - id: q5
        key: 'A, C, D'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $d$ after a dilation.'
          - 'Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check B_q5
        fig_w: 2.6
        choices: ['$a$', '$b$', '$c$', '$d$', '$e$']
        choice_cols: 5
        answer: '[A], [C], [D]. A dilation takes $d$ to a parallel line ($a$ or $c$), or to $d$ itself when the center is on $d$. Lines $b$ and $e$ cross $d$.'
        work: 0.2
      - id: q6
        key: 'A, D, F'
        select_all: true
        points: 2
        prompt:
          - 'Quadrilateral $EFGH$ is dilated by scale factor 3 to make quadrilateral $E''F''G''H''$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check B_q6
        fig_w: 2.1
        choices: ['$\frac{E^{\prime}F^{\prime}}{EF} = 3$', '$m\angle F'' = 3 \cdot m\angle F$', '$\overline{EF} \cong \overline{E''F''}$', '$\angle G \cong \angle G''$', '$\frac{EF}{E^{\prime}F^{\prime}} = 3$', '$\overline{EF} \parallel \overline{E''F''}$']
        choice_cols: 3
        answer: '[A], [D], [F]. Image lengths are 3 times the original, so $\frac{E^{\prime}F^{\prime}}{EF} = 3$. Angles do not change. A dilation takes $\overline{EF}$ to a parallel segment. ([B] triples the angle. [C]: $E''F'' = 3 \cdot EF$, not equal. [E] is upside down.)'
        work: 0.2

guide_notes: |
  **Version B** mirrors Version A: same targets, item types, and points, with new letters, numbers, and orientation.

  **Targets.** Items 1-3: I can dilate a figure given a center and scale factor, and find a scale factor (3.1, 3.3). Item 4: a dilation keeps angle measures (3.4). Item 5: a dilation takes a line to a parallel line or to itself (3.4). Item 6: lengths scale by $k$, angles stay, segments stay parallel (3.3-3.5).

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $R'$, $S'$, $T'$ on the ray from $Q$ at twice the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle R'S'T'$. Rays are not required.
  - Items 2 and 4 (1 pt each), item 3 (1 pt per part).
  - Item 3: credit ${value:q3.scale|decimal2}$ or ${value:q3.scale}$ in part a. In part b, carry through a wrong scale factor from part a (no double penalty).
  - Items 5 and 6 (2 pts each): start at 2 and subtract $\frac{1}{4}$ for each wrong pick and each missed correct choice. Minimum 0.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2}), home-language words or cognates, and labels such as R1 for $R'$. Item 4 needs only the number; the degree sign is not required.
