id: 3.1-3.5 Progress Check Retake A
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: Retake A
title: 'Progress check retake: lessons 3.1-3.5'
directions: 'Show your work. Use the grid or a ruler.'
total_points: 10
max_pages: 2

sections:
  - kind: plain
    title: 'Lesson 3.1: dilate a figure'
    items:
      - id: q1
        points: 2
        prompt: 'Dilate $\triangle GHK$ using center $C$ and scale factor $\frac{1}{2}$. Label the image $\triangle G''H''K''$.'
        figure: 3.1-3.5 Progress Check Retake A_q1
        fig_w: 2.7
        work: 0
        answer: '$G$ is 10 left, 6 up from $C$, so $G''$ is 5 left, 3 up. $H$: 4 left, 6 up, so $H''$ is 2 left, 3 up. $K$: 8 left, so $K''$ is 4 left.'
      - id: q2
        key: C
        points: 1
        prompt: 'Parallelogram $PQRS$ is dilated to make parallelogram $P''Q''R''S''$. Which scale factor makes the image **larger** than $PQRS$?'
        choices: ['$\frac{8}{9}$', '1', '$\frac{5}{4}$', '$\frac{1}{2}$']
        choice_cols: 4
        answer: '[C] $\frac{5}{4}$ is greater than 1, so every length grows. (1 keeps the same size. $\frac{8}{9}$ and $\frac{1}{2}$ make it smaller.)'
        work: 0.2
      - id: q3
        model:
          kind: scaled_rectangles
          source_name: S
          image_name: T
          known_axis: height
          source_known: 9
          image_known: 12
          given_other: 24
          given_on: image
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check Retake A_q3
        fig_w: 3.0
        work: 0
        parts:
          - label: a.
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol}$ is on ${value:q3.source_name}$, so divide: ${value:q3.given_other} \div {value:q3.scale} = {value:q3.answer}$. (Check: ${value:q3.scale} \cdot {value:q3.answer} = {value:q3.given_other}$.)'
            work: 0.5

  - kind: plain
    title: 'Lessons 3.3-3.5: lengths, angles, and lines'
    page_break_before: true
    items:
      - id: q4
        points: 1
        prompt: 'Here are $\triangle UVW$ and $\triangle UV''W''$. $\triangle UV''W''$ is a dilation of $\triangle UVW$ with center $U$. What is the length of $\overline{V''W''}$?'
        figure: 3.1-3.5 Progress Check Retake A_q4
        fig_w: 2.6
        fill: [['$V''W'' =$', '10']]
        answer: 'Scale factor: $\frac{4}{6} = \frac{8}{12} = \frac{2}{3}$. So $V''W'' = \frac{2}{3} \cdot 15 = 10$.'
        work: 0.6
      - id: q5
        key: 'A, B, D'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $m$ after a dilation.'
          - 'Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check Retake A_q5
        fig_w: 2.6
        choices: ['$j$', '$k$', '$\ell$', '$m$', '$n$']
        choice_cols: 5
        answer: '[A], [B], [D]. A dilation takes $m$ to a parallel line ($j$ or $k$), or to $m$ itself when the center is on $m$. Lines $\ell$ and $n$ cross $m$.'
        work: 0.2
      - id: q6
        key: 'B, D, F'
        select_all: true
        points: 2
        prompt:
          - '$\triangle ABC$ is dilated by scale factor 3 to make $\triangle DEF$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check Retake A_q6
        fig_w: 2.2
        choices: ['$m\angle D = 3 \cdot m\angle A$', '$\angle D \cong \angle A$', '$\frac{AB}{DE} = 3$', '$\frac{DE}{AB} = 3$', '$\overline{AB} \cong \overline{DE}$', '$\overline{AB} \parallel \overline{DE}$']
        choice_cols: 3
        answer: '[B], [D], [F]. Angles do not change. Image lengths are 3 times the original, so $\frac{DE}{AB} = 3$. A dilation takes $\overline{AB}$ to a parallel segment. ([A] triples the angle. [C] is upside down. [E]: $DE = 3 \cdot AB$, not equal.)'
        work: 0.2

guide_notes: |
  **Retake A** checks the same targets as Versions A and B, with no penalty for needing a second try. Item 1 uses a reduction ($k = \frac{1}{2}$), Item 2 asks for an enlargement, and Item 4 asks for a length instead of an angle.

  **Difficulty.** Two items are a step harder than on A and B, as in the source retake. In 3b, $y$ is on the smaller polygon, so students divide. In 4, students compute a length instead of reading off a kept angle. Retake B matches Retake A.

  **Targets.** Items 1-3: I can dilate a figure given a center and scale factor, and find a scale factor (3.1, 3.3). Item 4: lengths scale by $k$ (3.3, 3.5). Item 5: a dilation takes a line to a parallel line or to itself (3.4). Item 6: lengths scale by $k$, angles stay, segments stay parallel (3.3-3.5).

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $G'$, $H'$, $K'$ on segment $\overline{CG}$, $\overline{CH}$, $\overline{CK}$ at half the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle G'H'K'$.
  - Item 3b: ${value:q3.unknown_symbol}$ is on the smaller polygon, so students divide by ${value:q3.scale}$ (or multiply by ${value:q3.inverse_scale}$). The common error is ${value:q3.scale} \cdot {value:q3.given_other} = {value:q3.multiply_given}$. Carry through a wrong part a.
  - Item 4: common errors are $\frac{4}{2} \cdot 15 = 30$ (part to part) and $\frac{1}{3} \cdot 15 = 5$ (wrong piece).
  - Items 5 and 6 (2 pts each): start at 2 and subtract $\frac{1}{4}$ for each wrong pick and each missed correct choice. Minimum 0.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2} for ${value:q3.scale}$), home-language words or cognates, and labels such as G1 for $G'$.
