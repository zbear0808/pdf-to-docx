id: 3.1-3.5 Progress Check A
doc_type: assessment
schema_version: 1
numbering: auto
set: 3.1-3.5 Progress Check
form: A
title: 'Progress check: lessons 3.1-3.5'
directions: 'Show your work. Use the grid or a ruler.'
total_points: 10
max_pages: 2

sections:
  - kind: plain
    title: 'Lesson 3.1: dilate a figure'
    items:
      - id: q1
        points: 2
        prompt: 'Dilate $\triangle ABC$ using center $P$ and scale factor 2. Label the image $\triangle A''B''C''$.'
        figure: 3.1-3.5 Progress Check A_q1
        fig_w: 2.7
        work: 0
        answer: '$A$ is 2 right, 3 up from $P$, so $A''$ is 4 right, 6 up. $B$: 4 right, 2 up, so $B''$ is 8 right, 4 up. $C$: 3 right, 1 down, so $C''$ is 6 right, 2 down.'
      - id: q2
        key: A
        points: 1
        prompt: 'Parallelogram $JKLM$ is dilated to make parallelogram $J''K''L''M''$. Which scale factor makes the image **smaller** than $JKLM$?'
        choices: ['$\frac{7}{10}$', '1', '$\frac{5}{4}$', '2']
        choice_cols: 4
        answer: '[A] $\frac{7}{10}$ is between 0 and 1, so every length shrinks. (1 keeps the same size. $\frac{5}{4}$ and 2 make it larger.)'
        work: 0.2
      - id: q3
        model:
          kind: scaled_rectangles
          source_name: M
          image_name: N
          known_axis: height
          source_known: 8
          image_known: 12
          given_other: 10
          given_on: source
        prompt: 'Polygon ${value:q3.image_name}$ is a dilation of polygon ${value:q3.source_name}$.'
        figure: 3.1-3.5 Progress Check A_q3
        fig_w: 3.0
        work: 0
        parts:
          - label: a.
            points: 1
            prompt: 'What is the scale factor from ${value:q3.source_name}$ to ${value:q3.image_name}$?'
            fill: [['Scale factor:', '${value:q3.scale}$']]
            answer: '${value:q3.image_known} \div {value:q3.source_known} = {value:q3.scale}$'
            work: 0.5
          - label: b.
            points: 1
            prompt: '${value:q3.given_symbol} = {value:q3.given_other}$. What is ${value:q3.unknown_symbol}$?'
            fill: [['${value:q3.unknown_symbol} =$', '{value:q3.answer}']]
            answer: '${value:q3.unknown_symbol} = {value:q3.scale} \cdot {value:q3.given_other} = {value:q3.answer}$'
            work: 0.5

  - kind: plain
    title: 'Lessons 3.3-3.5: lengths, angles, and lines'
    page_break_before: true
    items:
      - id: q4
        points: 1
        prompt: 'Here are $\triangle ABC$ and $\triangle A''B''C$. $\triangle A''B''C$ is a dilation of $\triangle ABC$ with center $C$. What is $m\angle A''B''C$?'
        figure: 3.1-3.5 Progress Check A_q4
        fig_w: 2.3
        fill: [['$m\angle A''B''C =$', '$40^\circ$']]
        answer: 'A dilation does not change angles. $\angle A''B''C$ matches $\angle ABC$, so it is $40^\circ$. (Check: $\frac{6}{9} = \frac{4}{6} = \frac{2}{3}$.)'
        work: 0.6
      - id: q5
        key: 'B, C, E'
        select_all: true
        points: 2
        prompt:
          - 'Select **all** the lines that could be the image of line $p$ after a dilation.'
          - 'Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check A_q5
        fig_w: 2.6
        choices: ['$\ell$', '$m$', '$n$', '$o$', '$p$']
        choice_cols: 5
        answer: '[B], [C], [E]. A dilation takes $p$ to a parallel line ($m$ or $n$), or to $p$ itself when the center is on $p$. Lines $\ell$ and $o$ cross $p$.'
        work: 0.2
      - id: q6
        key: 'B, C, E'
        select_all: true
        points: 2
        prompt:
          - 'Quadrilateral $ABCD$ is dilated by scale factor 2 to make quadrilateral $A''B''C''D''$.'
          - 'Select **all** the true statements. Each wrong or missing choice loses $\frac{1}{4}$ point.'
        figure: 3.1-3.5 Progress Check A_q6
        fig_w: 2.3
        choices: ['$\frac{AD}{A^{\prime}D^{\prime}} = 2$', '$\frac{A^{\prime}D^{\prime}}{AD} = 2$', '$\angle C \cong \angle C''$', '$m\angle C'' = 2 \cdot m\angle C$', '$\overline{AD} \parallel \overline{A''D''}$', '$\overline{AD} \cong \overline{A''D''}$']
        choice_cols: 3
        answer: '[B], [C], [E]. Image lengths are 2 times the original, so $\frac{A^{\prime}D^{\prime}}{AD} = 2$. Angles do not change. A dilation takes $\overline{AD}$ to a parallel segment. ([A] is upside down. [D] doubles the angle. [F]: $A''D'' = 2 \cdot AD$, not equal.)'
        work: 0.2

guide_notes: |
  **Targets.** Items 1-3: I can dilate a figure given a center and scale factor, and find a scale factor (3.1, 3.3). Item 4: a dilation keeps angle measures (3.4). Item 5: a dilation takes a line to a parallel line or to itself (3.4). Item 6: lengths scale by $k$, angles stay, segments stay parallel (3.3-3.5).

  **Scoring.**
  - Item 1 (2 pts): $\frac{1}{2}$ pt each for $A'$, $B'$, $C'$ on the ray from $P$ at twice the distance; $\frac{1}{2}$ pt for connecting and labeling $\triangle A'B'C'$. Rays are not required.
  - Items 2 and 4 (1 pt each), item 3 (1 pt per part).
  - Item 3: credit ${value:q3.scale|decimal2}$ or ${value:q3.scale}$ in part a. In part b, carry through a wrong scale factor from part a (no double penalty).
  - Items 5 and 6 (2 pts each): start at 2 and subtract $\frac{1}{4}$ for each wrong pick and each missed correct choice. Minimum 0.

  **Scoring notes (MLL).** Score the math, not English. Accept a decimal comma ({value:q3.scale|comma2}), home-language words or cognates, and labels such as A1 for $A'$. Item 4 needs only the number; the degree sign is not required.
